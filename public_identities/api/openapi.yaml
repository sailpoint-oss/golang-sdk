openapi: 3.0.1
info:
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  description: "Use these APIs to interact with the Identity Security Cloud platform\
    \ to achieve repeatable, automated processes with greater scalability. We encourage\
    \ you to join the SailPoint Developer Community forum at https://developer.sailpoint.com/discuss\
    \ to connect with other developers using our APIs."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://developer.sailpoint.com/discuss/tos
  title: Identity Security Cloud API - Public Identities
  version: v1
servers:
- description: This is the production API server.
  url: "https://{tenant}.api.identitynow.com"
  variables:
    tenant:
      default: sailpoint
      description: "This is the name of your tenant, typically your company's name."
- description: This is the versioned API server.
  url: "https://{apiUrl}"
  variables:
    apiUrl:
      default: sailpoint.api.identitynow.com
      description: This is the api url of your tenant
security:
- userAuth:
  - sp:scopes:all
tags:
- description: "Use this API in conjunction with [Public Identites Config](https://developer.sailpoint.com/docs/api/public-identities-config)\
    \ to enable non-administrators to view identities' publicly visible attributes.\
    \ \nWith this functionality in place, non-administrators can view identity attributes\
    \ other than the default attributes (email, lifecycle state, and manager), depending\
    \ on which identity attributes their organization administrators have made public.\
    \ \nThis can be helpful for access approvers, certification reviewers, managers\
    \ viewing their direct reports' access, and source owners viewing their tasks.\n"
  name: Public Identities
paths:
  /public-identities/v1:
    get:
      description: Get a list of public identities.  Set `add-core-filters` to `true`
        to exclude incomplete identities and uncorrelated accounts.
      operationId: getPublicIdentitiesV1
      parameters:
      - description: |-
          Max number of results to return.
          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: 250
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 250
          format: int32
          maximum: 250
          minimum: 0
          type: integer
        style: form
      - description: |-
          Offset into the full result set. Usually specified with *limit* to paginate through the results.
          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: |-
          If *true* it will populate the *X-Total-Count* response header with the number of results that would be returned if *limit* and *offset* were ignored.

          Since requesting a total count can have a performance impact, it is recommended not to send **count=true** if that value will not be used.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: true
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: |-
          Filter results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)

          Filtering is supported for the following fields and operators:

          **id**: *eq, in*

          **alias**: *eq, sw*

          **email**: *eq, sw*

          **firstname**: *eq, sw*

          **lastname**: *eq, sw*
        example: firstname eq "John"
        explode: true
        in: query
        name: filters
        required: false
        schema:
          type: string
        style: form
      - description: |-
          If *true*, only get identities which satisfy ALL the following criteria in addition to any criteria specified by *filters*:
            - Should be either correlated or protected.
            - Should not be "spadmin" or "cloudadmin".
            - uid should not be null.
            - lastname should not be null.
            - email should not be null.
        example: false
        explode: true
        in: query
        name: add-core-filters
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: |-
          Sort results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)

          Sorting is supported for the following fields: **name**
        example: name
        explode: true
        in: query
        name: sorters
        required: false
        schema:
          format: comma-separated
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 2c9180857182305e0171993735622948
                name: Alison Ferguso
                alias: alison.ferguso
                email: alison.ferguso@acme-solar.com
                status: Active
                manager:
                  type: IDENTITY
                  id: 2c9180a46faadee4016fb4e018c20639
                  name: Thomas Edison
                attributes:
                - key: phone
                  name: Phone
                  value: "5125551234"
                - key: country
                  name: Country
                  value: US
              - id: 2c9180a46faadee4016fb4e018c20639
                name: Thomas Edison
                alias: thomas.edison
                email: thomas.edison@acme-solar.com
                status: Active
                manager:
                  type: IDENTITY
                  id: 2c918086676d3e0601677611dbde220f
                  name: Mister Manager
                attributes:
                - key: phone
                  name: Phone
                  value: "5125554321"
                - key: country
                  name: Country
                  value: US
              schema:
                items:
                  $ref: '#/components/schemas/PublicIdentity'
                type: array
          description: A list of public identity objects.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getPublicIdentitiesV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getPublicIdentitiesV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - sp:scopes:default
      summary: Get list of public identities
      tags:
      - Public Identities
      x-sailpoint-userLevels:
      - USER
  /public-identities/v2/visible-attributes:
    get:
      description: |-
        Returns the default and configured identity attribute keys (with display names) that are allowed for public-identity search and projection. Call this before POST /public-identities/v2/search to learn which field keys are valid in query fields and sort.

        Any authenticated user with the default scope can call this endpoint.
      operationId: getPublicIdentitiesVisibleAttributesV2
      parameters:
      - description: Use this header to enable this experimental API.
        example: true
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                defaultAttributes:
                - key: id
                  name: id
                - key: displayName
                  name: name
                - key: name
                  name: alias
                - key: email
                  name: email
                - key: cloudLifecycleState
                  name: status
                - key: identityState
                  name: identity state
                - key: manager.id
                  name: manager id
                - key: manager.displayName
                  name: manager name
                - key: manager.name
                  name: manager alias
                configuredAttributes:
                - key: displayName
                  name: Display Name
                - key: lastSyncDate
                  name: Last Sync Date
              schema:
                $ref: '#/components/schemas/PublicIdentityVisibleAttributes'
          description: Request succeeded.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getPublicIdentitiesV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  summary: An example of a 404 response object
                  value:
                    detailCode: 404 Not found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server did not find a current representation for the
                        target resource.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - returned if the request URL refers to a resource
            or object that does not exist
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getPublicIdentitiesV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - sp:scopes:default
      summary: Get public identity visible attributes
      tags:
      - Public Identities
      x-sailpoint-userLevels:
      - USER
  /public-identities/v2/search:
    post:
      description: |-
        Search public identities using a composite query and return matching records.

        The root query set combines criteria with AND and must include attributes.identityState.exact = ACTIVE. The field keys must come from GET /public-identities/v2/visible-attributes and may use the prefix "attributes." and/or the suffix ".exact". See the request examples for the required exact payload structure.

        Any authenticated user with the default scope can call this endpoint.
      operationId: searchPublicIdentitiesV2
      parameters:
      - description: |-
          Max number of results to return.
          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: 250
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 250
          format: int32
          maximum: 250
          minimum: 0
          type: integer
        style: form
      - description: |-
          Offset into the full result set. Usually specified with *limit* to paginate through the results.
          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: |-
          If *true* it will populate the *X-Total-Count* response header with the number of results that would be returned if *limit* and *offset* were ignored.

          Since requesting a total count can have a performance impact, it is recommended not to send **count=true** if that value will not be used.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: true
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Use this header to enable this experimental API.
        example: true
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              singleEntryComposite:
                summary: Root AND with ACTIVE gate and one TEXT entry
                value:
                  queryType: COMPOSITE
                  indices:
                  - identities
                  includeNested: false
                  sort:
                  - name
                  querySet:
                    matchAny: false
                    entries:
                    - queryType: TEXT
                      textQuery:
                        fields:
                        - attributes.identityState.exact
                        terms:
                        - ACTIVE
                        matchAny: false
                        contains: false
                        strict: true
                    - queryType: TEXT
                      textQuery:
                        terms:
                        - Mara
                        fields:
                        - name
                        - email
                        matchAny: true
                        contains: true
                        strict: true
              multiEntryComposite:
                summary: Root AND with ACTIVE gate and multiple TEXT entries
                value:
                  queryType: COMPOSITE
                  indices:
                  - identities
                  includeNested: false
                  sort:
                  - name
                  querySet:
                    matchAny: false
                    entries:
                    - queryType: TEXT
                      textQuery:
                        fields:
                        - attributes.identityState.exact
                        terms:
                        - ACTIVE
                        matchAny: false
                        contains: false
                        strict: true
                    - queryType: TEXT
                      textQuery:
                        terms:
                        - M
                        fields:
                        - email
                        matchAny: true
                        contains: false
                        strict: true
                    - queryType: TEXT
                      textQuery:
                        terms:
                        - M
                        fields:
                        - name
                        matchAny: true
                        contains: false
                        strict: true
              nestedCompositeAndOr:
                summary: Root AND with ACTIVE gate and nested OR of TEXT entries
                value:
                  queryType: COMPOSITE
                  indices:
                  - identities
                  includeNested: false
                  sort:
                  - name
                  querySet:
                    matchAny: false
                    entries:
                    - queryType: TEXT
                      textQuery:
                        fields:
                        - attributes.identityState.exact
                        terms:
                        - ACTIVE
                        matchAny: false
                        contains: false
                        strict: true
                    - queryType: COMPOSITE
                      querySet:
                        matchAny: true
                        entries:
                        - queryType: TEXT
                          textQuery:
                            terms:
                            - Mara
                            fields:
                            - name
                            matchAny: false
                            contains: false
                            strict: true
                        - queryType: TEXT
                          textQuery:
                            terms:
                            - Mara
                            fields:
                            - email
                            matchAny: false
                            contains: false
                            strict: true
            schema:
              $ref: '#/components/schemas/PublicIdentitiesSearchRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 2c9180857182305e0171993735622948
                name: sample.user
                displayName: Sample User
                email: someemail@identitynow.com
                identityState: ACTIVE
                cloudLifecycleState: Active
                manager:
                  id: 2c9180a46faadee4016fb4e018c20639
                  name: thomas.edison
                  displayName: Thomas Edison
                attributes:
                  country: US
              schema:
                items:
                  $ref: '#/components/schemas/PublicIdentityV2'
                type: array
          description: "Request succeeded. Body is an array of PublicIdentityV2. When\
            \ count=true, X-Total-Count may be set with the total matching count (ignoring\
            \ limit/offset)."
          headers:
            X-Total-Count:
              description: Total number of matching results when count=true.
              example: 30
              explode: false
              schema:
                format: int32
                type: integer
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getPublicIdentitiesV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  summary: An example of a 404 response object
                  value:
                    detailCode: 404 Not found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server did not find a current representation for the
                        target resource.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - returned if the request URL refers to a resource
            or object that does not exist
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getPublicIdentitiesV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - sp:scopes:default
      summary: Search public identities
      tags:
      - Public Identities
      x-sailpoint-userLevels:
      - USER
components:
  parameters:
    limit:
      description: |-
        Max number of results to return.
        See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
      example: 250
      explode: true
      in: query
      name: limit
      required: false
      schema:
        default: 250
        format: int32
        maximum: 250
        minimum: 0
        type: integer
      style: form
    offset:
      description: |-
        Offset into the full result set. Usually specified with *limit* to paginate through the results.
        See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
      example: 0
      explode: true
      in: query
      name: offset
      required: false
      schema:
        default: 0
        format: int32
        minimum: 0
        type: integer
      style: form
    count:
      description: |-
        If *true* it will populate the *X-Total-Count* response header with the number of results that would be returned if *limit* and *offset* were ignored.

        Since requesting a total count can have a performance impact, it is recommended not to send **count=true** if that value will not be used.

        See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
      example: true
      explode: true
      in: query
      name: count
      required: false
      schema:
        default: false
        type: boolean
      style: form
  responses:
    "400":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
      description: Client Error - Returned if the request body is invalid.
    "401":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/getPublicIdentitiesV1_401_response'
      description: "Unauthorized - Returned if there is no authorization header, or\
        \ if the JWT token is expired."
    "403":
      content:
        application/json:
          examples:
            "403":
              summary: An example of a 403 response object
              value:
                detailCode: 403 Forbidden
                trackingId: b21b1f7ce4da4d639f2c62a57171b427
                messages:
                - locale: en-US
                  localeOrigin: DEFAULT
                  text: The server understood the request but refuses to authorize
                    it.
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
      description: "Forbidden - Returned if the user you are running as, doesn't have\
        \ access to this end-point."
    "404":
      content:
        application/json:
          examples:
            "404":
              summary: An example of a 404 response object
              value:
                detailCode: 404 Not found
                trackingId: b21b1f7ce4da4d639f2c62a57171b427
                messages:
                - locale: en-US
                  localeOrigin: DEFAULT
                  text: The server did not find a current representation for the target
                    resource.
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
      description: Not Found - returned if the request URL refers to a resource or
        object that does not exist
    "429":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/getPublicIdentitiesV1_429_response'
      description: Too Many Requests - Returned in response to too many requests in
        a given period of time - rate limited. The Retry-After header in the response
        includes how long to wait before trying again.
    "500":
      content:
        application/json:
          examples:
            "500":
              summary: An example of a 500 response object
              value:
                detailCode: 500.0 Internal Fault
                trackingId: b21b1f7ce4da4d639f2c62a57171b427
                messages:
                - locale: en-US
                  localeOrigin: DEFAULT
                  text: An internal fault occurred.
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
      description: Internal Server Error - Returned if there is an unexpected error.
  schemas:
    DtoType:
      description: An enumeration of the types of DTOs supported within the IdentityNow
        infrastructure.
      enum:
      - ACCOUNT_CORRELATION_CONFIG
      - ACCESS_PROFILE
      - ACCESS_REQUEST_APPROVAL
      - ACCOUNT
      - APPLICATION
      - CAMPAIGN
      - CAMPAIGN_FILTER
      - CERTIFICATION
      - CLUSTER
      - CONNECTOR_SCHEMA
      - ENTITLEMENT
      - GOVERNANCE_GROUP
      - IDENTITY
      - IDENTITY_PROFILE
      - IDENTITY_REQUEST
      - MACHINE_IDENTITY
      - LIFECYCLE_STATE
      - PASSWORD_POLICY
      - ROLE
      - RULE
      - SOD_POLICY
      - SOURCE
      - TAG
      - TAG_CATEGORY
      - TASK_RESULT
      - REPORT_RESULT
      - SOD_VIOLATION
      - ACCOUNT_ACTIVITY
      - WORKGROUP
      example: IDENTITY
      type: string
    IdentityReference:
      description: The manager for the identity.
      example:
        name: Thomas Edison
        id: 2c9180a46faadee4016fb4e018c20639
        type: IDENTITY
      nullable: true
      properties:
        type:
          $ref: '#/components/schemas/DtoType'
        id:
          description: Identity id
          example: 2c9180a46faadee4016fb4e018c20639
          type: string
        name:
          description: Human-readable display name of identity.
          example: Thomas Edison
          type: string
      title: Identity Reference
      type: object
    PublicIdentity:
      description: Details about a public identity
      example:
        manager:
          name: Thomas Edison
          id: 2c9180a46faadee4016fb4e018c20639
          type: IDENTITY
        name: Alison Ferguso
        alias: alison.ferguso
        attributes:
        - name: Country
          value: US
          key: country
        - name: Country
          value: US
          key: country
        id: 2c9180857182305e0171993735622948
        identityState: ACTIVE
        email: alison.ferguso@acme-solar.com
        status: Active
      properties:
        id:
          description: Identity id
          example: 2c9180857182305e0171993735622948
          type: string
        name:
          description: Human-readable display name of identity.
          example: Alison Ferguso
          type: string
        alias:
          description: Alternate unique identifier for the identity.
          example: alison.ferguso
          type: string
        email:
          description: Email address of identity.
          example: alison.ferguso@acme-solar.com
          nullable: true
          type: string
        status:
          description: The lifecycle status for the identity
          example: Active
          nullable: true
          type: string
        identityState:
          description: |
            The current state of the identity, which determines how Identity Security Cloud interacts with the identity.
            An identity that is Active will be included identity picklists in Request Center, identity processing, and more.
            Identities that are Inactive will be excluded from these features.
          enum:
          - ACTIVE
          - INACTIVE_SHORT_TERM
          - INACTIVE_LONG_TERM
          - null
          example: ACTIVE
          nullable: true
          type: string
        manager:
          $ref: '#/components/schemas/IdentityReference'
        attributes:
          description: The public identity attributes of the identity
          items:
            $ref: '#/components/schemas/PublicIdentity_attributes_inner'
          type: array
      title: Public Identity
      type: object
    LocaleOrigin:
      description: "An indicator of how the locale was selected. *DEFAULT* means the\
        \ locale is the system default. *REQUEST* means the locale was selected from\
        \ the request context (i.e., best match based on the *Accept-Language* header).\
        \ Additional values may be added in the future without notice."
      enum:
      - DEFAULT
      - REQUEST
      - null
      example: DEFAULT
      nullable: true
      type: string
    ErrorMessageDto:
      example:
        localeOrigin: DEFAULT
        text: The request was syntactically correct but its content is semantically
          invalid.
        locale: en-US
      properties:
        locale:
          description: "The locale for the message text, a BCP 47 language tag."
          example: en-US
          nullable: true
          type: string
        localeOrigin:
          $ref: '#/components/schemas/LocaleOrigin'
        text:
          description: Actual text of the error message in the indicated locale.
          example: The request was syntactically correct but its content is semantically
            invalid.
          type: string
      title: Error Message Dto
      type: object
    ErrorResponseDto:
      example:
        causes:
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        messages:
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        detailCode: 400.1 Bad Request Content
        trackingId: e7eab60924f64aa284175b9fa3309599
      properties:
        detailCode:
          description: Fine-grained error code providing more detail of the error.
          example: 400.1 Bad Request Content
          type: string
        trackingId:
          description: Unique tracking id for the error.
          example: e7eab60924f64aa284175b9fa3309599
          type: string
        messages:
          description: Generic localized reason for error
          items:
            $ref: '#/components/schemas/ErrorMessageDto'
          type: array
        causes:
          description: Plain-text descriptive reasons to provide additional detail
            to the text provided in the messages field
          items:
            $ref: '#/components/schemas/ErrorMessageDto'
          type: array
      title: Error Response Dto
      type: object
    PublicIdentityAttributeConfig:
      description: Maps an identity attribute key to its display name.
      properties:
        key:
          description: "Attribute / search field key (e.g. email, manager.displayName)."
          example: country
          type: string
        name:
          description: Human-readable display name for the attribute.
          example: Country
          type: string
      required:
      - key
      - name
      title: Public Identity Attribute Config
      type: object
    PublicIdentityVisibleAttributes:
      description: Default and configured identity attribute keys with display names
        exposed by the public identities API.
      example:
        configuredAttributes:
        - key: displayName
          name: Display Name
        - key: lastSyncDate
          name: Last Sync Date
        defaultAttributes:
        - key: id
          name: id
        - key: email
          name: email
        - key: manager.displayName
          name: manager name
      properties:
        defaultAttributes:
          description: Always-available public-identity field keys for search and
            sort. Fixed platform list. `key` is the search field name; `name` is the
            display label.
          example:
          - key: id
            name: id
          - key: email
            name: email
          - key: manager.displayName
            name: manager name
          items:
            $ref: '#/components/schemas/PublicIdentityAttributeConfig'
          type: array
        configuredAttributes:
          description: Tenant-configured public attributes from public-identities
            config (same source as public-identities-config). These keys are also
            allowed in search/sort and appear under `attributes` on search results.
          example:
          - key: displayName
            name: Display Name
          - key: lastSyncDate
            name: Last Sync Date
          items:
            $ref: '#/components/schemas/PublicIdentityAttributeConfig'
          type: array
      required:
      - configuredAttributes
      - defaultAttributes
      title: Public Identity Visible Attributes
      type: object
    PublicIdentitiesTextQuery:
      additionalProperties: false
      description: Text query clause used inside a TEXT composite entry.
      properties:
        fields:
          description: "Attribute keys to search. Base keys must match GET /public-identities/v2/visible-attributes\
            \ (defaultAttributes + configuredAttributes). Optional \"attributes.\"\
            \ prefix and/or \".exact\" suffix (e.g. email, attributes.email, email.exact,\
            \ attributes.email.exact)."
          example:
          - name
          - email
          items:
            type: string
          minItems: 1
          type: array
        terms:
          description: Search terms. Each value must be a non-blank string or a JSON
            boolean.
          example:
          - Mara
          items:
            $ref: '#/components/schemas/PublicIdentitiesTextQuery_terms_inner'
          minItems: 1
          type: array
        matchAny:
          default: false
          description: "When true, terms/fields are OR'd within this text query. Optional\
            \ for normal search clauses. The mandatory ACTIVE identityState gate entry\
            \ must set this to false."
          example: true
          type: boolean
        contains:
          default: false
          description: "When true, matches substrings. Optional for normal search\
            \ clauses. The mandatory ACTIVE identityState gate entry must set this\
            \ to false."
          example: true
          type: boolean
        strict:
          default: false
          description: "When true, applies strict matching. Optional for normal search\
            \ clauses. The mandatory ACTIVE identityState gate entry must set this\
            \ to true."
          example: true
          type: boolean
      required:
      - fields
      - terms
      title: Public Identities Text Query
      type: object
    PublicIdentitiesTextEntry:
      additionalProperties: false
      description: A COMPOSITE query entry that contains a TEXT query.
      properties:
        queryType:
          description: Entry type discriminator. Must be TEXT for text query entries.
          enum:
          - TEXT
          example: TEXT
          type: string
        textQuery:
          allOf:
          - $ref: '#/components/schemas/PublicIdentitiesTextQuery'
          description: Text query clause for this TEXT entry.
      required:
      - queryType
      - textQuery
      title: Public Identities Text Entry
      type: object
    PublicIdentitiesNestedQuerySet:
      additionalProperties: false
      description: Query set nested inside a COMPOSITE entry. TEXT entries combined
        with AND (matchAny false) or OR (matchAny true).
      properties:
        matchAny:
          description: "When true, entries are OR'd; when false, entries are AND'd."
          example: true
          type: boolean
        entries:
          description: One or more TEXT entries.
          items:
            $ref: '#/components/schemas/PublicIdentitiesTextEntry'
          minItems: 1
          type: array
      required:
      - entries
      - matchAny
      title: Public Identities Nested Query Set
      type: object
    PublicIdentitiesNestedCompositeEntry:
      additionalProperties: false
      description: A COMPOSITE query entry that nests another querySet.
      properties:
        queryType:
          description: Entry type discriminator. Must be COMPOSITE for nested query
            sets.
          enum:
          - COMPOSITE
          example: COMPOSITE
          type: string
        querySet:
          allOf:
          - $ref: '#/components/schemas/PublicIdentitiesNestedQuerySet'
          description: Nested query set for this COMPOSITE entry.
      required:
      - querySet
      - queryType
      title: Public Identities Nested Composite Entry
      type: object
    PublicIdentitiesCompositeEntry:
      description: A querySet entry that is either a TEXT clause or a nested COMPOSITE
        querySet.
      discriminator:
        mapping:
          TEXT: '#/components/schemas/PublicIdentitiesTextEntry'
          COMPOSITE: '#/components/schemas/PublicIdentitiesNestedCompositeEntry'
        propertyName: queryType
      oneOf:
      - $ref: '#/components/schemas/PublicIdentitiesTextEntry'
      - $ref: '#/components/schemas/PublicIdentitiesNestedCompositeEntry'
      title: Public Identities Composite Entry
    PublicIdentitiesQuerySet:
      additionalProperties: false
      description: A set of COMPOSITE query entries combined with AND (matchAny false)
        or OR (matchAny true).
      properties:
        matchAny:
          description: "When true, entries are OR'd; when false, entries are AND'd."
          example: false
          type: boolean
        entries:
          description: One or more TEXT or nested COMPOSITE entries.
          example:
          - queryType: TEXT
            textQuery:
              fields:
              - attributes.identityState.exact
              terms:
              - ACTIVE
              matchAny: false
              contains: false
              strict: true
          items:
            $ref: '#/components/schemas/PublicIdentitiesCompositeEntry'
          minItems: 1
          type: array
      required:
      - entries
      - matchAny
      title: Public Identities Query Set
      type: object
    PublicIdentitiesSearchRequest:
      additionalProperties: false
      description: COMPOSITE search request for public identities. Root querySet must
        use matchAny false (AND). The first entries item must be the ACTIVE identityState
        TEXT gate; identityState may not appear elsewhere in the query tree.
      example:
        indices:
        - identities
        sort:
        - name
        querySet:
          entries:
          - queryType: TEXT
            textQuery:
              fields:
              - attributes.identityState.exact
              terms:
              - ACTIVE
              matchAny: false
              contains: false
              strict: true
          matchAny: false
        queryType: COMPOSITE
        includeNested: false
      properties:
        queryType:
          description: Search query type. Must be COMPOSITE.
          enum:
          - COMPOSITE
          example: COMPOSITE
          type: string
        indices:
          description: "Search indices. Must be exactly [\"identities\"]."
          example:
          - identities
          items:
            enum:
            - identities
            type: string
          maxItems: 1
          minItems: 1
          type: array
        includeNested:
          description: Must be false for public identities search.
          example: false
          type: boolean
        sort:
          description: Optional attribute keys to sort by. Base keys must match those
            returned by GET /public-identities/v2/visible-attributes (defaultAttributes
            + configuredAttributes). Optional "attributes." prefix and/or ".exact"
            suffix.
          example:
          - name
          items:
            type: string
          minItems: 1
          type: array
        querySet:
          $ref: '#/components/schemas/PublicIdentitiesSearchRequest_querySet'
      required:
      - includeNested
      - indices
      - querySet
      - queryType
      title: Public Identities Search Request
      type: object
    PublicIdentityV2Manager:
      description: Manager reference for a public identity search result
      properties:
        id:
          description: Manager identity id
          example: 2c9180a46faadee4016fb4e018c20639
          nullable: true
          type: string
        name:
          description: Manager alias / technical name
          example: thomas.edison
          nullable: true
          type: string
        displayName:
          description: Manager display name. Null when absent from the search hit.
          example: Thomas Edison
          nullable: true
          type: string
      required:
      - displayName
      - id
      - name
      title: Public Identity V2 Manager
      type: object
    PublicIdentityV2:
      description: Projected public identity returned by POST /public-identities/v2/search.
        Root fields are always present (null when unavailable). attributes contains
        only keys from GET /public-identities/v2/visible-attributes configuredAttributes.
      example:
        manager: ""
        displayName: Alison Ferguso
        name: alison.ferguso
        cloudLifecycleState: Active
        attributes:
          country: US
        id: 2c9180857182305e0171993735622948
        identityState: ACTIVE
        email: alison.ferguso@acme-solar.com
      properties:
        id:
          description: Identity id
          example: 2c9180857182305e0171993735622948
          nullable: true
          type: string
        name:
          description: Alternate unique identifier for the identity (alias / search
            field name).
          example: alison.ferguso
          nullable: true
          type: string
        displayName:
          description: Human-readable display name of the identity.
          example: Alison Ferguso
          nullable: true
          type: string
        email:
          description: Email address of identity.
          example: alison.ferguso@acme-solar.com
          nullable: true
          type: string
        identityState:
          description: "The current state of the identity, which determines how Identity\
            \ Security Cloud interacts with the identity."
          enum:
          - ACTIVE
          - INACTIVE_SHORT_TERM
          - INACTIVE_LONG_TERM
          - null
          example: ACTIVE
          nullable: true
          type: string
        cloudLifecycleState:
          description: The lifecycle status for the identity
          example: Active
          nullable: true
          type: string
        manager:
          allOf:
          - $ref: '#/components/schemas/PublicIdentityV2Manager'
          description: "Manager of this identity, or null when none"
          nullable: true
        attributes:
          additionalProperties:
            nullable: true
            type: string
          description: Configured public identity attributes only (from visible-attributes
            configuredAttributes). Missing keys are omitted; present null values are
            returned as null.
          example:
            country: US
          type: object
      required:
      - attributes
      - cloudLifecycleState
      - displayName
      - email
      - id
      - identityState
      - manager
      - name
      title: Public Identity V2
      type: object
    getPublicIdentitiesV1_401_response:
      example:
        error: "JWT validation failed: JWT is expired"
      properties:
        error:
          description: A message describing the error
          example: "JWT validation failed: JWT is expired"
      type: object
    getPublicIdentitiesV1_429_response:
      example:
        message: ' Rate Limit Exceeded '
      properties:
        message:
          description: A message describing the error
          example: ' Rate Limit Exceeded '
      type: object
    PublicIdentity_attributes_inner:
      example:
        name: Country
        value: US
        key: country
      properties:
        key:
          description: The attribute key
          example: country
          type: string
        name:
          description: Human-readable display name of the attribute
          example: Country
          type: string
        value:
          description: The attribute value
          example: US
          nullable: true
          type: string
      type: object
    PublicIdentitiesTextQuery_terms_inner:
      oneOf:
      - minLength: 1
        type: string
      - type: boolean
    PublicIdentitiesSearchRequest_querySet:
      allOf:
      - $ref: '#/components/schemas/PublicIdentitiesQuerySet'
      - description: "Root querySet must use matchAny false (AND). The first entries\
          \ item must be exactly this TEXT gate; identityState may not appear elsewhere\
          \ in the tree: {\"queryType\":\"TEXT\",\"textQuery\":{\"fields\":[\"attributes.identityState.exact\"\
          ], \"terms\":[\"ACTIVE\"],\"matchAny\":false,\"contains\":false,\"strict\"\
          :true}}"
        type: object
      example:
        entries:
        - queryType: TEXT
          textQuery:
            fields:
            - attributes.identityState.exact
            terms:
            - ACTIVE
            matchAny: false
            contains: false
            strict: true
        matchAny: false
