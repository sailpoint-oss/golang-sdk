        - -y
        - '@modelcontextprotocol/server-github'
        identifier: '@modelcontextprotocol/server-github'
        command: npx
      properties:
        registryType:
          description: Package registry that hosts the package.
          example: npm
          nullable: true
          type: string
        identifier:
          description: Package identifier within the registry.
          example: '@modelcontextprotocol/server-github'
          nullable: true
          type: string
        command:
          description: Command used to launch the package.
          example: npx
          nullable: true
          type: string
        args:
          description: "Arguments passed to the launch command, in the order they\
            \ are applied."
          example:
          - -y
          - '@modelcontextprotocol/server-github'
          items:
            type: string
          nullable: true
          type: array
      title: MCP Package
      type: object
