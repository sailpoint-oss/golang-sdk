    MCPServerCounts:
      description: Tenant-wide MCP server totals. All values are `0` when the tenant
        has no MCP servers.
      example:
        registryEntries: 12
        connectedAgentCount: 7
        remote: 4
      properties:
        registryEntries:
          description: Total number of MCP servers in the tenant.
          example: 12
          format: int64
          type: integer
        remote:
          description: Number of MCP servers that have at least one remote endpoint.
          example: 4
          format: int64
          type: integer
        connectedAgentCount:
          description: "Number of distinct AI agents connected to at least one MCP\
            \ server. An agent connected to several MCP servers is counted once, so\
            \ this can be less than the sum of each server's `connectedAgentCount`."
          example: 7
          format: int64
          type: integer
      title: MCP Server Counts
      type: object
