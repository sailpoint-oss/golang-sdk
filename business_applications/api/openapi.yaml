openapi: 3.0.1
info:
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  description: "Use these APIs to interact with the Identity Security Cloud platform\
    \ to achieve repeatable, automated processes with greater scalability. We encourage\
    \ you to join the SailPoint Developer Community forum at https://developer.sailpoint.com/discuss\
    \ to connect with other developers using our APIs."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://developer.sailpoint.com/discuss/tos
  title: Identity Security Cloud API - Business Applications
  version: v1
servers:
- description: This is the production API server.
  url: "https://{tenant}.api.identitynow.com"
  variables:
    tenant:
      default: sailpoint
      description: "This is the name of your tenant, typically your company's name."
- description: This is the versioned API server.
  url: "https://{apiUrl}"
  variables:
    apiUrl:
      default: sailpoint.api.identitynow.com
      description: This is the api url of your tenant
security:
- userAuth:
  - sp:scopes:all
tags:
- description: "A Business Application groups machine identities (for example AI agents\
    \ or applications) under a common owner and sanctioned status. Business Applications\
    \ can be defined out-of-the-box, discovered from a source, or created by an administrator.\
    \ Signatures on a Business Application drive automatic correlation of machine\
    \ identities to it; sanctioned status is independent metadata that machine identities\
    \ inherit once linked."
  name: Business Applications
paths:
  /business-applications/v1:
    get:
      description: Returns the list of Business Applications defined for the requesting
        tenant. Requires the `idn:business-application:read` right and the Machine
        Identity Security product to be enabled for the tenant.
      operationId: listBusinessApplicationsV1
      parameters:
      - description: |-
          Filter results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)

          Filtering is supported for the following fields and operators:

          **id**: *eq*

          **name**: *eq, co*

          **vendor**: *eq, co*

          **signatures.type**: *eq, co*

          **signatures.name**: *eq, co*

          **source.name**: *eq, co*

          **sanctionedStatus**: *eq*
        example: sanctionedStatus eq "SANCTIONED"
        explode: true
        in: query
        name: filters
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Sort results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)

          Sorting is supported for the following fields: **id, name, sanctionedStatus**
        example: name
        explode: true
        in: query
        name: sorters
        required: false
        schema:
          format: comma-separated
          type: string
        style: form
      - description: |-
          If *true* it will populate the *X-Total-Count* response header with the number of results that would be returned if *limit* and *offset* were ignored.

          Since requesting a total count can have a performance impact, it is recommended not to send **count=true** if that value will not be used.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: true
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: |-
          Max number of results to return.
          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: 250
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 250
          format: int32
          maximum: 250
          minimum: 0
          type: integer
        style: form
      - description: |-
          Offset into the full result set. Usually specified with *limit* to paginate through the results.
          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BusinessApplication'
                type: array
          description: A list of Business Application objects.
          headers:
            X-Total-Count:
              description: Included when `count=true`.
              explode: false
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listBusinessApplicationsV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listBusinessApplicationsV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:business-application:read
      summary: List Business Applications
      tags:
      - Business Applications
      x-sailpoint-userLevels:
      - ORG_ADMIN
    post:
      description: "Creates a custom Business Application. Requires the `idn:business-application:create`\
        \ right, the Machine Identity Security product to be enabled, and the custom\
        \ Business Application feature to be enabled for the tenant. The `name` must\
        \ be unique within the tenant, and any provided `signatures` must not already\
        \ be assigned to another Business Application."
      operationId: createBusinessApplicationV1
      requestBody:
        content:
          application/json:
            example:
              name: Cursor
              description: AI coding assistant used by the platform engineering team.
              vendor: Cursor
              sanctionedStatus: SANCTIONED
              owner:
                type: IDENTITY
                id: 2c91808568c529c60168cca6f90c1313
                name: William Wilson
              signatures:
              - type: AI Agent
                name: cursor
            schema:
              $ref: '#/components/schemas/BusinessApplication'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessApplication'
          description: The created Business Application.
        "400":
          content:
            application/json:
              examples:
                Missing name:
                  value:
                    detailCode: 400.1.0 Required Data Missing Or Empty
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: Required field 'name' was missing or empty.
                Invalid signature type:
                  value:
                    detailCode: 400.1.0 Required Data Missing Or Empty
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: "Invalid signature type: Robot"
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Client Error - Returned if the request body is invalid, for\
            \ example a missing or blank `name`, an unrecognized signature `type`,\
            \ or a duplicate `(type, name)` signature pair within the request."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listBusinessApplicationsV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "409":
          content:
            application/json:
              examples:
                Name already in use:
                  value:
                    detailCode: 400.1.409 Reference Conflict
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: Business Application with name "Cursor" already exists.
                Signature already assigned:
                  value:
                    detailCode: 400.1.409 Reference Conflict
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: "Signature(s) is already associated with \"another Business\
                        \ Application\" \"[AI_AGENT|cursor]\"."
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Conflict - Returned if the `name` is already in use by another\
            \ Business Application in the tenant, or if a requested signature is already\
            \ assigned to another Business Application."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listBusinessApplicationsV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:business-application:create
      summary: Create Business Application
      tags:
      - Business Applications
      x-sailpoint-userLevels:
      - ORG_ADMIN
  /business-applications/v1/{id}:
    get:
      description: Returns a single Business Application by ID for the requesting
        tenant. Requires the `idn:business-application:read` right and the Machine
        Identity Security product to be enabled.
      operationId: getBusinessApplicationV1
      parameters:
      - description: Business Application ID.
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
        x-sailpoint-resource-operation-id: listBusinessApplicationsV1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessApplication'
          description: A Business Application object.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listBusinessApplicationsV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  value:
                    detailCode: 400.1.404 Referenced Object Not Found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: Referenced 'BusinessApplication' with id 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
                        not found.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - Returned if no Business Application exists for
            the given ID.
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listBusinessApplicationsV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:business-application:read
      summary: Get Business Application
      tags:
      - Business Applications
      x-sailpoint-userLevels:
      - ORG_ADMIN
    patch:
      description: "Updates a Business Application using the [JSON Patch](https://tools.ietf.org/html/rfc6902)\
        \ standard. Requires the `idn:business-application:update` right and the Machine\
        \ Identity Security product to be enabled. Patchable fields: `name`, `description`,\
        \ `owner`, `additionalOwners`, `sanctionedStatus`, and `signatures`. Modifying\
        \ `signatures` additionally requires the custom Business Application feature\
        \ to be enabled."
      operationId: updateBusinessApplicationV1
      parameters:
      - description: Business Application ID.
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
        x-sailpoint-resource-operation-id: listBusinessApplicationsV1
      requestBody:
        content:
          application/json-patch+json:
            examples:
              Replace sanctioned status:
                value:
                - op: replace
                  path: /sanctionedStatus
                  value: SANCTIONED
              Replace description:
                value:
                - op: replace
                  path: /description
                  value: Updated description.
              Replace owner:
                value:
                - op: replace
                  path: /owner
                  value:
                    type: IDENTITY
                    id: 2c91808568c529c60168cca6f90c1313
                    name: William Wilson
              Replace signatures:
                value:
                - op: replace
                  path: /signatures
                  value:
                  - type: AI Agent
                    name: cursor
            schema:
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
              type: array
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
              type: array
        description: A JSON array of patch operations per RFC 6902.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessApplication'
          description: The updated Business Application.
        "400":
          content:
            application/json:
              examples:
                Blank name:
                  value:
                    detailCode: 400.1.0 Required Data Missing Or Empty
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: Required field 'name' was missing or empty.
                Non-patchable field:
                  value:
                    detailCode: 400.1 Bad Request Content
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: Field 'origin' is not patchable.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Client Error - Returned if the patch is malformed, targets\
            \ a non-patchable field, clears the required `name`, or specifies an invalid\
            \ signature."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listBusinessApplicationsV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  value:
                    detailCode: 400.1.404 Referenced Object Not Found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: Referenced 'BusinessApplication' with id 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
                        not found.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - Returned if no Business Application exists for
            the given ID.
        "409":
          content:
            application/json:
              examples:
                Name already in use:
                  value:
                    detailCode: 400.1.409 Reference Conflict
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: Business Application with name "Cursor" already exists.
                Signature already assigned:
                  value:
                    detailCode: 400.1.409 Reference Conflict
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: "Signature(s) is already associated with \"another Business\
                        \ Application\" \"[AI_AGENT|cursor]\"."
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Conflict - Returned if the new `name` is already in use by\
            \ another Business Application in the tenant, or if a requested signature\
            \ is already assigned to another Business Application."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listBusinessApplicationsV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:business-application:update
      summary: Update Business Application
      tags:
      - Business Applications
      x-sailpoint-userLevels:
      - ORG_ADMIN
components:
  parameters:
    count:
      description: |-
        If *true* it will populate the *X-Total-Count* response header with the number of results that would be returned if *limit* and *offset* were ignored.

        Since requesting a total count can have a performance impact, it is recommended not to send **count=true** if that value will not be used.

        See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
      example: true
      explode: true
      in: query
      name: count
      required: false
      schema:
        default: false
        type: boolean
      style: form
    limit:
      description: |-
        Max number of results to return.
        See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
      example: 250
      explode: true
      in: query
      name: limit
      required: false
      schema:
        default: 250
        format: int32
        maximum: 250
        minimum: 0
        type: integer
      style: form
    offset:
      description: |-
        Offset into the full result set. Usually specified with *limit* to paginate through the results.
        See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
      example: 0
      explode: true
      in: query
      name: offset
      required: false
      schema:
        default: 0
        format: int32
        minimum: 0
        type: integer
      style: form
  responses:
    "400":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
      description: Client Error - Returned if the request body is invalid.
    "401":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/listBusinessApplicationsV1_401_response'
      description: "Unauthorized - Returned if there is no authorization header, or\
        \ if the JWT token is expired."
    "403":
      content:
        application/json:
          examples:
            "403":
              summary: An example of a 403 response object
              value:
                detailCode: 403 Forbidden
                trackingId: b21b1f7ce4da4d639f2c62a57171b427
                messages:
                - locale: en-US
                  localeOrigin: DEFAULT
                  text: The server understood the request but refuses to authorize
                    it.
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
      description: "Forbidden - Returned if the user you are running as, doesn't have\
        \ access to this end-point."
    "429":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/listBusinessApplicationsV1_429_response'
      description: Too Many Requests - Returned in response to too many requests in
        a given period of time - rate limited. The Retry-After header in the response
        includes how long to wait before trying again.
    "500":
      content:
        application/json:
          examples:
            "500":
              summary: An example of a 500 response object
              value:
                detailCode: 500.0 Internal Fault
                trackingId: b21b1f7ce4da4d639f2c62a57171b427
                messages:
                - locale: en-US
                  localeOrigin: DEFAULT
                  text: An internal fault occurred.
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
      description: Internal Server Error - Returned if there is an unexpected error.
  schemas:
    BusinessApplicationSignature:
      description: "A `(type, name)` rule used to automatically correlate machine\
        \ identities to this Business Application. A signature matches a machine identity\
        \ when the identity's `subtype` equals `type` and its `connector_attributes.spBusinessApplication`\
        \ equals `name`. Each `(type, name)` pair is unique across all Business Applications\
        \ in the tenant; assigning a signature already owned by another Business Application\
        \ returns a 409 conflict. Modifying signatures requires the custom Business\
        \ Application feature to be enabled."
      example:
        name: cursor
        type: AI Agent
      properties:
        type:
          description: "Signature type, matched against the machine identity's subtype.\
            \ Kept consistent with the machine identity subtype values."
          enum:
          - AI Agent
          - Application
          example: AI Agent
          type: string
        name:
          description: Connector signature value to match against the machine identity's
            `spBusinessApplication` connector attribute.
          example: cursor
          type: string
      required:
      - name
      - type
      title: Business Application Signature
      type: object
    DtoType:
      description: An enumeration of the types of DTOs supported within the IdentityNow
        infrastructure.
      enum:
      - ACCOUNT_CORRELATION_CONFIG
      - ACCESS_PROFILE
      - ACCESS_REQUEST_APPROVAL
      - ACCOUNT
      - APPLICATION
      - CAMPAIGN
      - CAMPAIGN_FILTER
      - CERTIFICATION
      - CLUSTER
      - CONNECTOR_SCHEMA
      - ENTITLEMENT
      - GOVERNANCE_GROUP
      - IDENTITY
      - IDENTITY_PROFILE
      - IDENTITY_REQUEST
      - MACHINE_IDENTITY
      - LIFECYCLE_STATE
      - PASSWORD_POLICY
      - ROLE
      - RULE
      - SOD_POLICY
      - SOURCE
      - TAG
      - TAG_CATEGORY
      - TASK_RESULT
      - REPORT_RESULT
      - SOD_VIOLATION
      - ACCOUNT_ACTIVITY
      - WORKGROUP
      example: IDENTITY
      type: string
    BaseReferenceDto:
      properties:
        type:
          $ref: '#/components/schemas/DtoType'
        id:
          description: ID of the object to which this reference applies
          example: 2c91808568c529c60168cca6f90c1313
          type: string
        name:
          description: Human-readable display name of the object to which this reference
            applies
          example: William Wilson
          type: string
      title: Base Reference Dto
      type: object
    SanctionedStatus:
      description: Indicates whether a Business Application is sanctioned for use
        within the organization. Machine identities linked to a Business Application
        inherit this value. Defaults to `UNKNOWN` when not explicitly set.
      enum:
      - SANCTIONED
      - UNSANCTIONED
      - UNKNOWN
      example: SANCTIONED
      title: Sanctioned Status
      type: string
    BusinessApplicationOrigin:
      description: How the Business Application entered the tenant catalog. Read-only;
        assigned by the service on creation and immutable thereafter.
      enum:
      - OOTB
      - CUSTOM
      example: CUSTOM
      title: Business Application Origin
      type: string
    BusinessApplication:
      description: "A Business Application groups machine identities (for example\
        \ AI agents or applications) under a common owner and sanctioned status, either\
        \ discovered from a source or defined by an administrator."
      example:
        owner:
          name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
        vendor: Cursor
        created: 2026-01-15T13:45:12.312Z
        origin: ""
        name: Cursor
        description: AI coding assistant used by the platform engineering team.
        modified: 2026-02-20T09:31:47.882Z
        id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        source:
          name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
        signatures:
        - name: cursor
          type: AI Agent
        - name: cursor
          type: AI Agent
        additionalOwners:
        - name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
        - name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
        sanctionedStatus: ""
      properties:
        id:
          description: Business Application ID. Assigned by the service on create.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          readOnly: true
          type: string
        name:
          description: Human-readable display name. Must be unique within the tenant.
          example: Cursor
          type: string
        description:
          description: Free-text description of the Business Application.
          example: AI coding assistant used by the platform engineering team.
          nullable: true
          type: string
        vendor:
          description: Vendor or publisher of the Business Application.
          example: Cursor
          nullable: true
          type: string
        signatures:
          description: Signatures used to automatically correlate machine identities
            to this Business Application. Modifying this field requires the custom
            Business Application feature to be enabled.
          items:
            $ref: '#/components/schemas/BusinessApplicationSignature'
          type: array
        owner:
          $ref: '#/components/schemas/BusinessApplication_owner'
        additionalOwners:
          description: Additional (secondary) owners of the Business Application.
          items:
            $ref: '#/components/schemas/BusinessApplication_additionalOwners_inner'
          nullable: true
          type: array
        sanctionedStatus:
          allOf:
          - $ref: '#/components/schemas/SanctionedStatus'
          description: Sanctioned status of the Business Application. Defaults to
            `UNKNOWN`.
        origin:
          allOf:
          - $ref: '#/components/schemas/BusinessApplicationOrigin'
          readOnly: true
        source:
          $ref: '#/components/schemas/BusinessApplication_source'
        created:
          description: Time the Business Application was created.
          example: 2026-01-15T13:45:12.312Z
          format: date-time
          readOnly: true
          type: string
        modified:
          description: Time the Business Application was last modified.
          example: 2026-02-20T09:31:47.882Z
          format: date-time
          readOnly: true
          type: string
      required:
      - name
      title: Business Application
      type: object
    LocaleOrigin:
      description: "An indicator of how the locale was selected. *DEFAULT* means the\
        \ locale is the system default. *REQUEST* means the locale was selected from\
        \ the request context (i.e., best match based on the *Accept-Language* header).\
        \ Additional values may be added in the future without notice."
      enum:
      - DEFAULT
      - REQUEST
      - null
      example: DEFAULT
      nullable: true
      type: string
    ErrorMessageDto:
      example:
        localeOrigin: DEFAULT
        text: The request was syntactically correct but its content is semantically
          invalid.
        locale: en-US
      properties:
        locale:
          description: "The locale for the message text, a BCP 47 language tag."
          example: en-US
          nullable: true
          type: string
        localeOrigin:
          $ref: '#/components/schemas/LocaleOrigin'
        text:
          description: Actual text of the error message in the indicated locale.
          example: The request was syntactically correct but its content is semantically
            invalid.
          type: string
      title: Error Message Dto
      type: object
    ErrorResponseDto:
      example:
        causes:
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        messages:
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        detailCode: 400.1 Bad Request Content
        trackingId: e7eab60924f64aa284175b9fa3309599
      properties:
        detailCode:
          description: Fine-grained error code providing more detail of the error.
          example: 400.1 Bad Request Content
          type: string
        trackingId:
          description: Unique tracking id for the error.
          example: e7eab60924f64aa284175b9fa3309599
          type: string
        messages:
          description: Generic localized reason for error
          items:
            $ref: '#/components/schemas/ErrorMessageDto'
          type: array
        causes:
          description: Plain-text descriptive reasons to provide additional detail
            to the text provided in the messages field
          items:
            $ref: '#/components/schemas/ErrorMessageDto'
          type: array
      title: Error Response Dto
      type: object
    JsonPatchOperation:
      description: "A JSONPatch Operation as defined by [RFC 6902 - JSON Patch](https://tools.ietf.org/html/rfc6902)"
      example:
        op: replace
        path: /description
        value: New description
      properties:
        op:
          description: The operation to be performed
          enum:
          - add
          - remove
          - replace
          - move
          - copy
          - test
          example: replace
          type: string
        path:
          description: A string JSON Pointer representing the target path to an element
            to be affected by the operation
          example: /description
          type: string
        value:
          $ref: '#/components/schemas/JsonPatchOperation_value'
      required:
      - op
      - path
      title: Json Patch Operation
      type: object
    listBusinessApplicationsV1_401_response:
