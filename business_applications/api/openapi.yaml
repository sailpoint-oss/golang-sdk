                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: Field 'origin' is not patchable.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Client Error - Returned if the patch is malformed, targets\
            \ a non-patchable field, clears the required `name`, or specifies an invalid\
            \ signature."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listBusinessApplicationsV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
