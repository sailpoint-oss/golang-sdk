    patch:
      description: "Updates a Business Application using the [JSON Patch](https://tools.ietf.org/html/rfc6902)\
        \ standard. Requires the `idn:business-application:update` right and the Machine\
        \ Identity Security product to be enabled. Patchable fields: `name`, `description`,\
        \ `owner`, `additionalOwners`, `sanctionedStatus`, and `signatures`. Modifying\
        \ `signatures` additionally requires the custom Business Application feature\
        \ to be enabled."
      operationId: updateBusinessApplicationV1
      parameters:
      - description: Business Application ID.
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
