            default: false
            description: Indicates whether the AI agent has been manually edited.
            example: false
            type: boolean
          manuallyCreated:
            default: false
            description: Indicates whether the AI agent was manually created.
            example: false
            type: boolean
          existsOnSource:
            description: Whether the AI agent still exists on its source.
            enum:
