  schemas:
    BusinessApplicationSignature:
      description: "A `(type, name)` rule used to automatically correlate machine\
        \ identities to this Business Application. A signature matches a machine identity\
        \ when the identity's `subtype` equals `type` and its `connector_attributes.spBusinessApplication`\
        \ equals `name`. Each `(type, name)` pair is unique across all Business Applications\
        \ in the tenant; assigning a signature already owned by another Business Application\
        \ returns a 409 conflict. Modifying signatures requires the custom Business\
        \ Application feature to be enabled."
      example:
        name: cursor
        type: AI Agent
      properties:
        type:
          description: "Signature type, matched against the machine identity's subtype.\
            \ Kept consistent with the machine identity subtype values."
          enum:
          - AI Agent
          - Application
          example: AI Agent
          type: string
        name:
          description: Connector signature value to match against the machine identity's
            `spBusinessApplication` connector attribute.
          example: cursor
          type: string
      required:
      - name
      - type
      title: Business Application Signature
      type: object
    DtoType:
      description: An enumeration of the types of DTOs supported within the IdentityNow
        infrastructure.
      enum:
      - ACCOUNT_CORRELATION_CONFIG
      - ACCESS_PROFILE
      - ACCESS_REQUEST_APPROVAL
      - ACCOUNT
      - APPLICATION
      - CAMPAIGN
      - CAMPAIGN_FILTER
      - CERTIFICATION
      - CLUSTER
      - CONNECTOR_SCHEMA
      - ENTITLEMENT
      - GOVERNANCE_GROUP
      - IDENTITY
      - IDENTITY_PROFILE
      - IDENTITY_REQUEST
      - MACHINE_IDENTITY
      - LIFECYCLE_STATE
      - PASSWORD_POLICY
      - ROLE
      - RULE
      - SOD_POLICY
      - SOURCE
      - TAG
      - TAG_CATEGORY
      - TASK_RESULT
      - REPORT_RESULT
      - SOD_VIOLATION
      - ACCOUNT_ACTIVITY
      - WORKGROUP
      example: IDENTITY
      type: string
    BaseReferenceDto:
      example:
        name: William Wilson
        id: 2c91808568c529c60168cca6f90c1313
        type: IDENTITY
      properties:
        type:
          $ref: '#/components/schemas/DtoType'
        id:
          description: ID of the object to which this reference applies
          example: 2c91808568c529c60168cca6f90c1313
          type: string
        name:
          description: Human-readable display name of the object to which this reference
            applies
          example: William Wilson
          type: string
      title: Base Reference Dto
      type: object
    SanctionedStatus:
      description: Indicates whether a Business Application is sanctioned for use
        within the organization. Machine identities linked to a Business Application
        inherit this value. Defaults to `UNKNOWN` when not explicitly set.
      enum:
      - SANCTIONED
      - UNSANCTIONED
      - UNKNOWN
      example: SANCTIONED
      title: Sanctioned Status
      type: string
    BusinessApplicationOrigin:
      description: How the Business Application entered the tenant catalog. Read-only;
        assigned by the service on creation and immutable thereafter.
      enum:
      - OOTB
      - CUSTOM
      example: CUSTOM
      title: Business Application Origin
      type: string
    BusinessApplication:
      description: "A Business Application groups machine identities (for example\
        \ AI agents or applications) under a common owner and sanctioned status, either\
        \ discovered from a source or defined by an administrator."
      example:
        owner:
          name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
        vendor: Cursor
        created: 2026-01-15T13:45:12.312Z
        origin: ""
        name: Cursor
        description: AI coding assistant used by the platform engineering team.
        modified: 2026-02-20T09:31:47.882Z
        id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        source:
          name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
        signatures:
        - name: cursor
          type: AI Agent
        - name: cursor
          type: AI Agent
        additionalOwners:
        - name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
        - name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
        sanctionedStatus: ""
      properties:
        id:
          description: Business Application ID. Assigned by the service on create.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          readOnly: true
          type: string
        name:
          description: Human-readable display name. Must be unique within the tenant.
          example: Cursor
          type: string
        description:
          description: Free-text description of the Business Application.
          example: AI coding assistant used by the platform engineering team.
          nullable: true
          type: string
        vendor:
          description: Vendor or publisher of the Business Application.
          example: Cursor
          nullable: true
          type: string
        signatures:
          description: Signatures used to automatically correlate machine identities
            to this Business Application. Modifying this field requires the custom
            Business Application feature to be enabled.
          items:
            $ref: '#/components/schemas/BusinessApplicationSignature'
          type: array
        owner:
          $ref: '#/components/schemas/BusinessApplication_owner'
        additionalOwners:
          description: Additional (secondary) owners of the Business Application.
          items:
            $ref: '#/components/schemas/BusinessApplication_additionalOwners_inner'
          nullable: true
          type: array
        sanctionedStatus:
          allOf:
          - $ref: '#/components/schemas/SanctionedStatus'
          description: Sanctioned status of the Business Application. Defaults to
            `UNKNOWN`.
        origin:
          allOf:
          - $ref: '#/components/schemas/BusinessApplicationOrigin'
          readOnly: true
        source:
          $ref: '#/components/schemas/BusinessApplication_source'
        created:
          description: Time the Business Application was created.
          example: 2026-01-15T13:45:12.312Z
          format: date-time
          readOnly: true
          type: string
        modified:
          description: Time the Business Application was last modified.
          example: 2026-02-20T09:31:47.882Z
          format: date-time
          readOnly: true
          type: string
      required:
      - name
      title: Business Application
      type: object
    LocaleOrigin:
      description: "An indicator of how the locale was selected. *DEFAULT* means the\
        \ locale is the system default. *REQUEST* means the locale was selected from\
        \ the request context (i.e., best match based on the *Accept-Language* header).\
        \ Additional values may be added in the future without notice."
      enum:
      - DEFAULT
      - REQUEST
      - null
      example: DEFAULT
      nullable: true
      type: string
    ErrorMessageDto:
      example:
        localeOrigin: DEFAULT
        text: The request was syntactically correct but its content is semantically
          invalid.
        locale: en-US
      properties:
        locale:
          description: "The locale for the message text, a BCP 47 language tag."
          example: en-US
          nullable: true
          type: string
        localeOrigin:
          $ref: '#/components/schemas/LocaleOrigin'
        text:
          description: Actual text of the error message in the indicated locale.
          example: The request was syntactically correct but its content is semantically
            invalid.
          type: string
      title: Error Message Dto
      type: object
    ErrorResponseDto:
      example:
        causes:
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        messages:
        - localeOrigin: DEFAULT
