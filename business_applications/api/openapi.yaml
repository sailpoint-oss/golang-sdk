      - description: Use this header to enable this experimental API.
        example: true
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json-patch+json:
            examples:
              Replace sanctioned status:
                value:
                - op: replace
                  path: /sanctionedStatus
                  value: SANCTIONED
              Replace description:
                value:
                - op: replace
                  path: /description
                  value: Updated description.
              Replace owner:
                value:
                - op: replace
                  path: /owner
                  value:
                    type: IDENTITY
                    id: 2c91808568c529c60168cca6f90c1313
                    name: William Wilson
              Replace signatures:
                value:
                - op: replace
                  path: /signatures
                  value:
                  - type: AI Agent
                    name: cursor
            schema:
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
              type: array
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
              type: array
        description: A JSON array of patch operations per RFC 6902.
        required: true
