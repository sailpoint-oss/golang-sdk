    MachineAccountSubtypeConfigDto_machineAccountCreate:
      description: "Configuration options for machine account creation, including\
        \ whether creation is enabled, if approval is required, associated form and\
        \ entitlement IDs, and detailed approval settings such as approvers and allowed\
        \ comment types."
      example:
        formId: 4f1bb61b-a0ab-4c0a-b9fb-20f44407b75a
        approvalConfig:
          comments: ALL
          approvers: "manager, workgroup:1419fc28-a8ed-4a07-9f5c-0cb5dfad6311"
        approvalRequired: true
        accountCreateEnabled: true
        entitlementId: 858d2151-ff19-464b-ae0d-6938b3af2baf
        passwordAttribute: accountName
        passwordSetting: SET_TO_EXISTING_ATTRIBUTE
      properties:
        accountCreateEnabled:
          default: false
          description: Specifies if the creation of machine accounts is allowed for
            this subtype.
          example: true
          type: boolean
        approvalRequired:
          default: false
          description: Specifies if approval is required for machine account creation
            requests for this subtype.
          example: true
          type: boolean
        formId:
          description: Id of the form linked to subtype.
          example: 4f1bb61b-a0ab-4c0a-b9fb-20f44407b75a
          type: string
        entitlementId:
          description: Id of the system created entitlement entitlement upon enabling
            account creation for this subtype.
          example: 858d2151-ff19-464b-ae0d-6938b3af2baf
          type: string
        passwordSetting:
          description: This is required before enabling the account creation to true.
            Default value will be null.
          enum:
          - DO_NOT_SET_PASSWORD
          - SET_TO_EXISTING_ATTRIBUTE
          - SET_TO_NEW_ATTRIBUTE
          example: SET_TO_EXISTING_ATTRIBUTE
          type: string
        passwordAttribute:
          description: Name of the account attribute from the source's schema or new
            custom attribute to use when password settings is enabled.
          example: accountName
          type: string
        approvalConfig:
          $ref: '#/components/schemas/MachineSubtypeApprovalConfig'
      type: object
    MachineAccountSubtypeConfigDto_machineAccountDelete:
      description: "Configuration options for machine account deletion, including\
        \ whether approval is required, the list of authorized approvers, and the\
        \ types of comments permitted during the approval workflow."
      example:
        approvalConfig:
          comments: ALL
          approvers: "manager, workgroup:1419fc28-a8ed-4a07-9f5c-0cb5dfad6311"
        approvalRequired: true
      properties:
        approvalRequired:
          default: false
          description: Indicates whether approval is required for an account deletion
            request.
          example: true
          type: boolean
        approvalConfig:
          $ref: '#/components/schemas/MachineSubtypeApprovalConfig'
      type: object
