            type. `CONNECTOR_VARIANT` is reserved for future use.
          enum:
          - SOURCE
          - CONNECTOR
          - CONNECTOR_VARIANT
          example: CONNECTOR
          type: string
        targetId:
          description: "Scope key of the subtype. The source ID for `SOURCE` subtypes,\
            \ or the connector type for `CONNECTOR` subtypes."
          example: active-directory
          type: string
        targetName:
          description: Display name of the target source or connector.
          example: Active Directory
          nullable: true
          type: string
        classification:
          description: Classification of the subtype.
          enum:
          - MACHINE
          example: MACHINE
          type: string
        origin:
          description: Tier of the parent subtype this subtype overrides. Set to `CONNECTOR`
            when a source subtype replaces a connector subtype with the same technical
            name in a source's effective subtype list. Otherwise `null`.
          enum:
          - SOURCE
          - CONNECTOR
          - CONNECTOR_VARIANT
          nullable: true
          type: string
          example: null
        profile:
          $ref: '#/components/schemas/SourceSubtypeV2_profile'
        systemManaged:
          default: false
          description: Indicates whether the subtype is managed by the system.
          example: false
          readOnly: true
          type: boolean
        created:
          description: Creation timestamp.
          example: 2026-07-28T16:13:42.801Z
          format: date-time
          type: string
        modified:
          description: Last modified timestamp.
          example: 2026-07-28T16:13:42.75Z
          format: date-time
          type: string
        target:
          $ref: '#/components/schemas/SubtypeTarget'
      title: Source Subtype V2
      type: object
    SourceSubtypeV2WithConfig:
      allOf:
      - $ref: '#/components/schemas/SourceSubtypeV2'
      - properties:
          config:
            $ref: '#/components/schemas/SourceSubtypeV2WithConfig_allOf_config'
        type: object
      description: "A machine account subtype list item, returned when `includeConfigs=true`."
      example:
        targetName: Active Directory
        targetId: active-directory
        displayName: Service Account
        created: 2026-07-28T16:13:42.801Z
        origin: SOURCE
        profile:
          connectorType: JDBC
          variant: MySql
          id: 9a4b7d2e-1c3f-4e5a-8b6c-7d8e9f0a1b2c
        systemManaged: false
        description: Accounts used by automated services.
        targetType: CONNECTOR
        type: MACHINE
        classification: MACHINE
        technicalName: service-account
        target:
          name: Active Directory
          supportsProvisioning: true
          id: active-directory
          type: CONNECTOR
        modified: 2026-07-28T16:13:42.75Z
        id: 43bdd144-4b17-4fce-a744-17c7fd3e717b
        config:
          machineAccountCreate:
            accountCreateEnabled: true
      title: Source Subtype V2 With Config
    CreateSourceSubtypeV2Request:
      description: Request body for creating a machine account subtype at the source
        tier or the connector tier.
      example:
        targetName: Active Directory
        targetId: active-directory
        displayName: Service Account
        description: Accounts used by automated services.
        targetType: CONNECTOR
        type: MACHINE
        classification: MACHINE
        technicalName: service-account
      properties:
        targetType:
          default: SOURCE
          description: Tier to create the subtype at. Defaults to `SOURCE`.
          enum:
          - SOURCE
          - CONNECTOR
          example: CONNECTOR
          type: string
        targetId:
          description: "Scope key of the subtype. The source ID for a `SOURCE` subtype,\
            \ or a registered connector type for a `CONNECTOR` subtype."
          example: active-directory
          type: string
        targetName:
          description: "Display name of the target. For a `CONNECTOR` subtype, a supplied\
            \ value must match the connector's registered name and is replaced by\
            \ the registered spelling. When omitted, the registered name is used."
          example: Active Directory
          type: string
        technicalName:
          description: Technical name of the subtype.
          example: service-account
          type: string
        displayName:
          description: Display name of the subtype.
          example: Service Account
          type: string
        description:
          description: Description of the subtype.
          example: Accounts used by automated services.
          type: string
        type:
          default: MACHINE
          description: Entity type of the subtype. Defaults to `MACHINE`.
          example: MACHINE
          type: string
        classification:
          default: MACHINE
          description: Classification of the subtype. Defaults to `MACHINE`.
          enum:
          - MACHINE
          example: MACHINE
          type: string
      required:
      - description
      - displayName
      - targetId
      - technicalName
      title: Create Source Subtype V2 Request
      type: object
    SubtypeTargetSummary:
      description: "Summary of the subtypes defined for one target. There is one item\
        \ per connector type for `CONNECTOR` targets, and one item per source subtype\
        \ for `SOURCE` targets."
      example:
        targetName: Active Directory
        sourceCount: 12
        targetId: active-directory
        targetType: CONNECTOR
        lastModified: 2026-07-28T16:13:42.75Z
        subtypeCount: 3
      properties:
        targetType:
          description: Tier of the target.
          enum:
          - SOURCE
          - CONNECTOR
          example: CONNECTOR
          type: string
        targetId:
          description: "Connector type for a `CONNECTOR` target, or source ID for\
            \ a `SOURCE` target."
          example: active-directory
          type: string
        targetName:
          description: Display name of the target. Falls back to `targetId` when no
            name is stored.
          example: Active Directory
          type: string
        subtypeCount:
          description: Number of subtypes defined for the target.
          example: 3
          format: int32
          type: integer
        sourceCount:
          description: Number of sources the target's subtypes apply to.
          example: 12
          format: int32
          type: integer
        lastModified:
          description: Most recent modification time across the target's subtypes.
          example: 2026-07-28T16:13:42.75Z
          format: date-time
          nullable: true
          type: string
      title: Subtype Target Summary
      type: object
    SourceSubtypeOverrideRequest:
      description: Request body for overriding a connector subtype on one source.
      example:
        sourceId: 6d0458373bec4b4b80460992b76016da
      properties:
        sourceId:
          description: ID of the source to create the overriding source subtype on.
          example: 6d0458373bec4b4b80460992b76016da
          type: string
      required:
      - sourceId
      title: Source Subtype Override Request
      type: object
    SubtypeProvisioningPolicyField:
      description: One field of a subtype provisioning policy.
      example:
        isRequired: false
        transform:
          type: rule
          attributes:
            name: Create Unique LDAP Attribute
        isMultiValued: false
        name: userName
        attributes:
          template: "{firstname}.{lastname}{uniqueCounter}"
          cloudMaxUniqueChecks: "50"
          cloudMaxSize: "20"
          cloudRequired: "true"
        type: string
      properties:
        name:
          description: Name of the attribute.
          example: userName
          type: string
        transform:
          additionalProperties: true
          description: Transform to apply to the field.
          example:
            type: rule
            attributes:
              name: Create Unique LDAP Attribute
          nullable: true
          type: object
        attributes:
          additionalProperties: true
          description: Attributes required for the transform.
          example:
            template: "{firstname}.{lastname}{uniqueCounter}"
            cloudMaxUniqueChecks: "50"
            cloudMaxSize: "20"
            cloudRequired: "true"
          nullable: true
          type: object
        isRequired:
          default: false
          description: Indicates whether the attribute is required.
          example: false
          type: boolean
        type:
          description: Type of the attribute.
          example: string
          nullable: true
          type: string
        isMultiValued:
          default: false
          description: Indicates whether the attribute is multi-valued.
          example: false
          type: boolean
      required:
      - name
      title: Subtype Provisioning Policy Field
      type: object
    SubtypeProvisioningPolicy:
      description: The machine account creation provisioning policy of a subtype.
      example:
        name: Service Account
        description: Fields collected when creating a service account.
        id: d7ae9ea3-507f-4d00-9d4f-b4464b344b88
        subtypeId: 43bdd144-4b17-4fce-a744-17c7fd3e717b
        fields:
        - isRequired: false
          transform:
            type: rule
            attributes:
              name: Create Unique LDAP Attribute
          isMultiValued: false
          name: userName
          attributes:
            template: "{firstname}.{lastname}{uniqueCounter}"
            cloudMaxUniqueChecks: "50"
            cloudMaxSize: "20"
            cloudRequired: "true"
          type: string
        - isRequired: false
          transform:
            type: rule
            attributes:
              name: Create Unique LDAP Attribute
          isMultiValued: false
          name: userName
          attributes:
            template: "{firstname}.{lastname}{uniqueCounter}"
            cloudMaxUniqueChecks: "50"
            cloudMaxSize: "20"
            cloudRequired: "true"
          type: string
        usageType: CREATE_MACHINE_ACCOUNT
      properties:
        id:
          description: System-generated unique ID of the provisioning policy. Must
            not be supplied on create.
          example: d7ae9ea3-507f-4d00-9d4f-b4464b344b88
          readOnly: true
          type: string
        subtypeId:
          description: ID of the subtype the policy belongs to. Must not be supplied
            on create.
          example: 43bdd144-4b17-4fce-a744-17c7fd3e717b
          readOnly: true
          type: string
        name:
          description: Name of the provisioning policy. Defaults to the subtype's
            display name when omitted or blank.
          example: Service Account
          nullable: true
          type: string
        description:
          description: Description of the provisioning policy.
          example: Fields collected when creating a service account.
          nullable: true
          type: string
        usageType:
          default: CREATE_MACHINE_ACCOUNT
          description: Usage type of the provisioning policy. Only `CREATE_MACHINE_ACCOUNT`
            is supported.
          enum:
          - CREATE_MACHINE_ACCOUNT
          example: CREATE_MACHINE_ACCOUNT
          type: string
        fields:
          description: "Fields of the provisioning policy. Every field must have a\
            \ non-blank `name`. When two fields share a name, only the first is kept."
          items:
            $ref: '#/components/schemas/SubtypeProvisioningPolicyField'
          type: array
      title: Subtype Provisioning Policy
      type: object
