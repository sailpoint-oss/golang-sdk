      parameters:
      - description: |-
          Filter results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)

          Filtering is supported for the following fields and operators:

          **id**: *eq, in, sw*

          **displayName**: *eq, sw*

          **technicalName**: *eq, sw*

          **source.id**: *eq, in*

          **targetType**: *eq, in*

          **targetId**: *eq, in*

          **targetName**: *eq, sw*

          **classification**: *eq, in*

          **type**: *eq, in*

          **created**: *gt, ge, lt, le*

          **modified**: *gt, ge, lt, le*

          Filters cannot be combined with the effective set. That combination returns 400.
        example: targetType eq "CONNECTOR"
        explode: true
        in: query
        name: filters
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Sort results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)

          Sorting is supported for the following fields: **id, displayName, technicalName, source.id, targetType, targetId, targetName, classification, type, created, modified**

          When omitted, order is unspecified.
        example: displayName
        explode: true
        in: query
        name: sorters
        required: false
        schema:
          default: ""
          format: comma-separated
          type: string
        style: form
      - description: "Source scope. When supplied, omitted `effectiveSet` defaults\
          \ to `true`. Unknown source returns **404**. Empty means the parameter was\
          \ omitted."
        example: 6d0458373bec4b4b80460992b76016da
        explode: true
        in: query
        name: sourceId
        required: false
        schema:
          default: ""
          type: string
        style: form
      - description: "When `true` with `sourceId`, return the effective subtype set\
          \ for that source. When `false` with `sourceId`, return only that source's\
          \ raw SOURCE-tier rows. `true` without `sourceId` returns **400**. Combining\
          \ with `filters` returns **400**."
        example: true
        explode: true
        in: query
        name: effectiveSet
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - description: Winner-tier cut on the effective set only. `CONNECTOR` returns
          inherited connector winners. `SOURCE` returns source-only winners and SOURCE
          overrides. Omit it to keep the full winner set. Invalid when `effectiveSet`
          is `false` or `sourceId` is omitted.
        example: SOURCE
        explode: true
        in: query
        name: targetType
        required: false
        schema:
          enum:
          - SOURCE
          - CONNECTOR
          type: string
        style: form
        x-sailpoint-lint-ignore:
          schema-optional-properties-must-have-default: Omitted means the full effective
            set. A default would select one tier.
      - description: "When `true`, each `MACHINE` subtype with a stored machine-account-create\
          \ config includes slim `config.machineAccountCreate.accountCreateEnabled`.\
          \ Default `false` omits `config`."
        example: false
        explode: true
        in: query
        name: includeConfigs
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: |-
