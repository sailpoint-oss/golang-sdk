          content:
            application/json:
              examples:
                SourceSubtype:
                  value:
                  - id: 43bdd144-4b17-4fce-a744-17c7fd3e717b
                    sourceId: 6d0458373bec4b4b80460992b76016da
                    technicalName: foo
                    displayName: Mr Foo
                    description: fighters
                    created: 2025-07-28T16:13:42.801Z
                    modified: 2025-07-28T16:13:42.750Z
                    type: MACHINE
                    source:
                      type: SOURCE
                      id: 6d0458373bec4b4b80460992b76016da
                      name: Test Source
                    systemManaged: false
              schema:
                items:
                  $ref: '#/components/schemas/SourceSubtypeWithSource'
