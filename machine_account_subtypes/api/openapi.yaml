                    sourceId: 6d0458373bec4b4b80460992b76016da
                    technicalName: foo
                    displayName: Mr Foo
                    description: fighters
                    created: 2025-07-28T16:13:42.801Z
                    modified: 2025-07-28T16:13:42.750Z
                    type: MACHINE
                    source:
                      type: SOURCE
                      id: 6d0458373bec4b4b80460992b76016da
                      name: Test Source
                    systemManaged: false
              schema:
                items:
