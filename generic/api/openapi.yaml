openapi: 3.0.1
info:
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  description: "Generic client for the SailPoint Identity Security versioned APIs.\
    \ Use it to call any endpoint, in any version, by its path, for example `sources/v1`\
    \ or `sources/v2/{sourceId}/provisioning-policies`, including endpoints that do\
    \ not have a resource-specific client or documentation yet. The version is part\
    \ of the path, so this client is not tied to one API version and the base URL\
    \ has no version segment."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://developer.sailpoint.com/discuss/tos
  title: SailPoint Identity Security API - Generic
  version: any (set in the path)
servers:
- description: This is the production API server.
  url: "https://{tenant}.api.identitynow.com"
  variables:
    tenant:
      default: sailpoint
      description: "This is the name of your tenant, typically your company's name."
- description: This is the versioned API server.
  url: "https://{apiUrl}"
  variables:
    apiUrl:
      default: sailpoint.api.identitynow.com
      description: This is the api url of your tenant
security:
- userAuth:
  - sp:scopes:all
paths:
  /{path}:
    delete:
      description: Sends a DELETE request to any versioned API path.
      operationId: genericDelete
      parameters:
      - description: "API path relative to the tenant base URL, including the API\
          \ version, for example `accounts/v1`, `sources/v1/2c9180835d2e5168015d32f890ca1581`\
          \ or `sources/v2/2c9180835d2e5168015d32f890ca1581/provisioning-policies`.\
          \ Use whichever version the endpoint has. A leading slash is optional. Slashes\
          \ separate path segments, and the SDK URL-encodes each segment, so pass\
          \ the segments unencoded. Anything after a `?` is sent as query parameters,\
          \ for example `accounts/v1?detailLevel=SLIM`."
        example: accounts/v1
        explode: false
        in: path
        name: path
        required: true
        schema:
          type: string
        style: simple
      - description: Set this header to `true` to call an experimental API. The SDK
          configuration must also enable experimental APIs.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
          description: Successful response. The body is the JSON returned by the API.
        "204":
          description: No content.
      summary: Generic DELETE request
    get:
      description: "Sends a GET request to any versioned API path, for example `sources/v1/{id}/schemas`\
        \ or `sources/v2/{sourceId}/provisioning-policies`."
      operationId: genericGet
      parameters:
      - description: "API path relative to the tenant base URL, including the API\
          \ version, for example `accounts/v1`, `sources/v1/2c9180835d2e5168015d32f890ca1581`\
          \ or `sources/v2/2c9180835d2e5168015d32f890ca1581/provisioning-policies`.\
          \ Use whichever version the endpoint has. A leading slash is optional. Slashes\
          \ separate path segments, and the SDK URL-encodes each segment, so pass\
          \ the segments unencoded. Anything after a `?` is sent as query parameters,\
          \ for example `accounts/v1?detailLevel=SLIM`."
        example: accounts/v1
        explode: false
        in: path
        name: path
        required: true
        schema:
          type: string
        style: simple
      - description: "Max number of results to return. See [Standard Collection Parameters](https://developer.sailpoint.com/docs/standard-collection-parameters)\
          \ for more information."
        example: 250
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: Offset into the full result set. Usually specified with *limit*
          to paginate through the results.
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: If *true* it will populate the *X-Total-Count* response header
          with the number of results that would be returned if *limit* and *offset*
          were ignored.
        example: true
        explode: true
        in: query
        name: count
        required: false
        schema:
          type: boolean
        style: form
      - description: "Filter results using the standard syntax described in [V3 API\
          \ Standard Collection Parameters](https://developer.sailpoint.com/docs/standard-collection-parameters#filtering-results)."
        example: name eq "Example"
        explode: true
        in: query
        name: filters
        required: false
        schema:
          type: string
        style: form
      - description: "Sort results using the standard syntax described in [V3 API\
          \ Standard Collection Parameters](https://developer.sailpoint.com/docs/standard-collection-parameters#sorting-results)."
        example: "name,-created"
        explode: true
        in: query
        name: sorters
        required: false
        schema:
          type: string
        style: form
      - description: Set this header to `true` to call an experimental API. The SDK
          configuration must also enable experimental APIs.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
          description: Successful response. The body is the JSON returned by the API.
        "204":
          description: No content.
      summary: Generic GET request
    patch:
      description: "Sends a PATCH request to any versioned API path. The body is a\
        \ JSON Patch document (RFC 6902): a list of operations such as `[{\"op\":\
        \ \"replace\", \"path\": \"/description\", \"value\": \"New description\"\
        }]`."
      operationId: genericPatch
      parameters:
      - description: "API path relative to the tenant base URL, including the API\
          \ version, for example `accounts/v1`, `sources/v1/2c9180835d2e5168015d32f890ca1581`\
          \ or `sources/v2/2c9180835d2e5168015d32f890ca1581/provisioning-policies`.\
          \ Use whichever version the endpoint has. A leading slash is optional. Slashes\
          \ separate path segments, and the SDK URL-encodes each segment, so pass\
          \ the segments unencoded. Anything after a `?` is sent as query parameters,\
          \ for example `accounts/v1?detailLevel=SLIM`."
        example: accounts/v1
        explode: false
        in: path
        name: path
        required: true
        schema:
          type: string
        style: simple
      - description: Set this header to `true` to call an experimental API. The SDK
          configuration must also enable experimental APIs.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
          description: Successful response. The body is the JSON returned by the API.
        "204":
          description: No content.
      summary: Generic PATCH request
      x-codegen-request-body-name: requestBody
    post:
      description: Sends a POST request with a JSON body to any versioned API path.
      operationId: genericPost
      parameters:
      - description: "API path relative to the tenant base URL, including the API\
          \ version, for example `accounts/v1`, `sources/v1/2c9180835d2e5168015d32f890ca1581`\
          \ or `sources/v2/2c9180835d2e5168015d32f890ca1581/provisioning-policies`.\
          \ Use whichever version the endpoint has. A leading slash is optional. Slashes\
          \ separate path segments, and the SDK URL-encodes each segment, so pass\
          \ the segments unencoded. Anything after a `?` is sent as query parameters,\
          \ for example `accounts/v1?detailLevel=SLIM`."
        example: accounts/v1
        explode: false
        in: path
        name: path
        required: true
        schema:
          type: string
        style: simple
      - description: Set this header to `true` to call an experimental API. The SDK
          configuration must also enable experimental APIs.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
          description: Successful response. The body is the JSON returned by the API.
        "204":
          description: No content.
      summary: Generic POST request
      x-codegen-request-body-name: requestBody
    put:
      description: Sends a PUT request with a JSON body to any versioned API path.
      operationId: genericPut
      parameters:
      - description: "API path relative to the tenant base URL, including the API\
          \ version, for example `accounts/v1`, `sources/v1/2c9180835d2e5168015d32f890ca1581`\
          \ or `sources/v2/2c9180835d2e5168015d32f890ca1581/provisioning-policies`.\
          \ Use whichever version the endpoint has. A leading slash is optional. Slashes\
          \ separate path segments, and the SDK URL-encodes each segment, so pass\
          \ the segments unencoded. Anything after a `?` is sent as query parameters,\
          \ for example `accounts/v1?detailLevel=SLIM`."
        example: accounts/v1
        explode: false
        in: path
        name: path
        required: true
        schema:
          type: string
        style: simple
      - description: Set this header to `true` to call an experimental API. The SDK
          configuration must also enable experimental APIs.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
          description: Successful response. The body is the JSON returned by the API.
        "204":
          description: No content.
      summary: Generic PUT request
      x-codegen-request-body-name: requestBody
components:
  parameters:
    path:
      description: "API path relative to the tenant base URL, including the API version,\
        \ for example `accounts/v1`, `sources/v1/2c9180835d2e5168015d32f890ca1581`\
        \ or `sources/v2/2c9180835d2e5168015d32f890ca1581/provisioning-policies`.\
        \ Use whichever version the endpoint has. A leading slash is optional. Slashes\
        \ separate path segments, and the SDK URL-encodes each segment, so pass the\
        \ segments unencoded. Anything after a `?` is sent as query parameters, for\
        \ example `accounts/v1?detailLevel=SLIM`."
      example: accounts/v1
      explode: false
      in: path
      name: path
      required: true
      schema:
        type: string
      style: simple
    experimental:
      description: Set this header to `true` to call an experimental API. The SDK
        configuration must also enable experimental APIs.
      example: "true"
      explode: false
      in: header
      name: X-SailPoint-Experimental
      required: false
      schema:
        type: string
      style: simple
  responses:
    GenericResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericResponse'
      description: Successful response. The body is the JSON returned by the API.
  schemas:
    GenericRequest:
      description: Any JSON value. Most endpoints take an object. PATCH endpoints
        take a list of JSON Patch operations.
    GenericResponse:
      description: "Any JSON value returned by the API, usually an object or a list\
        \ of objects."
