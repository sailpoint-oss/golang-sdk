              summary: An example of a 500 response object
              value:
                detailCode: 500.0 Internal Fault
                trackingId: b21b1f7ce4da4d639f2c62a57171b427
                messages:
                - locale: en-US
                  localeOrigin: DEFAULT
                  text: An internal fault occurred.
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
      description: Internal Server Error - Returned if there is an unexpected error.
  schemas:
    BaseCommonDto:
      properties:
        id:
          description: System-generated unique ID of the Object
          example: id12345
          readOnly: true
          type: string
        name:
          description: Name of the Object
          example: aName
          nullable: true
          type: string
        created:
          description: Creation date of the Object
          example: 2015-05-28T14:07:17Z
          format: date-time
          readOnly: true
          type: string
        modified:
          description: Last modification date of the Object
          example: 2015-05-28T14:07:17Z
          format: date-time
          readOnly: true
          type: string
      required:
      - name
      title: Base Common Dto
      type: object
    DeviceOS:
      description: The operating system reported by the source for a device.
      example:
        type: macos
        version: "14.5"
      properties:
        type:
          description: The operating system type.
          example: macos
          type: string
        version:
          description: The operating system version.
          example: "14.5"
          type: string
      title: Device OS
      type: object
    DtoType:
      description: An enumeration of the types of DTOs supported within the IdentityNow
        infrastructure.
      enum:
      - ACCOUNT_CORRELATION_CONFIG
      - ACCESS_PROFILE
      - ACCESS_REQUEST_APPROVAL
      - ACCOUNT
      - APPLICATION
      - CAMPAIGN
      - CAMPAIGN_FILTER
      - CERTIFICATION
      - CLUSTER
      - CONNECTOR_SCHEMA
      - ENTITLEMENT
      - GOVERNANCE_GROUP
      - IDENTITY
      - IDENTITY_PROFILE
      - IDENTITY_REQUEST
      - MACHINE_IDENTITY
      - LIFECYCLE_STATE
      - PASSWORD_POLICY
      - ROLE
      - RULE
      - SOD_POLICY
      - SOURCE
      - TAG
      - TAG_CATEGORY
      - TASK_RESULT
      - REPORT_RESULT
      - SOD_VIOLATION
      - ACCOUNT_ACTIVITY
      - WORKGROUP
      example: IDENTITY
      type: string
    BaseReferenceDto:
      properties:
        type:
          $ref: '#/components/schemas/DtoType'
        id:
          description: ID of the object to which this reference applies
          example: 2c91808568c529c60168cca6f90c1313
          type: string
        name:
          description: Human-readable display name of the object to which this reference
            applies
          example: William Wilson
          type: string
      title: Base Reference Dto
      type: object
    DeviceResource:
      description: The source resource a device is derived from.
      example:
        features:
        - PROVISIONING
        name: lab-mbp-0142
        id: 8886e5e3-63d0-462f-a195-d98da885b8dc
        type: endpoint
      properties:
        id:
          description: The source resource identifier.
          example: 8886e5e3-63d0-462f-a195-d98da885b8dc
          type: string
        type:
          description: The type of the source resource.
          example: endpoint
          type: string
        name:
          description: The display name of the source resource.
          example: lab-mbp-0142
          type: string
        features:
          description: The set of features supported by the source resource.
          example:
          - PROVISIONING
          items:
            type: string
          type: array
      title: Device Resource
      type: object
    DeviceOwners:
      description: Owner configuration for a device. A single primary (human IDENTITY)
        owner plus additional owners that are either up to ten human (IDENTITY) references
        or exactly one GOVERNANCE_GROUP reference - not both.
      example:
        secondary:
        - id: 2c9180858082150f0180893dbaf44202
          name: Jane Doe
          type: IDENTITY
        primary:
          name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
      properties:
        primary:
          $ref: '#/components/schemas/DeviceOwners_primary'
        secondary:
          description: Additional owners. Entries are either up to ten human (IDENTITY)
            references or exactly one GOVERNANCE_GROUP reference - not both. Governance-group
            owners appear here with type GOVERNANCE_GROUP.
          example:
          - id: 2c9180858082150f0180893dbaf44202
            name: Jane Doe
            type: IDENTITY
          items:
            $ref: '#/components/schemas/BaseReferenceDto'
          maxItems: 10
          type: array
      title: Device Owners
      type: object
    Device:
      allOf:
      - $ref: '#/components/schemas/BaseCommonDto'
      - properties:
          nativeIdentity:
            description: The device's unique identifier on the source.
            example: 6c2f4a8e-1d3b-4f6a-9e2c-7b5d8a1f0c34
            type: string
          description:
            description: Description of the device.
            example: Finance team laptop
            type: string
          environment:
            description: The environment the device belongs to.
            example: production
            type: string
          hostname:
            description: The device hostname reported by the source.
            example: lab-mbp-0142
            type: string
          os:
            $ref: '#/components/schemas/DeviceOS'
          email:
            description: The email address the source reports for the device.
            example: jane.doe@example.com
            type: string
          sentinelVersion:
            description: The version of the endpoint agent the source reports for
              the device.
            example: 24.1.2.6
            type: string
          detectionModuleVersion:
            description: The version of the detection module the source reports for
              the device.
            example: 3.4.1
            type: string
          source:
            $ref: '#/components/schemas/Device_allOf_source'
          resource:
            $ref: '#/components/schemas/DeviceResource'
          datasetId:
            description: The ID of the source dataset the device was retrieved from.
            example: 8886e5e3-63d0-462f-a195-d98da885b8dc
            type: string
          owners:
            $ref: '#/components/schemas/DeviceOwners'
          connectorAttributes:
            additionalProperties: true
            description: A map of attributes sourced from the connector during aggregation.
            example:
              agentId: 1785462398123456800
            type: object
          attributes:
            additionalProperties: true
            description: A map of curated device attributes.
            example:
              hostname: lab-mbp-0142
              osType: macos
            type: object
        type: object
      description: "A device, such as a laptop or server, discovered from a connected\
        \ source."
      example:
        os:
          type: macos
          version: "14.5"
        detectionModuleVersion: 3.4.1
        resource:
          features:
          - PROVISIONING
          name: lab-mbp-0142
          id: 8886e5e3-63d0-462f-a195-d98da885b8dc
          type: endpoint
        created: 2015-05-28T14:07:17Z
        connectorAttributes:
          agentId: 1785462398123456800
        description: Finance team laptop
        owners:
          secondary:
          - id: 2c9180858082150f0180893dbaf44202
            name: Jane Doe
            type: IDENTITY
          primary:
            name: William Wilson
            id: 2c91808568c529c60168cca6f90c1313
            type: IDENTITY
        source:
          name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
        nativeIdentity: 6c2f4a8e-1d3b-4f6a-9e2c-7b5d8a1f0c34
        sentinelVersion: 24.1.2.6
        environment: production
        hostname: lab-mbp-0142
        name: aName
        modified: 2015-05-28T14:07:17Z
        datasetId: 8886e5e3-63d0-462f-a195-d98da885b8dc
        attributes:
          hostname: lab-mbp-0142
          osType: macos
        id: id12345
        email: jane.doe@example.com
      title: Device
      type: object
    LocaleOrigin:
      description: "An indicator of how the locale was selected. *DEFAULT* means the\
        \ locale is the system default. *REQUEST* means the locale was selected from\
        \ the request context (i.e., best match based on the *Accept-Language* header).\
        \ Additional values may be added in the future without notice."
      enum:
      - DEFAULT
      - REQUEST
      - null
      example: DEFAULT
      nullable: true
      type: string
    ErrorMessageDto:
      example:
        localeOrigin: DEFAULT
        text: The request was syntactically correct but its content is semantically
          invalid.
        locale: en-US
      properties:
        locale:
          description: "The locale for the message text, a BCP 47 language tag."
          example: en-US
          nullable: true
          type: string
        localeOrigin:
          $ref: '#/components/schemas/LocaleOrigin'
        text:
          description: Actual text of the error message in the indicated locale.
          example: The request was syntactically correct but its content is semantically
            invalid.
          type: string
      title: Error Message Dto
      type: object
    ErrorResponseDto:
      example:
        causes:
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        messages:
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        detailCode: 400.1 Bad Request Content
        trackingId: e7eab60924f64aa284175b9fa3309599
      properties:
        detailCode:
          description: Fine-grained error code providing more detail of the error.
          example: 400.1 Bad Request Content
          type: string
        trackingId:
          description: Unique tracking id for the error.
          example: e7eab60924f64aa284175b9fa3309599
          type: string
        messages:
          description: Generic localized reason for error
          items:
            $ref: '#/components/schemas/ErrorMessageDto'
          type: array
        causes:
          description: Plain-text descriptive reasons to provide additional detail
            to the text provided in the messages field
          items:
            $ref: '#/components/schemas/ErrorMessageDto'
          type: array
      title: Error Response Dto
      type: object
    DeviceOSCounts:
      description: The number of devices for each operating system.
      example:
        linux: 85
        windows: 540
        macos: 610
        unknown: 15
      properties:
        macos:
          description: The number of macOS devices.
          example: 610
          format: int64
          type: integer
        windows:
          description: The number of Windows devices.
          example: 540
          format: int64
          type: integer
        linux:
          description: The number of Linux devices.
          example: 85
          format: int64
          type: integer
        unknown:
          description: "The number of devices whose operating system is missing or\
            \ is not macOS, Windows, or Linux."
          example: 15
          format: int64
          type: integer
      title: Device OS Counts
      type: object
    DeviceSummary:
      description: Tenant-wide device counts.
      example:
        endpointsWithoutRecentData: 37
        byOs:
          linux: 85
          windows: 540
          macos: 610
          unknown: 15
        avgAgentsPerEndpoint: 2.4
        totalEndpoints: 1250
        endpointsWithActiveAgents: 980
      properties:
        totalEndpoints:
          description: The total number of devices in the tenant.
          example: 1250
          format: int64
          type: integer
        byOs:
          $ref: '#/components/schemas/DeviceOSCounts'
        avgAgentsPerEndpoint:
          description: "The average number of agents per device, rounded to one decimal\
            \ place."
          example: 2.4
          format: double
          type: number
        endpointsWithoutRecentData:
          description: The number of devices for which the source has sent no endpoint
            data or resource link in the last three days.
          example: 37
          format: int64
          type: integer
        endpointsWithActiveAgents:
          description: The number of devices linked to at least one existing agent.
          example: 980
          format: int64
          type: integer
      title: Device Summary
      type: object
    JsonPatchOperation:
      description: "A JSONPatch Operation as defined by [RFC 6902 - JSON Patch](https://tools.ietf.org/html/rfc6902)"
      example:
        op: replace
        path: /description
        value: New description
      properties:
        op:
          description: The operation to be performed
          enum:
          - add
          - remove
          - replace
          - move
          - copy
          - test
          example: replace
          type: string
        path:
          description: A string JSON Pointer representing the target path to an element
            to be affected by the operation
          example: /description
          type: string
        value:
          $ref: '#/components/schemas/JsonPatchOperation_value'
      required:
      - op
      - path
      title: Json Patch Operation
      type: object
