  parameters:
    intelligence-identity-id-path:
      description: Non-empty identity id path segment for Intelligence sub-resources.
      example: ef38f94347e94562b5bb8424a56397d8
      explode: false
      in: path
      name: id
      required: true
      schema:
        maxLength: 128
        minLength: 1
        type: string
      style: simple
      x-sailpoint-resource-operation-id: listIdentitiesV1
    count:
      description: |-
        If *true* it will populate the *X-Total-Count* response header with the number of results that would be returned if *limit* and *offset* were ignored.

        Since requesting a total count can have a performance impact, it is recommended not to send **count=true** if that value will not be used.

        See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
      example: true
      explode: true
      in: query
      name: count
      required: false
      schema:
        default: false
        type: boolean
      style: form
  responses:
    "401":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/getIdentityIntelligenceV1_401_response'
      description: "Unauthorized - Returned if there is no authorization header, or\
        \ if the JWT token is expired."
    "429":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/getIdentityIntelligenceV1_429_response'
      description: Too Many Requests - Returned in response to too many requests in
        a given period of time - rate limited. The Retry-After header in the response
        includes how long to wait before trying again.
  schemas:
    Intelidentitygraphlink:
      description: |
        Deep link into Identity Graph UI for the resolved identity at the aggregate root.
        Omitted when the tenant lacks the idg:base license.
      properties:
        href:
          description: |
            Absolute URL to the Identity Graph view. Omitted when the tenant lacks idg:base or when
            the IDN UI host cannot be resolved from sp-tenant. Query parameters include entity and id
            for the resolved identity.
          example: https://tenant.example.api.cloud.sailpoint.com/ui/identity-graph?entity=identity&id=ef38f94347e94562b5bb8424a56397d8
          format: uri
          type: string
      required:
      - href
      type: object
    IntelAccessSourceWire:
      properties:
        id:
          description: Source identifier referenced by the account wire object.
          example: 2c9180835d2e5168015d32f890301e89
          type: string
        name:
          description: Human-readable source name shown in administrative consoles.
          example: Active Directory
          type: string
      type: object
    IntelAccessAccountWire:
      example:
        authoritative: true
        created: 2023-11-01T10:00:00Z
        name: jdoe
        modified: 2024-02-15T16:20:00Z
        disabled: false
        id: 2c91808874ff91550175097daaec161c
        source: "{}"
        locked: false
        systemAccount: false
        manuallyCorrelated: false
        nativeIdentity: "CN=jdoe,OU=Users,DC=example,DC=com"
        isMachine: false
      properties:
        id:
          description: Unique account identifier in Identity Security Cloud.
          example: 2c91808874ff91550175097daaec161c
          type: string
        name:
          description: Account name or login value on the correlated source.
          example: jdoe
          type: string
        source:
          allOf:
          - $ref: '#/components/schemas/IntelAccessSourceWire'
          description: Source metadata for the account as returned by List Accounts
            wire format.
          type: object
        disabled:
          description: True when the account is administratively disabled on the source.
          example: false
          type: boolean
        locked:
          description: True when the account is locked from interactive sign-in on
            the source.
          example: false
          type: boolean
        authoritative:
          description: True when the account is treated as authoritative for attribute
            synchronization.
          example: true
          type: boolean
        systemAccount:
          description: True when the account represents a non-interactive or system
            principal.
          example: false
          type: boolean
        isMachine:
          description: True when the account belongs to a machine or service identity.
          example: false
          type: boolean
        manuallyCorrelated:
          description: True when an administrator manually correlated the account
            to an identity.
          example: false
          type: boolean
        nativeIdentity:
          description: Native identifier string on the source directory or application.
          example: "CN=jdoe,OU=Users,DC=example,DC=com"
          nullable: true
          type: string
        created:
          description: Timestamp when the account record was created in Identity Security
            Cloud.
          example: 2023-11-01T10:00:00Z
          format: date-time
          type: string
        modified:
          description: Timestamp when the account record was last modified in Identity
            Security Cloud.
          example: 2024-02-15T16:20:00Z
          format: date-time
          type: string
      required:
      - authoritative
      - created
      - disabled
      - id
      - isMachine
      - locked
      - manuallyCorrelated
      - modified
      - name
      - systemAccount
      type: object
    IntelAccountsSlice:
      description: Accounts slice embedded in the aggregate identity response.
      properties:
        items:
          description: First page of accounts for the identity.
          items:
            $ref: '#/components/schemas/IntelAccessAccountWire'
          type: array
        totalCount:
          description: Total number of accounts for this identity; omitted when `items`
            is empty.
          example: 42
          format: int32
          minimum: 1
          type: integer
        next:
          description: Absolute URL to the next accounts page; present when totalCount
            exceeds the items returned on this page.
          example: https://tenant.example.api.cloud.sailpoint.com/intelligence/identities/v1/ef38f94347e94562b5bb8424a56397d8/accounts?limit=10&offset=10&count=true
          format: uri
          type: string
      required:
      - items
      type: object
    Intelprivilegelevel:
      description: |
        Effective privilege level for the privileged access item. Set to HIGH, MEDIUM, or LOW based on
        the tenant's privilege classification configuration, including connector criteria, custom criteria,
        manual overrides, or a single configured privilege level. Use NONE when no privilege level is
        assigned. Entitlements previously marked with privileged=true are classified as HIGH.
      properties:
        effective:
          description: |
            Effective privilege level for the privileged access item.
          enum:
          - HIGH
          - MEDIUM
          - LOW
          - NONE
          example: HIGH
          type: string
      type: object
    IntelPrivilegedAccessItemWire:
      properties:
        privileged:
          description: True when this item is classified as privileged access for
            the identity.
          example: true
          type: boolean
        privilegeLevel:
          $ref: '#/components/schemas/Intelprivilegelevel'
        id:
          description: Identifier of the privileged access item.
          example: ent-1
          type: string
        type:
          description: Type of privileged access object.
          example: entitlement
          type: string
        displayName:
          description: Display label for the privileged access item in administrative
            experiences.
          example: Example_Admin_Access
          type: string
        name:
          description: Technical name of the privileged access item.
          example: Example_Admin_Access
          type: string
        source:
          $ref: '#/components/schemas/IntelPrivilegedAccessItemWire_source'
        attribute:
          description: Source attribute name that carries the privileged value when
            applicable.
          example: EXAMPLE_PERMISSION_GROUPS
          type: string
        value:
          description: Privileged value on the source attribute when applicable.
          example: Example_Admin_Access
          type: string
      required:
      - id
      - privileged
      - type
      type: object
    IntelPrivilegedAccessSlice:
      description: Full privileged access result embedded in the aggregate identity
        response.
      properties:
        items:
          description: Privileged access items for the identity.
          items:
            $ref: '#/components/schemas/IntelPrivilegedAccessItemWire'
          type: array
      required:
      - items
      type: object
    IntelOutlierAccessItem:
      description: One outlier access-item row.
      example:
        accessType: ENTITLEMENT
        displayName: Example_Admin_Access
        extremelyRare: false
        description: description
        id: outlier-access-001
        sourceName: Example SaaS Source
      properties:
        id:
          description: Stable identifier of the outlier access-item row.
          example: outlier-access-001
          type: string
        displayName:
          description: Display label of the risky access item.
          example: Example_Admin_Access
          type: string
        description:
          description: Optional descriptive text for the risky access item.
          nullable: true
          type: string
          example: null
        accessType:
          description: Access item type.
          example: ENTITLEMENT
          type: string
        sourceName:
          description: Source name where the risky access item exists.
          example: Example SaaS Source
          type: string
        extremelyRare:
          description: Indicates whether analytics marked this item as extremely rare.
          example: false
          type: boolean
      required:
      - accessType
      - displayName
      - extremelyRare
      - id
      - sourceName
      type: object
    IntelRareAccessSlice:
      description: Rare access slice embedded in the aggregate identity response.
      properties:
        items:
          description: First page of rare access items for the identity.
          items:
            $ref: '#/components/schemas/IntelOutlierAccessItem'
          type: array
        totalCount:
          description: Total number of rare-access items for the resolved outlier;
            omitted when `items` is empty.
          example: 15
          format: int32
          minimum: 1
          type: integer
        next:
          description: Absolute URL to the next rareAccess page; present when totalCount
            exceeds the items returned on this page.
          example: https://tenant.example.api.cloud.sailpoint.com/intelligence/identities/v1/ef38f94347e94562b5bb8424a56397d8/outliers/rare-access?limit=10&offset=10&count=true
          format: uri
          type: string
      required:
      - items
      type: object
    IntelOutliersSlice:
      description: Outlier slices embedded in the aggregate identity response.
      properties:
        rareAccess:
          allOf:
          - $ref: '#/components/schemas/IntelRareAccessSlice'
          description: First page of rare access items for the identity.
      required:
      - rareAccess
      type: object
    IntelAccessItemHistoryEvent:
      additionalProperties: true
      description: |
        Access-item history event. Supported eventTypes are AccessItemAssociated, AccessItemRemoved,
        and AccountStatusChanged.
      example:
        dateTime: 2026-05-11T09:40:04.496Z
        eventType: AccessItemRemoved
      properties:
        eventType:
          description: Type of access-item history event.
          enum:
          - AccessItemAssociated
          - AccessItemRemoved
          - AccountStatusChanged
