          format: int32
          minimum: 1
          type: integer
        next:
          description: Absolute URL to the next access-items page; present when totalCount
            exceeds the items returned on this page.
          example: https://tenant.example.api.cloud.sailpoint.com/intelligence/identities/v1/ef38f94347e94562b5bb8424a56397d8/access-history/access-items?limit=10&offset=10&count=true
          format: uri
          type: string
      required:
      - items
      type: object
    IntelCertificationHistoryEvent:
      additionalProperties: true
