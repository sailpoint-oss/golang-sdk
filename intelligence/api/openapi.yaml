components:
  examples:
    intel-identity-human-envelope:
      description: Human identity envelope returned when filters match a human record
        (type Human).
      value:
        id: ef38f94347e94562b5bb8424a56397d8
        type: Human
        displayName: Example User
        subtype: Employee
        attributes:
          city: Example City
          cloudStatus: ACTIVE
        created: 2026-05-12T08:00:00Z
        modified: 2026-05-12T09:15:30Z
        alias: example.user
        email: user@example.com
        identityStatus: ACTIVE
        isManager: false
        identityGraph:
          href: https://tenant.example.api.cloud.sailpoint.com/ui/identity-graph?entity=identity&id=ef38f94347e94562b5bb8424a56397d8
        accounts:
          items:
          - id: 2c91808874ff91550175097daaec161c
            name: example.user
            source:
              id: 60de165099e649cb828553a5e8510fc4
              name: Example Directory
            disabled: false
            locked: false
            authoritative: false
            systemAccount: false
            isMachine: false
