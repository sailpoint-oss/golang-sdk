          type: string
        email:
          description: Email for authorized human holders when available upstream.
          example: user@example.com
          type: string
      required:
      - id
      - name
      - type
      type: object
    Intelmachineaccountwire:
      description: "Machine account row on the non-human identity aggregate accounts.items\
        \ list. Every property in required is always present on the wire. Nullable\
        \ object refs (source, machineIdentity, ownerIdentity) may be null. String\
        \ fields may be empty when upstream has no value; booleans, timestamps, attributes,\
        \ and connectorAttributes are always emitted (empty object when absent)."
      properties:
        id:
          description: Unique account identifier in Identity Security Cloud.
          example: 2c91808874ff91550175097daaec161c
          type: string
        name:
          description: Account name on the correlated source.
          example: account-name
          type: string
        nativeIdentity:
          description: Native identifier on the source system.
          example: arn:aws:bedrock:us-east-1:336721:agent/ABCDEFGHI
          type: string
        source:
          allOf:
          - $ref: '#/components/schemas/Intelmachinesourcewire'
          description: Source metadata for the machine account when present upstream.
          nullable: true
        enabled:
          description: True when the account is enabled for use on the source.
          example: true
          type: boolean
        locked:
          description: True when the account is locked on the source.
          example: false
          type: boolean
        machineIdentity:
          allOf:
          - $ref: '#/components/schemas/Intelmachineentityref'
          description: Reference to the parent machine identity when populated upstream.
          nullable: true
        ownerIdentity:
          allOf:
          - $ref: '#/components/schemas/Intelmachineentityref'
          description: Reference to the owning human identity when populated upstream.
          nullable: true
        description:
          description: Free-text account description from the source.
          example: Service account for automation
          type: string
        subtype:
          description: Account subtype label from upstream classification.
          example: Service Account
          type: string
        accessType:
          description: Access type label for the account (for example account or entitlement).
          example: account
          type: string
        environment:
          description: Environment label associated with the account.
          example: production
          type: string
        classificationMethod:
          description: Method used to classify the account as a machine account.
          example: DISCOVERED
          type: string
        manuallyEdited:
          description: True when an administrator manually edited account attributes.
          example: false
          type: boolean
        manuallyCorrelated:
          description: True when an administrator manually correlated the account.
          example: false
          type: boolean
        hasEntitlements:
          description: True when the account holds one or more entitlements.
          example: true
          type: boolean
        created:
          description: Timestamp when the account record was created.
          example: 2026-01-01T00:00:00Z
          format: date-time
          type: string
        modified:
          description: Timestamp when the account record was last modified.
          example: 2026-05-01T00:00:00Z
          format: date-time
          type: string
        attributes:
          additionalProperties: true
          description: Extended account attributes from the source connector.
          example: {}
          type: object
        connectorAttributes:
          additionalProperties: true
          description: Connector-specific attribute bag from upstream.
          example: {}
          type: object
      required:
      - accessType
      - attributes
      - classificationMethod
      - connectorAttributes
      - created
      - description
      - enabled
      - environment
      - hasEntitlements
      - id
      - locked
      - machineIdentity
      - manuallyCorrelated
      - manuallyEdited
      - modified
      - name
      - nativeIdentity
      - ownerIdentity
      - source
      - subtype
      type: object
    Intelmachineaccountsslice:
      description: |
        Correlated machine accounts embedded on the non-human identity aggregate. Returns the correlated
        account set on the wire today (account paging via child routes is not yet released).
      properties:
        items:
          description: Machine account rows correlated to the non-human identity.
          items:
            $ref: '#/components/schemas/Intelmachineaccountwire'
          type: array
      required:
      - items
      type: object
    Intelmachineidentityowners:
      description: |
        Owner references. primaryIdentity is null when no primary owner is set. Primary and
        secondary owner ids are both considered for derived.isOrphaned evaluation.
      properties:
        primaryIdentity:
          allOf:
          - $ref: '#/components/schemas/Intelmachineentityref'
          description: Primary human owner of the machine identity when assigned.
          nullable: true
        secondaryIdentities:
          description: Secondary human owners associated with the machine identity.
          items:
            $ref: '#/components/schemas/Intelmachineentityref'
          type: array
      required:
      - primaryIdentity
      - secondaryIdentities
      type: object
    Intelmachineuserentitlement:
      properties:
        sourceId:
          description: Source identifier for the entitlement.
          example: 60de165099e649cb828553a5e8510fc4
          type: string
        entitlementId:
          description: Entitlement identifier on the source.
          example: ent-001
          type: string
        displayName:
          description: Display name for the entitlement.
          example: Example_Entitlement
          type: string
        source:
          allOf:
          - $ref: '#/components/schemas/Intelmachinesourcewire'
          description: Resolved source metadata when available upstream.
          nullable: true
      required:
      - displayName
      - entitlementId
      - sourceId
      type: object
    Intelblastradiussummary:
      description: "Fast SOC view of impact across sources, accounts, and humans."
      properties:
        impactedSources:
          description: Source systems that may be impacted if compromised.
          example:
          - Example AWS Source
          items:
            type: string
          type: array
        impactedAccounts:
          description: Linked machine accounts that may be impacted if compromised.
          example: 1
          format: int32
          type: integer
        impactedHumans:
          description: Unique owners and authorized humans potentially impacted if
            compromised.
          example: 1
          format: int32
          type: integer
        hasEntitlements:
          default: false
          description: Whether this NHI holds entitlements included in summary.
          example: true
          type: boolean
        environments:
          description: Environment labels for impacted access in this summary.
          example:
          - production
          items:
            type: string
          type: array
        accessTypes:
          description: Access type labels for impacted access in this summary.
          example:
          - entitlement
          items:
            type: string
          type: array
      required:
      - impactedAccounts
      - impactedHumans
      - impactedSources
      type: object
    Intelmachinederived:
      description: Derived SOC triage signals for non-human identity risk assessment.
      properties:
        isOrphaned:
          description: Flags NHIs without a valid active owner for prioritization.
          example: false
          type: boolean
        authorizedHumanIdentities:
          description: Humans who can invoke or access this NHI agent.
          example:
          - type: IDENTITY
            id: ef38f94347e94562b5bb8424a56397d8
            name: Example User
            email: user@example.com
          items:
            $ref: '#/components/schemas/Intelmachineentityref'
          type: array
        blastRadiusSummary:
          $ref: '#/components/schemas/Intelblastradiussummary'
      required:
      - authorizedHumanIdentities
      - blastRadiusSummary
      - isOrphaned
      type: object
    Intelidentitymachineaggregate:
      description: |
        Non-human identity response (type NHI). Machine identity fields are hoisted to the top level
        (no machine wrapper). Omits human-only fields and slices (email, alias, privilegedAccess, outliers,
        accessHistory). Top-level sourceId is omitted; use source.id when present. matchConfidence is
        present for opaque prefix resolution (exact or partial); omitted for direct id eq and exact opaque
        matches.
      properties:
        id:
          description: Identity Security Cloud identifier for this non-human identity.
          example: ef38f94347e94562b5bb8424a56397d8
          type: string
        type:
          description: Identity type for the matched record.
          enum:
          - NHI
          example: NHI
          type: string
        displayName:
          description: Preferred display name for the non-human identity.
          example: display name
          type: string
        description:
          description: Optional description from upstream when present.
          nullable: true
          type: string
        subtype:
          description: Sub-classification label for that NHI.
          example: AI Agent
          nullable: true
          type: string
        created:
          description: Timestamp when the identity record was created in Identity
            Security Cloud.
          example: 2026-05-12T08:00:00Z
          format: date-time
          type: string
        modified:
          description: Timestamp when the identity record was last modified in Identity
            Security Cloud.
          example: 2026-05-12T09:15:30Z
          format: date-time
          type: string
        matchConfidence:
          description: Match quality for opaque prefix resolution; omitted for direct
            id eq and exact opaque matches.
          enum:
          - exact
          - partial
          example: exact
          type: string
        identityGraph:
          allOf:
          - $ref: '#/components/schemas/Intelidentitygraphlink'
          description: Omitted when the tenant lacks the idg:base license.
          type: object
        accounts:
          $ref: '#/components/schemas/Intelmachineaccountsslice'
        nativeIdentity:
          description: Native identifier on the source system.
          example: arn:aws:bedrock:us-east-1:336721:agent/ABCDEFGHI
          type: string
        datasetId:
          description: Dataset identifier from upstream machine-identity services
            when present.
          example: dataset-001
          nullable: true
          type: string
        source:
          allOf:
          - $ref: '#/components/schemas/Intelmachinesourcewire'
          description: Source metadata for the machine identity when present upstream.
          nullable: true
        existsOnSource:
          description: Upstream existsOnSource value. Wire uses uppercase strings
            such as TRUE or FALSE.
          example: "TRUE"
          nullable: true
          type: string
        manuallyEdited:
          default: false
          description: True when an administrator manually edited machine identity
            attributes.
          example: false
          type: boolean
        manuallyCreated:
          default: false
          description: True when the machine identity was created manually in Identity
            Security Cloud.
          example: false
          type: boolean
        owners:
          $ref: '#/components/schemas/Intelmachineidentityowners'
        userEntitlements:
          description: Entitlements associated with the machine identity from upstream.
          items:
            $ref: '#/components/schemas/Intelmachineuserentitlement'
          type: array
        attributes:
          additionalProperties: true
          description: Connector or runtime metadata; empty object when absent upstream.
          example: {}
          type: object
        derived:
          $ref: '#/components/schemas/Intelmachinederived'
      required:
      - accounts
      - attributes
      - derived
      - id
      - nativeIdentity
      - owners
      - type
      type: object
    Intelidentityenvelope:
      discriminator:
        mapping:
          Human: '#/components/schemas/IntelIdentityAggregate'
          NHI: '#/components/schemas/Intelidentitymachineaggregate'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/IntelIdentityAggregate'
      - $ref: '#/components/schemas/Intelidentitymachineaggregate'
