  description: "Use these APIs to interact with the Identity Security Cloud platform\
    \ to achieve repeatable, automated processes with greater scalability. We encourage\
    \ you to join the SailPoint Developer Community forum at https://developer.sailpoint.com/discuss\
    \ to connect with other developers using our APIs."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://developer.sailpoint.com/discuss/tos
  title: Identity Security Cloud API - Intelligence
  version: v1
servers:
- description: This is the production API server.
  url: "https://{tenant}.api.identitynow.com"
  variables:
    tenant:
      default: sailpoint
      description: "This is the name of your tenant, typically your company's name."
- description: This is the versioned API server.
  url: "https://{apiUrl}"
  variables:
    apiUrl:
      default: sailpoint.api.identitynow.com
      description: This is the api url of your tenant
security:
- userAuth:
  - sp:scopes:all
tags:
- description: |
    Read-only HTTP API that returns the Intelligence (identity context)
    for SecOps enrichment use cases (SIEM/SOAR connectors, MCP, browser
    extension). Backed by Atlas internal-REST calls to MICE, Shelby List Accounts,
    SDS Search, IDA-outliers, and identity-history.

    ## Pagination

    The aggregated Human GET embeds the first **10** items per paged slice. Each upstream paged call
    sends `count=true` and reads `X-Total-Count`. Parent slices expose `totalCount` when `items` is
    non-empty and set `next` when `totalCount > offset + len(items)` (aggregate offset is always 0).
    Empty slices render as `items: []` with no `totalCount`. `privilegedAccess` is never paged and
    carries no `totalCount`.

    Human child routes (`/accounts`, `/outliers/rare-access`, `/access-history/*`) follow the
    SailPoint V3 pattern: pass `count=true` to receive `X-Total-Count` (including `0` on empty
    pages). When `count` is omitted, upstream count work is skipped and the header is omitted.
  name: Intelligence
paths:
  /intelligence/v1/identities:
    get:
      description: |
        Requires tenant license idn:response-and-remediation.

        **Authentication and data segmentation**

        Intelligence forwards the caller JWT to downstream identity and search services (context client).
        Enriched results, including non-human identity resolution, are filtered to the caller's Data
        Segmentation visibility.

        **Caution:** Generic API Management API keys are not tied to a user identity. When Data
        Segmentation is enabled, API key authentication may fail or return incomplete data because
        downstream calls require a user context. Use a [personal access token](https://developer.sailpoint.com/docs/api/authentication/#generate-a-personal-access-token)
        or other user-scoped OAuth token. See [API keys](https://documentation.sailpoint.com/saas/help/common/api_keys.html)
        and [Data Segmentation](https://documentation.sailpoint.com/saas/help/segmentation/index.html).

        Resolves exactly one identity using a single SCIM-style filters expression.

        **Supported filters**

        | Filter field | Lookup mode | Notes |
        |---|---|---|
        | id eq | Human (+ optional non-human identity when feature-flagged) | Resolves human identities by id; when non-human resolution is enabled, a parallel non-human lookup runs. If both match different identities, returns HTTP 409. |
        | email eq | Human only | Human identity lookup by email only. |
        | opaqueIdentifier eq | Non-human identity only | Parallel nativeIdentity eq on machine-identities and machine-accounts, then name-prefix fallback on machine-accounts. Requires feature flag ISCRR-1905_NHI_TYPE_MACHINE_FILTER_ENABLED; when disabled, returns HTTP 400. |

        Single-clause filters only; composite and or expressions are rejected with HTTP 400.

        **Human envelope (type Human)**

        Embeds the first page (10 items) of each enrichment slice. Each paged slice includes totalCount
        from upstream X-Total-Count when items is non-empty, and carries a next continuation URL when
        totalCount exceeds the items returned on this page. Slices are always present (empty uses
        items [] with no totalCount). privilegedAccess returns the full privileged-access result and never carries
        next or totalCount. If any enrichment upstream fails, the whole request fails with HTTP 500,
        except outliers, which is omitted (not an error) when the tenant lacks the IDA-outliers license
        (upstream 401 or 403). identityGraph is omitted when the tenant lacks the idg:base license.

        **Non-human identity envelope (type NHI)**

        Returns flat non-human identity fields at the top level plus correlated machine accounts on the
        aggregate and a derived block (isOrphaned, authorizedHumanIdentities, blastRadiusSummary).
        Omits Human-only slices (privilegedAccess, outliers, accessHistory). Account paging via child
        routes is not yet released. Opaque prefix resolution that deduplicates to one parent identity
        returns HTTP 200 with matchConfidence partial; multiple distinct parent identities return HTTP 409
        with IDC_IDENTITY_AMBIGUOUS and candidate id and displayName values. identityGraph is omitted
        when the tenant lacks the idg:base license.
      operationId: getIdentityIntelligenceV1
      parameters:
      - description: |-
          Filter results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)

          Filtering is supported for the following fields and operators:

          **id**: *eq*

          **email**: *eq*

          **opaqueIdentifier**: *eq*
        examples:
          byId:
            value: id eq "ef38f94347e94562b5bb8424a56397d8"
          byEmail:
            value: email eq "user@example.com"
          byOpaqueIdentifier:
            value: opaqueIdentifier eq "arn:aws:bedrock:us-east-1:336721:agent/ABCDEFGHI"
        explode: true
        in: query
        name: filters
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                Human identity:
                  $ref: '#/components/examples/intel-identity-human-envelope'
                Non-human identity (NHI):
                  $ref: '#/components/examples/intel-identity-nhi-envelope'
              schema:
                $ref: '#/components/schemas/Intelidentityenvelope'
          description: Exactly one identity matched.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: |
            Missing or invalid filters, unsupported filter field or operator, composite and or filter
            combination, or opaqueIdentifier lookup when non-human machine resolution is disabled for
            the tenant.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getIdentityIntelligenceV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Unauthorized access
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelIdentityNotFoundBody'
          description: No identity matched the filter (detailCode IDC_IDENTITY_NOT_FOUND).
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intelidentityambiguousbody'
          description: |
            Multiple identities matched the filter (detailCode IDC_IDENTITY_AMBIGUOUS), including
            human email or id multi-hit, human and machine id eq clash, and non-human opaque resolution
            ambiguity. Response includes candidates with id and displayName for refinement.
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getIdentityIntelligenceV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: |
            Upstream or internal failure. Identity resolution may pass an
            upstream non-2xx through; enrichment-slice failures are sanitized to a generic HTTP 500.
      security:
      - userAuth:
        - sp:identity-sec-intel:read
      - applicationAuth:
        - sp:identity-sec-intel:read
      summary: Get identity by filter
      tags:
      - Intelligence
      x-required-right: sp:identity-sec-intel:read
      x-sailpoint-userLevels:
      - Any
  /intelligence/v1/identities/{id}/accounts:
    get:
      description: |
        Continuation endpoint for a Human identity's `accounts.next` link.
        Returns one page of account rows for the supplied limit and offset values.
        Pass `count=true` to receive `X-Total-Count` (including `0` on empty pages).
        Not applicable to non-human identities (NHI accounts are returned on the NHI aggregate only).
        Requires tenant license idn:response-and-remediation.
      operationId: getIntelIdentityAccountsV1
      parameters:
      - description: Non-empty identity id path segment for Intelligence sub-resources.
        example: ef38f94347e94562b5bb8424a56397d8
        explode: false
        in: path
        name: id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          type: string
        style: simple
        x-sailpoint-resource-operation-id: listIdentitiesV1
      - description: Page size. Defaults to 250; values above 250 are rejected with
          400.
        example: 250
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 250
          format: int32
          maximum: 250
          minimum: 1
          type: integer
        style: form
      - description: Zero-based page offset. Defaults to 0.
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: |-
          If *true* it will populate the *X-Total-Count* response header with the number of results that would be returned if *limit* and *offset* were ignored.

          Since requesting a total count can have a performance impact, it is recommended not to send **count=true** if that value will not be used.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: true
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 2c91808874ff91550175097daaec161c
                name: example.user
                source:
                  id: 60de165099e649cb828553a5e8510fc4
                  name: Example Directory
                disabled: false
                locked: false
                authoritative: false
                systemAccount: false
                isMachine: false
                manuallyCorrelated: false
                nativeIdentity: "CN=example.user,OU=users"
                created: 2026-01-01T00:00:00Z
                modified: 2026-05-01T00:00:00Z
              schema:
                items:
                  $ref: '#/components/schemas/IntelAccessAccountWire'
                type: array
          description: One page of accounts.
          headers:
            X-Total-Count:
              description: Total number of accounts for this identity; present only
                when `count=true` was sent (including `0` on empty pages).
              explode: false
              schema:
                minimum: 0
                type: integer
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Invalid path or query parameters.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getIdentityIntelligenceV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Unauthorized access
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getIdentityIntelligenceV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal or upstream server failure.
      security:
      - userAuth:
        - sp:identity-sec-intel:read
      - applicationAuth:
        - sp:identity-sec-intel:read
      summary: List identity accounts
      tags:
      - Intelligence
      x-required-right: sp:identity-sec-intel:read
      x-sailpoint-userLevels:
      - Any
  /intelligence/v1/identities/{id}/outliers/rare-access:
