      description: Get the human account subtypes of a source.
      operationId: listHumanAccountSubtypesV2
      parameters:
      - description: ID of the source.
        example: 6d0458373bec4b4b80460992b76016da
        explode: false
        in: path
        name: sourceId
        required: true
        schema:
          type: string
        style: simple
        x-sailpoint-resource-operation-id: listSourcesV1
      - description: |-
          If *true* it will populate the *X-Total-Count* response header with the number of results that would be returned if *limit* and *offset* were ignored.

          Since requesting a total count can have a performance impact, it is recommended not to send **count=true** if that value will not be used.

          See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters) for more information.
        example: true
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: |-
          Max number of results to return.
          See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters) for more information.
        example: 250
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 250
          format: int32
          maximum: 250
          minimum: 0
          type: integer
        style: form
      - description: |-
          Offset into the full result set. Usually specified with *limit* to paginate through the results.
          See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters) for more information.
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: |-
          Sort results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)

          Sorting is supported for the following fields: **sourceId**
        example: sourceId
        explode: true
        in: query
        name: sorters
        required: false
        schema:
          default: ""
          format: comma-separated
          type: string
        style: form
      - description: Use this header to enable this experimental API.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              examples:
                HumanAccountSubtype:
                  value:
                  - id: 38453251-6be2-5f8f-df93-5ce19e295838
                    sourceId: 6d0458373bec4b4b80460992b76016da
                    technicalName: contractor
                    displayName: Contractor
                    description: Contractors with a limited account lifecycle
                    entityType: ACCOUNT
                    default: false
                    systemManaged: false
                    created: 2026-11-20T10:15:30.123Z
                    modified: 2026-11-20T10:15:30.123Z
              schema:
                items:
                  $ref: '#/components/schemas/HumanAccountSubtype'
                type: array
          description: List of human account subtypes of the source.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listHumanAccountSubtypesV2_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
