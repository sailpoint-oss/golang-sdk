          enum:
          - SOD_POLICY
          example: SOD_POLICY
          type: string
        id:
          description: SOD policy ID.
          example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
          type: string
        name:
          description: SOD policy display name.
          example: Business SOD Policy
          type: string
      type: object
    DtoType:
      description: An enumeration of the types of DTOs supported within the IdentityNow
        infrastructure.
      enum:
      - ACCOUNT_CORRELATION_CONFIG
      - ACCESS_PROFILE
      - ACCESS_REQUEST_APPROVAL
      - ACCOUNT
      - APPLICATION
      - CAMPAIGN
      - CAMPAIGN_FILTER
      - CERTIFICATION
      - CLUSTER
      - CONNECTOR_SCHEMA
      - ENTITLEMENT
      - GOVERNANCE_GROUP
      - IDENTITY
      - IDENTITY_PROFILE
      - IDENTITY_REQUEST
      - MACHINE_IDENTITY
      - LIFECYCLE_STATE
      - PASSWORD_POLICY
      - ROLE
      - RULE
      - SOD_POLICY
      - SOURCE
      - TAG
      - TAG_CATEGORY
      - TASK_RESULT
      - REPORT_RESULT
      - SOD_VIOLATION
      - ACCOUNT_ACTIVITY
      - WORKGROUP
      example: IDENTITY
      type: string
    ExceptionCriteriaAccess:
      description: Access reference with addition of boolean existing flag to indicate
        whether the access was extant
      properties:
        type:
          $ref: '#/components/schemas/DtoType'
        id:
          description: ID of the object to which this reference applies
          example: 2c91808568c529c60168cca6f90c1313
          type: string
        name:
          description: Human-readable display name of the object to which this reference
            applies
          example: "CN=HelpDesk,OU=test,OU=test-service,DC=TestAD,DC=local"
          type: string
        existing:
          default: false
          description: Whether the subject identity already had that access or not
          example: true
          type: boolean
      type: object
    ExceptionCriteria:
      example:
        criteriaList:
        - type: ENTITLEMENT
          id: 2c9180866166b5b0016167c32ef31a66
          existing: true
        - type: ENTITLEMENT
          id: 2c9180866166b5b0016167c32ef31a67
          existing: false
      properties:
        criteriaList:
          description: List of exception criteria. There is a min of 1 and max of
            50 items in the list.
          example:
          - type: ENTITLEMENT
            id: 2c9180866166b5b0016167c32ef31a66
            existing: true
          - type: ENTITLEMENT
            id: 2c9180866166b5b0016167c32ef31a67
            existing: false
          items:
            $ref: '#/components/schemas/ExceptionCriteria_criteriaList_inner'
          type: array
      type: object
