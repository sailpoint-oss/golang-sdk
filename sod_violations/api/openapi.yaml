            existing: true
          - type: ENTITLEMENT
            id: 2c9180866166b5b0016167c32ef31a67
            existing: false
      properties:
        leftCriteria:
          $ref: '#/components/schemas/ExceptionCriteria'
        rightCriteria:
          $ref: '#/components/schemas/ExceptionCriteria'
      type: object
    ViolationContext:
