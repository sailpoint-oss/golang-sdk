        violationContexts:
        - conflictingAccessCriteria:
            leftCriteria:
              criteriaList:
              - type: ENTITLEMENT
                id: 2c9180866166b5b0016167c32ef31a66
                existing: true
              - type: ENTITLEMENT
                id: 2c9180866166b5b0016167c32ef31a67
                existing: false
            rightCriteria:
              criteriaList:
              - type: ENTITLEMENT
                id: 2c9180866166b5b0016167c32ef31a66
                existing: true
              - type: ENTITLEMENT
                id: 2c9180866166b5b0016167c32ef31a67
                existing: false
          policy:
