          description: List of Violation Contexts
          items:
            $ref: '#/components/schemas/ViolationContext'
          type: array
      required:
      - requestId
      type: object
    LocaleOrigin:
      description: "An indicator of how the locale was selected. *DEFAULT* means the\
        \ locale is the system default. *REQUEST* means the locale was selected from\
        \ the request context (i.e., best match based on the *Accept-Language* header).\
        \ Additional values may be added in the future without notice."
      enum:
      - DEFAULT
      - REQUEST
      - null
      example: DEFAULT
      nullable: true
      type: string
    ErrorMessageDto:
      example:
        localeOrigin: DEFAULT
        text: The request was syntactically correct but its content is semantically
          invalid.
        locale: en-US
      properties:
        locale:
          description: "The locale for the message text, a BCP 47 language tag."
          example: en-US
          nullable: true
          type: string
        localeOrigin:
          $ref: '#/components/schemas/LocaleOrigin'
        text:
          description: Actual text of the error message in the indicated locale.
          example: The request was syntactically correct but its content is semantically
            invalid.
          type: string
      title: Error Message Dto
      type: object
    ErrorResponseDto:
      example:
        causes:
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        messages:
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        - localeOrigin: DEFAULT
          text: The request was syntactically correct but its content is semantically
            invalid.
          locale: en-US
        detailCode: 400.1 Bad Request Content
        trackingId: e7eab60924f64aa284175b9fa3309599
      properties:
        detailCode:
          description: Fine-grained error code providing more detail of the error.
          example: 400.1 Bad Request Content
          type: string
        trackingId:
          description: Unique tracking id for the error.
          example: e7eab60924f64aa284175b9fa3309599
          type: string
        messages:
          description: Generic localized reason for error
          items:
            $ref: '#/components/schemas/ErrorMessageDto'
          type: array
        causes:
          description: Plain-text descriptive reasons to provide additional detail
            to the text provided in the messages field
          items:
            $ref: '#/components/schemas/ErrorMessageDto'
          type: array
      title: Error Response Dto
      type: object
    SodViolationCheck:
      description: An object referencing an SOD violation check
      example:
        requestId: 089899f13a8f4da7824996191587bab9
        created: 2020-01-01T00:00:00Z
      properties:
        requestId:
          description: The id of the original request
          example: 089899f13a8f4da7824996191587bab9
          type: string
        created:
          description: The date-time when this request was created.
          example: 2020-01-01T00:00:00Z
          format: date-time
          readOnly: true
          type: string
      required:
      - requestId
      title: Sod Violation Check
      type: object
    Referenceresponse:
      description: |
        Response reference: required id and type; optional name when display metadata resolves (omitted if not).
        For request bodies use ReferenceInput (id and type only).
      example:
        name: John Doe
        id: 3e07886555ed43cfb83c85c58d2016e6
        type: IDENTITY
      properties:
        id:
          description: The unique identifier of the referenced object.
          example: 3e07886555ed43cfb83c85c58d2016e6
          type: string
        name:
          description: Optional display name when metadata resolves. Omitted when
            unknown or not resolvable.
          example: John Doe
          readOnly: true
          type: string
        type:
          description: The type of the referenced object.
          example: IDENTITY
          type: string
      required:
      - id
      - type
      type: object
    Conflictingitemsourceref:
      description: |
        Reference to the source system or object (for example the application backing an entitlement).
        On GET, when the conflicting item type is ENTITLEMENT, hydration may populate these fields from
        the entitlement service payload's `source` object.
      properties:
        id:
          description: Source resource identifier when known.
          example: 2c9180825a6c1adc015a71c9db2101a1
          type: string
        name:
          description: Display name of the source.
          example: Active Directory
          type: string
        type:
          description: Source type classification (for example application or connector
            type).
          example: DIRECT_CONNECT
          type: string
        description:
          description: Human-readable description of the source.
          example: Corporate Active Directory source.
          type: string
      type: object
    Conflictingitem:
      description: A single access item that contributes to a separation-of-duties
        conflict.
      properties:
        id:
          description: The unique identifier of the conflicting access item.
          example: 3e07886555ed43cfb83c85c58d2016e6
          type: string
        name:
          description: The display name of the conflicting access item.
          example: Administrator
          type: string
        type:
          description: The type of access object represented by the conflicting item.
          enum:
          - ENTITLEMENT
          - ACCESS_PROFILE
          - ROLE
          example: ENTITLEMENT
          type: string
        sourceRef:
          $ref: '#/components/schemas/Conflictingitemsourceref'
        description:
          description: Optional human-readable description of the conflicting item.
          example: Grants administrative access to the payroll application.
          type: string
      required:
      - id
      - type
      type: object
    AccessCriteria:
      description: A named set of conflicting access items that together define one
        side of a separation-of-duties conflict.
      properties:
        name:
          description: The name of the access criteria grouping.
          example: money-in
          type: string
