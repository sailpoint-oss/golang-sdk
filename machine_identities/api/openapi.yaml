    CorrelationRuleAction:
      description: The action applied when a correlation rule matches.
      example:
        payload:
          identityId: 2c9180858082150f0180893dbaf44201
        type: IDENTITY
      properties:
        type:
          description: The target owner type resolved by this action.
          enum:
          - IDENTITY
          - ACCOUNT
          - GOVERNANCE_GROUP
          example: IDENTITY
          type: string
        payload:
          additionalProperties: true
          description: Action-specific payload.
          example:
            identityId: 2c9180858082150f0180893dbaf44201
          type: object
      required:
      - type
      title: Correlation Rule Action
      type: object
    CorrelationCondition:
      description: A single condition expression within a correlation rule.
      example:
        transform: toUpper
        rightAttributeName: owner
        id: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
        operatorType: EQUALS
        leftAttributeName: manager
        ordinal: 0
      properties:
        id:
          description: System-generated unique ID of the condition.
          example: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
          format: uuid
          type: string
        leftAttributeName:
          description: The left-hand attribute name of the condition.
          example: manager
          type: string
        operatorType:
          description: The comparison operator applied between the left and right
            attributes.
          example: EQUALS
          type: string
        rightAttributeName:
          description: The right-hand attribute name. Use an empty string when there
            is no RHS attribute.
          example: owner
          type: string
        transform:
          description: Optional transform applied before comparison.
          example: toUpper
          nullable: true
          type: string
        ordinal:
          description: The position of this condition within the rule.
          example: 0
          format: int32
          type: integer
      required:
      - leftAttributeName
      - operatorType
      - ordinal
      - rightAttributeName
      title: Correlation Condition
      type: object
    CorrelationRule:
      description: A single correlation rule within an ownership correlation config.
      example:
        ruleAction:
          payload:
            identityId: 2c9180858082150f0180893dbaf44201
          type: IDENTITY
        ruleType: IDENTITY
        id: 9c1f0b6a-2f2e-4a2b-8b7c-1a2b3c4d5e6f
        priority: 1
        conditionExpressions:
        - transform: toUpper
          rightAttributeName: owner
          id: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
          operatorType: EQUALS
          leftAttributeName: manager
          ordinal: 0
        - transform: toUpper
          rightAttributeName: owner
          id: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
          operatorType: EQUALS
          leftAttributeName: manager
          ordinal: 0
        defaultRule: false
      properties:
        id:
          description: Omit for new rules (server mints a UUID). Send only when updating
            a rule that already exists on this config (merge on PATCH). Unknown ids
            are rejected.
          example: 9c1f0b6a-2f2e-4a2b-8b7c-1a2b3c4d5e6f
          format: uuid
          type: string
        priority:
          description: The evaluation priority of the rule. Lower values are evaluated
            first.
          example: 1
          format: int32
          type: integer
        defaultRule:
          description: Whether this rule is the default rule for the config.
          example: false
          type: boolean
        ruleType:
          description: "The rule subject type. When either ruleType or ruleAction.type\
            \ is GOVERNANCE_GROUP, both must be; ruleType GOVERNANCE_GROUP is allowed\
            \ only when the parent config type is OWNER_SECONDARY."
          enum:
          - IDENTITY
          - ACCOUNT
          - GOVERNANCE_GROUP
          example: IDENTITY
          type: string
        ruleAction:
          $ref: '#/components/schemas/CorrelationRuleAction'
        conditionExpressions:
          description: The conditions that must match for this rule to apply.
          items:
            $ref: '#/components/schemas/CorrelationCondition'
          type: array
      required:
      - conditionExpressions
      - defaultRule
      - priority
      - ruleAction
      - ruleType
      title: Correlation Rule
      type: object
    CorrelationConfig:
      description: An ownership correlation config scoped to a source resource. Configs
