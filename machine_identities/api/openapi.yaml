            \ day before the current UTC date."
          example: 2026-06-25
          format: date
          type: string
        days:
          description: "One entry for each calendar day in the window, in ascending\
            \ order."
          items:
            $ref: '#/components/schemas/MachineIdentityDailyCountsDay'
          type: array
      title: Machine Identity Daily Counts
      type: object
    MachineIdentityOwnersV2:
      description: Owner configuration for a machine identity. A single primary (human
        IDENTITY) owner plus additional owners that are either up to ten human (IDENTITY)
        references or exactly one GOVERNANCE_GROUP reference - not both.
      example:
        secondary:
        - id: 2c9180858082150f0180893dbaf44202
          name: Jane Doe
          type: IDENTITY
        primary:
          name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
      properties:
        primary:
          $ref: '#/components/schemas/MachineIdentityOwnersV2_primary'
        secondary:
          description: Additional owners. Entries are either up to ten human (IDENTITY)
            references or exactly one GOVERNANCE_GROUP reference - not both. Governance-group
            owners appear here with type GOVERNANCE_GROUP.
          example:
          - id: 2c9180858082150f0180893dbaf44202
            name: Jane Doe
            type: IDENTITY
          items:
            $ref: '#/components/schemas/BaseReferenceDto'
          maxItems: 10
          type: array
      title: Machine Identity Owners V2
      type: object
    ResourceV2:
      description: The source resource a machine identity is derived from.
      example:
        features:
        - PROVISIONING
        - AUTHENTICATION
        name: nightly-batch-role
        id: 8886e5e3-63d0-462f-a195-d98da885b8dc
        type: aws:iam-role
      properties:
        id:
          description: The source resource identifier.
          example: 8886e5e3-63d0-462f-a195-d98da885b8dc
          type: string
        type:
          description: The type of the source resource.
          example: aws:iam-role
          type: string
        name:
          description: The display name of the source resource.
          example: nightly-batch-role
          type: string
        features:
          description: The set of features supported by the source resource.
          example:
          - PROVISIONING
          - AUTHENTICATION
          items:
            type: string
          type: array
      title: Resource V2
      type: object
    UserEntitlementV2:
      description: A user entitlement associated to a machine identity.
      example:
        sourceId: 5898b7c1-620c-49c6-cccc-cbf81eb4bddd
        displayName: Entitlement Name
        entitlementId: 6d28b7c1-620c-49c6-b6d5-cbf81eb4b5fa
        source:
          name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
      properties:
        sourceId:
          description: The source ID of the entitlement.
          example: 5898b7c1-620c-49c6-cccc-cbf81eb4bddd
          type: string
        entitlementId:
          description: The ID of the entitlement.
          example: 6d28b7c1-620c-49c6-b6d5-cbf81eb4b5fa
          type: string
        displayName:
          description: The display name of the entitlement.
          example: Entitlement Name
          type: string
        source:
          $ref: '#/components/schemas/UserEntitlementV2_source'
      title: User Entitlement V2
      type: object
    SanctionedStatus:
      description: |-
        Sanctioned status for a Business Application or the derived effective status on a machine identity.
        Values are case-sensitive.
      enum:
      - SANCTIONED
      - UNSANCTIONED
      - UNKNOWN
      example: SANCTIONED
      title: Sanctioned Status
      type: string
    CorrelationType:
      description: |-
        Whether the Business Application reference was manually assigned or automatically correlated.
        On write (create/patch), omit or send `MANUAL` (default). `AUTOMATIC` is rejected with `400 Bad Request`.
      enum:
      - MANUAL
      - AUTOMATIC
      example: MANUAL
      title: Correlation Type
      type: string
    BusinessApplicationRef:
      description: |-
        Reference to a Business Application associated with a machine identity.
        Available when Business Applications is enabled for the tenant.
        At most one Business Application reference is supported per machine identity on create and patch.
      example:
        name: Cursor
        correlationType: MANUAL
        id: 2ee5e239-e68c-4d69-93fb-6c7ce4576190
        type: BUSINESS_APPLICATION
        sanctionedStatus: SANCTIONED
      properties:
        type:
          description: Reference type. Must be `BUSINESS_APPLICATION`.
          enum:
          - BUSINESS_APPLICATION
          example: BUSINESS_APPLICATION
          type: string
        id:
          description: Existing Business Application id in the tenant.
          example: 2ee5e239-e68c-4d69-93fb-6c7ce4576190
          format: uuid
          type: string
        name:
          description: |-
            Business Application display name.
            Ignored on write; responses are enriched from the Business Application.
          example: Cursor
          nullable: true
          type: string
        sanctionedStatus:
          allOf:
          - $ref: '#/components/schemas/SanctionedStatus'
          description: |-
            Sanctioned status of the linked Business Application.
            Ignored on write; responses are enriched from the Business Application.
          example: SANCTIONED
          readOnly: true
        correlationType:
          allOf:
          - $ref: '#/components/schemas/CorrelationType'
          description: |-
            Correlation type for this reference.
            On write: omit or `MANUAL` (default). `AUTOMATIC` is rejected (`400`).
            On response: may be `MANUAL` or `AUTOMATIC`.
          example: MANUAL
      required:
      - id
      - type
      title: Business Application Ref
      type: object
    Machineidentityv2:
      allOf:
      - $ref: '#/components/schemas/BaseCommonDto'
      - properties:
          description:
            description: Description of the machine identity.
            example: Service account for nightly batch jobs
            type: string
          attributes:
            additionalProperties: true
            description: A map of custom machine identity attributes.
            example:
              privilegeLevel: HIGH
              region: APAC
            type: object
          connectorAttributes:
            additionalProperties: true
            description: A map of attributes sourced from the connector during aggregation.
            example:
              objectguid: abc-123
            type: object
          manuallyEdited:
            default: false
            description: Indicates if the machine identity has been manually edited.
            example: true
            type: boolean
          manuallyCreated:
            default: false
            description: Indicates if the machine identity has been manually created.
            example: true
            type: boolean
          owners:
            $ref: '#/components/schemas/MachineIdentityOwnersV2'
          subtype:
            description: The subtype value associated to the machine identity.
            example: AI_AGENT
            type: string
          sourceId:
            description: The source id associated to the machine identity.
            example: 6d28b7c1-620c-49c6-b6d5-cbf81eb4b5fa
            type: string
          uuid:
            description: The UUID associated to the machine identity directly aggregated
              from a source.
            example: f5dd23fe-3414-42b7-bb1c-869400ad7a10
            type: string
          nativeIdentity:
            description: The native identity associated to the machine identity directly
              aggregated from a source.
            example: abc:123:dddd
            type: string
          datasetId:
            description: The dataset id associated to the source from which the identity
              was retrieved.
            example: 8886e5e3-63d0-462f-a195-d98da885b8dc
            type: string
          environment:
            description: The environment the machine identity belongs to.
            example: PRODUCTION
            type: string
          existsOnSource:
            description: Indicates whether the machine identity still exists on the
              source.
            example: "TRUE"
            type: string
          status:
            description: Operational status read from stored attributes.status; null
              when absent.
            example: ACTIVE
            nullable: true
            type: string
          resource:
            $ref: '#/components/schemas/ResourceV2'
          source:
            $ref: '#/components/schemas/Machine_Identity_V2_source'
          userEntitlements:
            description: The user entitlements associated to the machine identity.
            items:
              $ref: '#/components/schemas/UserEntitlementV2'
            type: array
          businessApplicationRefs:
            description: |-
              Optional Business Application references associated with this machine identity.
              Available when Business Applications is enabled for the tenant.
              On create and patch, at most one reference is allowed and is persisted as a `MANUAL` correlation.
              When Business Applications is not enabled, this field is null on responses and is rejected (`400`) if supplied on write.
            items:
              $ref: '#/components/schemas/BusinessApplicationRef'
            maxItems: 1
            nullable: true
            type: array
          effectiveSanctionedStatus:
            allOf:
            - $ref: '#/components/schemas/SanctionedStatus'
            description: |-
              Derived sanctioned status from linked Business Applications; `UNKNOWN` when no refs are present.
              Available when Business Applications is enabled for the tenant; null when it is not enabled.
              Read-only on create and patch input.
            example: SANCTIONED
            nullable: true
            readOnly: true
          risk:
            $ref: '#/components/schemas/Machine_Identity_V2_risk'
          entroId:
            description: Entro back-reference. Present when Entro enrichment is enabled
              for the tenant. Null means the identity is not Entro-correlated. Read-only;
              written only by aggregation. Not returned on older machine-identity
              versions.
            example: 117923dfeaaf4a1ab09b6252ea369e44
            nullable: true
            readOnly: true
            type: string
          insights:
            description: "Entro insights. Null means not Entro-correlated; an empty\
              \ array means enriched with no insights. Read-only; written only by\
              \ aggregation. Filter matches a whole element, not a substring."
            example:
            - Sanctioned Service Access
            items:
              type: string
            nullable: true
            readOnly: true
            type: array
          sessionCount:
            description: Entro session count. Null means not Entro-correlated and
              is not the same as 0. Read-only; written only by aggregation.
            example: 152
            format: int32
            nullable: true
            readOnly: true
            type: integer
          suspiciousSessionCount:
            description: Entro suspicious session count. Null means not Entro-correlated
              and is not the same as 0. Read-only; written only by aggregation.
            example: 22
            format: int32
            nullable: true
            readOnly: true
            type: integer
        title: Machine Identity V2
        type: object
      example:
        sourceId: 6d28b7c1-620c-49c6-b6d5-cbf81eb4b5fa
        entroId: 117923dfeaaf4a1ab09b6252ea369e44
        description: Service account for nightly batch jobs
        owners:
          secondary:
          - id: 2c9180858082150f0180893dbaf44202
            name: Jane Doe
            type: IDENTITY
          primary:
            name: William Wilson
            id: 2c91808568c529c60168cca6f90c1313
            type: IDENTITY
        source:
          name: William Wilson
          id: 2c91808568c529c60168cca6f90c1313
          type: IDENTITY
        uuid: f5dd23fe-3414-42b7-bb1c-869400ad7a10
