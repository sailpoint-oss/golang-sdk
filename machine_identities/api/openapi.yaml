            $ref: '#/components/schemas/CorrelationRule'
          type: array
        created:
          description: Creation date of the config.
          example: 2015-05-28T14:07:17Z
          format: date-time
          readOnly: true
          type: string
        modified:
          description: Last modification date of the config.
          example: 2015-05-28T14:07:17Z
          format: date-time
          readOnly: true
          type: string
      required:
