            type: IDENTITY
          ruleType: IDENTITY
          id: 9c1f0b6a-2f2e-4a2b-8b7c-1a2b3c4d5e6f
          priority: 1
          conditionExpressions:
          - transform: toUpper
            rightAttributeName: owner
            id: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
            operatorType: EQUALS
            leftAttributeName: manager
            ordinal: 0
          - transform: toUpper
            rightAttributeName: owner
            id: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
            operatorType: EQUALS
            leftAttributeName: manager
            ordinal: 0
          defaultRule: false
        - ruleAction:
            payload:
              identityId: 2c9180858082150f0180893dbaf44201
            type: IDENTITY
          ruleType: IDENTITY
          id: 9c1f0b6a-2f2e-4a2b-8b7c-1a2b3c4d5e6f
          priority: 1
          conditionExpressions:
          - transform: toUpper
            rightAttributeName: owner
            id: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
            operatorType: EQUALS
            leftAttributeName: manager
            ordinal: 0
          - transform: toUpper
            rightAttributeName: owner
            id: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
            operatorType: EQUALS
            leftAttributeName: manager
            ordinal: 0
          defaultRule: false
        id: f5dd23fe-3414-42b7-bb1c-869400ad7a10
        type: OWNER_PRIMARY
      properties:
        id:
          description: System-generated unique ID of the correlation config.
          example: f5dd23fe-3414-42b7-bb1c-869400ad7a10
          format: uuid
          type: string
        sourceId:
          description: The source ID this config belongs to.
          example: 2c9180835d191a86015d28455b4a2329
          type: string
        resourceId:
          description: The source resource identifier for this config scope.
          example: aws:iam-role
          type: string
        type:
          description: The correlation config type.
          enum:
          - OWNER_PRIMARY
          - OWNER_SECONDARY
          example: OWNER_PRIMARY
          type: string
        attributes:
