openapi: 3.0.1
info:
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  description: "Use these APIs to submit, list, retrieve, and cancel machine identity\
    \ lifecycle actions (currently activate and deactivate for Agent machine identities\
    \ only). We encourage you to join the SailPoint Developer Community forum at https://developer.sailpoint.com/discuss\
    \ to connect with other developers using our APIs."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://developer.sailpoint.com/discuss/tos
  title: SailPoint Identity Security API - Machine Identity Lifecycle Actions
  version: v1
servers:
- description: This is the production API server.
  url: "https://{tenant}.api.identitynow.com"
  variables:
    tenant:
      default: sailpoint
      description: "This is the name of your tenant, typically your company's name."
- description: This is the versioned API server.
  url: "https://{apiUrl}"
  variables:
    apiUrl:
      default: sailpoint.api.identitynow.com
      description: This is the api url of your tenant
security:
- userAuth:
  - sp:scopes:all
tags:
- description: |
    Use this API to implement machine identity lifecycle action functionality.
    With this functionality in place, administrators and machine identity owners can activate or deactivate machine identities, track the approval and provisioning status of each request, and cancel requests before provisioning starts.

    A lifecycle action is a request to change whether a machine identity is active.
    For example, an administrator may deactivate an agent while a security review is in progress, and then activate it again once the review is complete.

    Lifecycle actions are currently supported only for machine identities of type Agent.
  name: Machine Identity Lifecycle Actions
paths:
  /machine-identities/v1/{id}/lifecycle-actions:
    post:
      description: |
        Submits a request to activate or deactivate a machine identity. Supported actions are `ACTIVATE`
        and `DEACTIVATE`.

        **Note:** Lifecycle actions are currently supported only for machine identities of type **Agent**.

        The response includes a `requestId`. Use it to
        [get the request](https://developer.sailpoint.com/docs/api/get-machine-identity-lifecycle-action-v-1) or
        [cancel it](https://developer.sailpoint.com/docs/api/cancel-machine-identity-lifecycle-action-v-1).
        To see all the requests you've submitted, use
        [list machine identity lifecycle actions](https://developer.sailpoint.com/docs/api/list-machine-identity-lifecycle-actions-v-1).

        Only one lifecycle action can be in progress for a machine identity at a time. If another action is
        already in progress for the machine identity, the request is rejected.

        To submit a lifecycle action, you need the `idn:machine-identity:lifecycle-action` right, or admin or
        owner access to the machine identity. Admin or owner access means you're an org admin, a source admin,
        a source sub-admin for the machine identity's source, or the machine identity's owner.
      operationId: submitMachineIdentityLifecycleActionV1
      parameters:
      - description: Machine identity ID.
        example: 1c9c8e1f-2f5f-4f77-9f7e-5d37e4fb3ef0
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
        x-sailpoint-resource-operation-id: listMachineIdentitiesV1
      - description: Use this header to enable this experimental API.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              Deactivate machine identity:
                value:
                  action: DEACTIVATE
                  comments:
                  - comment: Suspending agent until security review completes
            schema:
              $ref: '#/components/schemas/LifecycleActionSubmitRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleActionSubmitResponse'
          description: Accepted. The lifecycle request was created.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  summary: An example of a 404 response object
                  value:
                    detailCode: 404 Not found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server did not find a current representation for the
                        target resource.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - returned if the request URL refers to a resource
            or object that does not exist
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:mis-identity:manage
      summary: Submit machine identity lifecycle action
      tags:
      - Machine Identity Lifecycle Actions
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - SOURCE_ADMIN
      - SOURCE_SUBADMIN
      - USER
  /machine-identities/v1/lifecycle-actions:
    get:
      description: |
        Returns the lifecycle action requests that you submitted. Requests that other users submitted
        aren't included, even if you're an admin. If the call isn't made on behalf of an identity, the list
        is empty.

        When `limit` is omitted, up to 50 results are returned.
      operationId: listMachineIdentityLifecycleActionsV1
      parameters:
      - description: |-
          Filter results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)

          Filtering is supported for the following fields and operators:

          **resourceType**: *eq, in*

          **operationType**: *eq, in*

          **status**: *eq, in*

          **completed**: *eq*

          **targetId**: *eq*

          **targetName**: *eq, sw*

          **sourceId**: *eq*

          **created**: *gt, ge, lt, le*

          The `resourceType` filter matches the `targetType` field in the response.
        example: "status in (\"RECEIVED\",\"COMPLETED\")"
        explode: true
        in: query
        name: filters
        required: false
        schema:
          type: string
        style: form
        x-sailpoint-lint-ignore:
          schema-optional-properties-must-have-default: "There is no default filter.\
            \ When filters is omitted, results aren't filtered."
      - description: |-
          Sort results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)

          Sorting is supported for the following fields: **created, modified, status**

          Default sort is **-created** (newest first).
        example: -created
        explode: true
        in: query
        name: sorters
        required: false
        schema:
          default: -created
          format: comma-separated
          type: string
        style: form
      - description: |-
          Max number of results to return. When omitted, the default limit is 50. The maximum allowed limit is 250.

          See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters) for more information.
        example: 50
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 250
          minimum: 0
          type: integer
        style: form
      - description: |-
          Offset into the full result set. Usually specified with *limit* to paginate through the results.
          See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters) for more information.
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: |-
          If *true* it will populate the *X-Total-Count* response header with the number of results that would be returned if *limit* and *offset* were ignored.

          Since requesting a total count can have a performance impact, it is recommended not to send **count=true** if that value will not be used.

          See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters) for more information.
        example: true
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Use this header to enable this experimental API.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LifecycleActionRequest'
                type: array
          description: Lifecycle action requests that you submitted.
          headers:
            X-Total-Count:
              description: The total result count (returned when count=true is passed).
              explode: false
              schema:
                format: int32
                type: integer
              style: simple
              x-sailpoint-lint-ignore:
                path-response-headers-must-be-lowercase-kebab-case: X-Total-Count
                  is the standard header name used across SailPoint APIs. HTTP header
                  names aren't case-sensitive.
            Cache-Control:
              description: How long the client can cache the response.
              explode: false
              schema:
                example: "private, max-age=5"
                type: string
              style: simple
              x-sailpoint-lint-ignore:
                path-response-headers-must-be-lowercase-kebab-case: Cache-Control
                  is a standard HTTP header. HTTP header names aren't case-sensitive.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - sp:scopes:all
      summary: List machine identity lifecycle actions
      tags:
      - Machine Identity Lifecycle Actions
      x-sailpoint-lint-ignore:
        path-list-operations-must-return-object: The list response is already released
          as a top-level array. Wrapping it in an object would break existing callers.
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - SOURCE_ADMIN
      - SOURCE_SUBADMIN
      - USER
  /machine-identities/v1/lifecycle-actions/{requestId}:
    get:
      description: |
        Returns a single lifecycle action request, including its current status, approval details, and
        provisioning progress. Use it to follow a request after you submit or cancel it.

        You can always view requests that you submitted. To view a request that someone else submitted, you
        need the `idn:machine-identity:lifecycle-action` right **and** admin or owner access to the machine
        identity. Admin or owner access means you're an org admin, a source admin, a source sub-admin for the
        machine identity's source, or the machine identity's owner.
      operationId: getMachineIdentityLifecycleActionV1
      parameters:
      - description: Lifecycle request identifier.
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        explode: false
        in: path
        name: requestId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
        x-sailpoint-resource-operation-id: listMachineIdentityLifecycleActionsV1
      - description: Use this header to enable this experimental API.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleActionRequest'
          description: The lifecycle action request.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  summary: An example of a 404 response object
                  value:
                    detailCode: 404 Not found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server did not find a current representation for the
                        target resource.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - returned if the request URL refers to a resource
            or object that does not exist
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:mis-identity:manage
      summary: Get machine identity lifecycle action
      tags:
      - Machine Identity Lifecycle Actions
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - SOURCE_ADMIN
      - SOURCE_SUBADMIN
      - USER
  /machine-identities/v1/lifecycle-actions/{requestId}/cancel:
    post:
      description: |
        Cancels a lifecycle action request that hasn't started provisioning yet. When the cancel is
        accepted, the request moves to `CANCELING` status.

        A request can't be canceled once provisioning has started, after it has finished, or while a cancel
        is already in progress.

        The request body is optional. Use it to add a comment explaining why the request was canceled.

        You can always cancel requests that you submitted. To cancel a request that someone else submitted,
        you need the `idn:machine-identity:lifecycle-action` right **and** admin or owner access to the
        machine identity. Admin or owner access means you're an org admin, a source admin, a source sub-admin
        for the machine identity's source, or the machine identity's owner.

        If the cancel can't be completed, the API returns an error and the request stays in `CANCELING`
        status.
      operationId: cancelMachineIdentityLifecycleActionV1
      parameters:
      - description: Lifecycle request identifier.
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        explode: false
        in: path
        name: requestId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
        x-sailpoint-resource-operation-id: listMachineIdentityLifecycleActionsV1
      - description: Use this header to enable this experimental API.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              Cancel with comment:
                value:
                  comment: Cancelling - will resubmit after maintenance window
            schema:
              $ref: '#/components/schemas/CancelLifecycleActionRequest'
        required: false
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelLifecycleActionResponse'
          description: Accepted. The lifecycle request cancel was accepted.
        "400":
          content:
            application/json:
              schema:
