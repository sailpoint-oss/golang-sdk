  schemas:
    Lifecycleaction:
      description: Lifecycle action requested against a machine identity.
      enum:
      - DEACTIVATE
      - ACTIVATE
      example: DEACTIVATE
      type: string
    LifecycleActionSubmitComment:
      example:
        comment: Suspending agent until security review completes
      properties:
        comment:
          description: Free-text comment submitted with the lifecycle action request.
          example: Suspending agent until security review completes
          maxLength: 1000
          type: string
      required:
