openapi: 3.0.1
info:
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  description: "Use these APIs to submit, list, retrieve, and cancel machine identity\
    \ lifecycle actions (for example agent activate and deactivate). We encourage\
    \ you to join the SailPoint Developer Community forum at https://developer.sailpoint.com/discuss\
    \ to connect with other developers using our APIs."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://developer.sailpoint.com/discuss/tos
  title: Identity Security Cloud API - Machine Identity Lifecycle Actions
  version: v1
servers:
- description: This is the production API server.
  url: "https://{tenant}.api.identitynow.com"
  variables:
    tenant:
      default: sailpoint
      description: "This is the name of your tenant, typically your company's name."
- description: This is the versioned API server.
  url: "https://{apiUrl}"
  variables:
    apiUrl:
      default: sailpoint.api.identitynow.com
      description: This is the api url of your tenant
security:
- userAuth:
  - sp:scopes:all
tags:
- description: |
    Experimental APIs for machine identity lifecycle requests (`ACTIVATE`, `DEACTIVATE`), including
    approval and provisioning status. Pass the `X-SailPoint-Experimental` header on every request.

    Read and cancel by `requestId` return **403** for authorization denials
    (`FORBIDDEN.lifecycle-request-access-denied`) and non-`AI_AGENT` rows
    (`FORBIDDEN.unsupported-type`). Unknown ids and target-type mismatches return **404**
    (`NOT_FOUND.detailed`).
  name: Machine Identity Lifecycle Actions
paths:
  /machine-identities/v1/{id}/lifecycle-actions:
    post:
      description: |
        Creates a lifecycle request for the target machine identity and returns the created lifecycle
        snapshot.

        The response includes the generated `requestId`, which is used by
        https://developer.sailpoint.com/docs/api/list-machine-identity-lifecycle-actions-v-1,
        https://developer.sailpoint.com/docs/api/get-machine-identity-lifecycle-action-v-1, and
        https://developer.sailpoint.com/docs/api/cancel-machine-identity-lifecycle-action-v-1

        Authorization is enforced in the service layer. Callers must have the
        `idn:machine-identity-lifecycle-action:manage` scope or role-context access to the target machine
        identity (organization admin, source admin, scoped source sub-admin, or effective owner).

        Supported actions are `DEACTIVATE`, `ACTIVATE`.
      operationId: submitMachineIdentityLifecycleActionV1
      parameters:
      - description: Machine identity ID.
        example: 1c9c8e1f-2f5f-4f77-9f7e-5d37e4fb3ef0
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
        x-sailpoint-resource-operation-id: listMachineIdentitiesV1
      - description: Use this header to enable this experimental API.
        example: true
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              Deactivate machine identity:
                value:
                  action: DEACTIVATE
                  comments:
                  - comment: Suspending agent until security review completes
            schema:
              $ref: '#/components/schemas/LifecycleActionSubmitRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleActionSubmitResponse'
          description: Accepted. The lifecycle request was created.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  summary: An example of a 404 response object
                  value:
                    detailCode: 404 Not found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server did not find a current representation for the
                        target resource.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - returned if the request URL refers to a resource
            or object that does not exist
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:mis-identity:manage
      summary: Submit machine identity lifecycle action
      tags:
      - Machine Identity Lifecycle Actions
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - SOURCE_ADMIN
      - SOURCE_SUBADMIN
      - USER
  /machine-identities/v1/lifecycle-actions:
    get:
      description: |
        Lists lifecycle requests visible to the requester identity in the current request context.

        Results are automatically scoped to the calling identity. If requester identity context is
        missing, an empty list is returned.

        When `limit` is omitted, this endpoint applies a default limit of 50.
      operationId: listMachineIdentityLifecycleActionsV1
      parameters:
      - description: |-
          Filter results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)

          Filtering is supported for the following fields and operators:

          **resourceType**: *eq, in*

          **operationType**: *eq, in*

          **status**: *eq, in*

          **completed**: *eq*

          **targetId**: *eq*

          **targetName**: *eq, sw*

          **sourceId**: *eq*

          **created**: *gt, ge, lt, le*
        example: "status in (\"RECEIVED\",\"COMPLETED\")"
        explode: true
        in: query
        name: filters
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Sort results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)

          Sorting is supported for the following fields: **created, modified, status**

          Default sort is **-created** (newest first).
        example: -created
        explode: true
        in: query
        name: sorters
        required: false
        schema:
          format: comma-separated
          type: string
        style: form
      - description: |-
          Max number of results to return. When omitted, the default limit is 50. The maximum allowed limit is 250.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: 50
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 250
          minimum: 0
          type: integer
        style: form
      - description: |-
          Offset into the full result set. Usually specified with *limit* to paginate through the results.
          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: |-
          If *true* it will populate the *X-Total-Count* response header with the number of results that would be returned if *limit* and *offset* were ignored.

          Since requesting a total count can have a performance impact, it is recommended not to send **count=true** if that value will not be used.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: true
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Use this header to enable this experimental API.
        example: true
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LifecycleActionRequest'
                type: array
          description: List of lifecycle action requests for the requester.
          headers:
            X-Total-Count:
              description: The total result count (returned when count=true is passed).
              explode: false
              schema:
                format: int32
                type: integer
              style: simple
            Cache-Control:
              description: Response cache directive for requester-scoped polling.
              explode: false
              schema:
                example: "private, max-age=5"
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - sp:scopes:all
      summary: List lifecycle actions
      tags:
      - Machine Identity Lifecycle Actions
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - SOURCE_ADMIN
      - SOURCE_SUBADMIN
      - USER
  /machine-identities/v1/lifecycle-actions/{requestId}:
    get:
      description: |
        Returns one lifecycle request snapshot by `requestId`. Used for request-level inspection,
        including cancel acceptance and subsequent status changes.

        The original requester is always allowed to read their request. Otherwise, callers must have
        the `idn:machine-identity-lifecycle-action:manage` scope **and** role-context access to the target
        machine identity (organization admin, source admin, scoped source sub-admin, or effective owner).

        **403 Forbidden**

        - `FORBIDDEN.lifecycle-request-access-denied` - caller is not the submitter and lacks both the
          `idn:machine-identity-lifecycle-action:manage` scope and target role-context (response includes `requestId` as a parameter).
        - `FORBIDDEN.unsupported-type` - the persisted lifecycle row is not scoped to `AI_AGENT`
          (`targetType` on read-by-request-id paths).

        **404 Not Found**

        - `NOT_FOUND.detailed` - unknown `requestId`, or persisted `targetType` does not match the
          target machine identity's subtype-to-resource-type mapping.
      operationId: getMachineIdentityLifecycleActionV1
      parameters:
      - description: Lifecycle request identifier.
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        explode: false
        in: path
        name: requestId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
        x-sailpoint-resource-operation-id: listMachineIdentityLifecycleActionsV1
      - description: Use this header to enable this experimental API.
        example: true
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleActionRequest'
          description: Lifecycle action request snapshot.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  summary: An example of a 404 response object
                  value:
                    detailCode: 404 Not found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server did not find a current representation for the
                        target resource.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - returned if the request URL refers to a resource
            or object that does not exist
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:mis-identity:manage
      summary: Get lifecycle action by requestId
      tags:
      - Machine Identity Lifecycle Actions
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - SOURCE_ADMIN
      - SOURCE_SUBADMIN
      - USER
  /machine-identities/v1/lifecycle-actions/{requestId}/cancel:
    post:
      description: |
        Attempts to cancel a lifecycle request before provisioning starts.

        The path `requestId` is authoritative for lookup and authorization. The request body is
        optional and may carry cancel metadata such as `comment`. Any `requestId` value in the body is
        ignored.

        Workflow cancel signaling is attempted before the request is persisted as `CANCELING`. If
        signaling fails, the service returns **503** (`DOWNSTREAM_SERVICE_UNAVAILABLE`, cause
        `workflow-signal-failed`) and the lifecycle request status is unchanged.

        Invalid cancel states are returned as **400** (`INVALID_REQUEST_IN_CURRENT_STATE` variants).

        Cancel authorization matches https://developer.sailpoint.com/docs/api/get-machine-identity-lifecycle-action-v-1:
        the original submitter is always allowed; otherwise callers must have the
        `idn:machine-identity-lifecycle-action:manage` scope **and** target role-context access.

        **403 Forbidden**

        - `FORBIDDEN.lifecycle-request-access-denied` - caller is not the submitter and lacks both the
          `idn:machine-identity-lifecycle-action:manage` scope and target role-context.
        - `FORBIDDEN.unsupported-type` - the persisted lifecycle row is not scoped to `AI_AGENT`.

        **404 Not Found**

        - `NOT_FOUND.detailed` - unknown `requestId`, or persisted `targetType`/target-identity subtype
          mismatch.
      operationId: cancelMachineIdentityLifecycleActionV1
      parameters:
      - description: Lifecycle request identifier.
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        explode: false
        in: path
        name: requestId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
        x-sailpoint-resource-operation-id: listMachineIdentityLifecycleActionsV1
      - description: Use this header to enable this experimental API.
        example: true
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              Cancel with comment:
                value:
                  comment: Cancelling - will resubmit after maintenance window
            schema:
              $ref: '#/components/schemas/CancelLifecycleActionRequest'
        required: false
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelLifecycleActionResponse'
          description: Accepted. The lifecycle request cancel was accepted.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  summary: An example of a 404 response object
                  value:
                    detailCode: 404 Not found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server did not find a current representation for the
                        target resource.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - returned if the request URL refers to a resource
            or object that does not exist
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitMachineIdentityLifecycleActionV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:mis-identity:manage
      summary: Cancel lifecycle action
      tags:
      - Machine Identity Lifecycle Actions
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - SOURCE_ADMIN
      - SOURCE_SUBADMIN
      - USER
