        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json-patch+json:
            examples:
              Add machine identity attribute:
                value:
                - op: add
                  path: /environment
                  value: test
              Replace machine identity attribute:
                value:
                - op: replace
                  path: /environment
                  value: test
              Remove machine identity attribute:
                value:
                - op: remove
                  path: /environment
            schema:
              items:
                type: object
              type: array
        description: |-
          A JSON of updated values [JSON Patch](https://tools.ietf.org/html/rfc6902) standard. The following fields are patchable:
                    * description
                    * environment
                    * accessType
                    * attributes
                    * manuallyEdited
                    * ownerIdentity
                    * subtype
                    * machineIdentity
                    * owners

          Non-dataset accounts may patch ownerIdentity, subtype, and machineIdentity. Dataset accounts may patch owners. When expanded ownership is enabled, non-dataset accounts may also patch owners, and dataset accounts may also patch ownerIdentity.
          `risk`, `permissionLevel`, `compliance`, and `lastUsedAt` are read-only. Do not patch them; aggregation is the only writer. A patch of other fields still succeeds when those values are present on the account.
        required: true
