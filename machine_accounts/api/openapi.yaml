      type: object
    MachineAccount:
      allOf:
      - $ref: '#/components/schemas/BaseCommonDto'
      - properties:
          description:
            description: A description of the machine account
            example: Service account for Active Directory
            nullable: true
            type: string
          nativeIdentity:
            description: The unique ID of the machine account generated by the source
              system
            example: "552775"
            type: string
          uuid:
            description: The unique ID of the account as determined by the account
              schema
            example: "{b0dce506-d6d4-44d2-8a32-d9a5b21fb175}"
            nullable: true
            type: string
          classificationMethod:
            description: Classification Method
            enum:
            - SOURCE
            - CRITERIA
            - DISCOVERY
            - MANUAL
            example: SOURCE
            type: string
          machineIdentity:
            description: The machine identity this account is associated with
            example:
              id: 1540e5a4-6c2e-4bf1-b88e-c08cae0696e9
              type: MACHINE_IDENTITY
              name: SVC_ADService
          ownerIdentity:
            description: The identity who owns this account.
            example:
              id: 2c918084660f45d6016617daa9210584
              type: IDENTITY
              name: Adam Kennedy
            nullable: true
          accessType:
            description: The connection type of the source this account is from
            example: direct
            type: string
          subtype:
            description: The sub-type
            nullable: true
            type: string
            example: null
          environment:
            description: Environment
            example: TEST
            nullable: true
            type: string
          attributes:
            additionalProperties: true
            description: Custom attributes specific to the machine account
            example:
              firstName: SailPoint
              lastName: Support
              displayName: SailPoint Support
            nullable: true
            type: object
          connectorAttributes:
            additionalProperties: true
            description: The connector attributes for the account
            example:
              mail: machine-178@sailpoint.com
              givenName: Support
              displayName: SailPoint Support
            nullable: true
            type: object
          manuallyCorrelated:
            default: false
            description: Indicates if the account has been manually correlated to
              an identity
            example: true
            type: boolean
          manuallyEdited:
            default: false
            description: Indicates if the account has been manually edited
            example: true
            type: boolean
          locked:
            description: Indicates if the account is currently locked
            example: false
            type: boolean
          enabled:
            default: false
            description: Indicates if the account is enabled
            example: false
            type: boolean
          hasEntitlements:
            default: true
            description: Indicates if the account has entitlements
            example: false
            type: boolean
          source:
            description: The source this machine account belongs to.
            example:
              id: 8d3e0094e99445de98eef6c75e25jc04
              type: SOURCE
              name: Active Directory
          risk:
            $ref: '#/components/schemas/MachineAccount_allOf_risk'
          permissionLevel:
            description: Entro permission level. Null when not enriched. Read-only;
              written only by aggregation.
            enum:
            - PRIVILEGED
            - ELEVATED
            - BASIC
            - UNKNOWN
            example: PRIVILEGED
            nullable: true
            readOnly: true
            type: string
          compliance:
            description: "Entro compliance control ids. Null when absent; empty when\
              \ Entro recorded no violations. A violations count is the length of\
              \ this array. There is no `complianceViolationsCount` field, and `compliance`\
              \ is not a list filter or sort field. Read-only; written only by aggregation."
