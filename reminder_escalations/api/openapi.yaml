openapi: 3.0.1
info:
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  description: "Use these APIs to interact with the SailPoint Identity Security platform\
    \ to achieve repeatable, automated processes with greater scalability. We encourage\
    \ you to join the SailPoint Developer Community forum at https://developer.sailpoint.com/discuss\
    \ to connect with other developers using our APIs."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://developer.sailpoint.com/discuss/tos
  title: SailPoint Identity Security API - Reminder Escalations
  version: v1
  x-audience: external-public
servers:
- description: This is the production API server.
  url: "https://{tenant}.api.identitynow.com"
  variables:
    tenant:
      default: sailpoint
      description: "This is the name of your tenant, typically your company's name."
- description: This is the versioned API server.
  url: "https://{apiUrl}"
  variables:
    apiUrl:
      default: sailpoint.api.identitynow.com
      description: This is the api url of your tenant
security:
- userAuth:
  - sp:scopes:all
tags:
- description: |
    Use this API to manage the tenant-default reminder and escalation ruleset for a domain object type.
    With this functionality in place, organization administrators can create, view, update, and delete the default rules applied when a reminder and escalation workflow is started without its own ruleset.
    The tenant is taken from the authenticated request. It is not part of the URL or request body.
  name: Reminder Escalations
paths:
  /reminder-escalations/v1/config/tenants:
    post:
      description: |-
        Creates the default reminder and escalation ruleset for a domain object type in the authenticated tenant.
        A tenant has one default per domain object type. Creating the same type again returns 409.
      operationId: createReminderEscalationTenantConfigV1
      parameters:
      - description: Use this header to enable this experimental API.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              certificationDefault:
                summary: Tenant default for certifications
                value:
                  domainObjectType: CERTIFICATION
                  rules:
                    reminders:
                    - cron: 0 9 * * 1
                      beforeDeadLine: P30D
                      template: cert-reminder-weekly
                    - cron: 0 9 * * *
                      beforeDeadLine: P7D
                      template: cert-reminder-daily
                    escalations:
                    - trigger:
                        triggerType: AFTER_REMINDER_COUNT
                        count: 3
                        delay: PT12H
                      targets:
                      - targetType: MANAGER_OF
                      template: cert-escalation-mgr
                    fallback:
                      targets:
                      - targetType: IDENTITY
                        identityId: id-admin-99
                      template: cert-escalation-fallback-admin
            schema:
              $ref: '#/components/schemas/Reminderescalationtenantconfigcreate'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminderescalationtenantconfig'
          description: Tenant default created.
          headers:
            location:
              description: URL of the created tenant default.
              example: /reminder-escalations/v1/config/tenants/CERTIFICATION
              explode: false
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createReminderEscalationTenantConfigV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Conflict - Indicates that the request could not be processed
            because of conflict in the current state of the resource.
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createReminderEscalationTenantConfigV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:reminder-escalation-config:manage
      summary: Create Reminder Escalation Tenant Config
      tags:
      - Reminder Escalations
      x-sailpoint-userLevels:
      - ORG_ADMIN
  /reminder-escalations/v1/config/tenants/{domainObjectType}:
    delete:
      description: Deletes the tenant-default ruleset for a domain object type in
        the authenticated tenant.
      operationId: deleteReminderEscalationTenantConfigV1
      parameters:
      - description: Domain object type key.
        example: CERTIFICATION
        explode: false
        in: path
        name: domainObjectType
        required: true
        schema:
          enum:
          - PERSONAL_ACCESS_TOKEN
          - CERTIFICATION
          type: string
        style: simple
      - description: Use this header to enable this experimental API.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      responses:
        "204":
          description: No content - indicates the request was successful but there
            is no content to be returned in the response.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createReminderEscalationTenantConfigV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
