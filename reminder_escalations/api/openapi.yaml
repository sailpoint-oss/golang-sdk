  schemas:
    Reminderescalationreminder:
      description: |
        One reminder schedule. Exactly one of `beforeDeadLine` or `activeAfter` is set.
        Every reminder in a ruleset must use the same predicate.
      example:
        cron: 0 9 * * *
        template: cert-reminder-daily
        maxFirings: 5
        beforeDeadLine: P7D
        activeAfter: P14D
      properties:
        cron:
          description: "Five-field cron expression, evaluated in UTC."
          example: 0 9 * * *
          type: string
        beforeDeadLine:
          default: ""
          description: |
            ISO-8601 duration. The reminder is active when `(deadline - now) <= beforeDeadLine`.
            A negative duration means the reminder starts after the deadline, for example `-P14D`.
            Mutually exclusive with `activeAfter`.
          example: P7D
          type: string
        activeAfter:
          default: ""
          description: |
            ISO-8601 duration. The reminder is active when `(now - workflowStart) >= activeAfter`.
            Mutually exclusive with `beforeDeadLine`.
          example: P14D
          type: string
        template:
          description: Notification template key.
          example: cert-reminder-daily
          type: string
        maxFirings:
          description: Maximum number of times this reminder fires before it deactivates.
            Null means the reminder keeps firing while its predicate is active.
          example: 5
          format: int32
          minimum: 1
          nullable: true
          type: integer
      required:
      - cron
      - template
      type: object
    Reminderescalationtrigger:
      description: |
        When an escalation fires. `triggerType` selects which fields apply.

        * `ON_CRON` requires `cron` and exactly one of `beforeDeadLine` or `activeAfter`. `maxFirings` is optional.
        * `AFTER_REMINDER_COUNT` requires `count` and `delay`. The ruleset must also contain at least one reminder.
      example:
        cron: 0 9 * * 1
        delay: PT12H
        maxFirings: 3
        beforeDeadLine: P7D
        count: 3
        triggerType: AFTER_REMINDER_COUNT
        activeAfter: P14D
      properties:
        triggerType:
          description: How this escalation decides when to fire.
          enum:
          - ON_CRON
          - AFTER_REMINDER_COUNT
          example: AFTER_REMINDER_COUNT
          type: string
        cron:
          default: ""
          description: Five-field cron expression. Required when `triggerType` is
            `ON_CRON`.
          example: 0 9 * * 1
          type: string
        beforeDeadLine:
          default: ""
          description: ISO-8601 duration relative to the deadline. Used when `triggerType`
            is `ON_CRON`. Mutually exclusive with `activeAfter`.
          example: P7D
          type: string
        activeAfter:
          default: ""
          description: ISO-8601 duration relative to workflow start. Used when `triggerType`
            is `ON_CRON`. Mutually exclusive with `beforeDeadLine`.
          example: P14D
          type: string
        maxFirings:
          description: Maximum number of times an `ON_CRON` escalation fires. Null
            means no cap.
          example: 3
          format: int32
          minimum: 1
          nullable: true
          type: integer
        count:
          description: Reminder count for the current assignee. Required when `triggerType`
            is `AFTER_REMINDER_COUNT`. Null when `triggerType` is `ON_CRON`.
          example: 3
          format: int32
          minimum: 1
          nullable: true
          type: integer
        delay:
          default: ""
          description: ISO-8601 grace period before an `AFTER_REMINDER_COUNT` escalation
            fires.
          example: PT12H
          type: string
      required:
      - triggerType
      type: object
    Reminderescalationtarget:
      description: |
        Escalation recipient. `identityId` is required for every `targetType` except `MANAGER_OF`, where it is optional.

        * `MANAGER_OF` without `identityId` resolves the manager of each current assignee.
        * `MANAGER_OF` with `identityId` resolves the manager of that identity.
      example:
        identityId: id-admin-99
        targetType: MANAGER_OF
      properties:
        targetType:
          description: Kind of recipient this target resolves to.
          enum:
          - MANAGER_OF
          - IDENTITY
          - GOVERNANCE_GROUP
          - ENTITLEMENT_OWNER
          - SOURCE_OWNER
          example: MANAGER_OF
          type: string
        identityId:
          default: ""
          description: Identity the target applies to. Empty for a dynamic `MANAGER_OF`
            target.
          example: id-admin-99
          type: string
      required:
      - targetType
      type: object
    Reminderescalationescalation:
      description: One escalation. Escalations in a ruleset are independent of each
        other.
      example:
        template: cert-escalation-mgr
        trigger:
          cron: 0 9 * * 1
          delay: PT12H
          maxFirings: 3
          beforeDeadLine: P7D
          count: 3
          triggerType: AFTER_REMINDER_COUNT
          activeAfter: P14D
        targets:
        - identityId: id-admin-99
          targetType: MANAGER_OF
        - identityId: id-admin-99
          targetType: MANAGER_OF
      properties:
        trigger:
          $ref: '#/components/schemas/Reminderescalationtrigger'
        targets:
          items:
            $ref: '#/components/schemas/Reminderescalationtarget'
          minItems: 1
          type: array
        template:
          description: Notification template key.
          example: cert-escalation-mgr
          type: string
      required:
      - targets
      - template
      - trigger
      type: object
    Reminderescalationfallback:
      description: Recipients used when an escalation cannot be delivered to its configured
        targets.
      example:
        template: cert-escalation-fallback-admin
        targets:
        - identityId: id-admin-99
          targetType: MANAGER_OF
        - identityId: id-admin-99
          targetType: MANAGER_OF
      properties:
        targets:
          description: "Last-resort recipients for this fallback. Each entry resolves\
            \ to a manager, identity, governance group, entitlement owner, or source\
            \ owner. At least one target is required."
          items:
