      security:
      - userAuth:
        - idn:reminder-escalation-config:read
      summary: Get Reminder Escalation Tenant Config
      tags:
      - Reminder Escalations
      x-sailpoint-userLevels:
      - ORG_ADMIN
    put:
      description: |-
        Replaces the tenant-default ruleset for a domain object type.
        Send the `revision` from the latest read. A stale revision returns 409.
      operationId: putReminderEscalationTenantConfigV1
      parameters:
      - description: Domain object type key.
        example: CERTIFICATION
        explode: false
        in: path
        name: domainObjectType
        required: true
        schema:
          enum:
          - PERSONAL_ACCESS_TOKEN
          - CERTIFICATION
          type: string
        style: simple
      - description: Use this header to enable this experimental API.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              bumpReminders:
                summary: Replace rules using the current revision
                value:
                  revision: 1
                  rules:
                    reminders:
                    - cron: 0 9 * * *
                      beforeDeadLine: P7D
                      template: cert-reminder-daily
                    escalations:
                    - trigger:
                        triggerType: AFTER_REMINDER_COUNT
                        count: 2
                        delay: PT4H
                      targets:
                      - targetType: MANAGER_OF
                      template: cert-escalation-mgr
            schema:
              $ref: '#/components/schemas/Reminderescalationtenantconfigupdate'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminderescalationtenantconfig'
          description: Tenant default updated.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createReminderEscalationTenantConfigV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
