components:
  examples:
    SimpleCampaignFilter:
      value:
        name: Campaign Filter
        description: Campaign Filter Description
        mode: EXCLUSION
        criteriaList:
        - criteriaType: ACCESS_PROFILE
          operation: EQUALS
          criteriaValue: Admin Access
          criteriaProperty: DISPLAY_NAME
    CompositeCampaignFilter:
      value:
        name: Composite Campaign Filter
        description: Campaign Filter Description
        mode: INCLUSION
        criteriaList:
        - criteriaType: COMPOSITE
          operation: AND
          children:
          - criteriaType: ACCOUNT_ATTRIBUTE
            criteriaProperty: department
            criteriaValue: Engineering
            operation: EQUALS
          - criteriaType: SOURCE
            criteriaProperty: DISPLAY_NAME
            criteriaValue: AD
            operation: EQUALS
    CampaignTemplates:
      value:
      - id: e7dbec99-d493-49c8-951b-d84f58a05120
        name: Manager Review
        description: A review of everyone's access by their manager.
        campaignName: Manager Review
        campaignDescription: Review everyone's access.
        deadlineDuration: P14D
        type: IDENTITY
        ownerId: 7ec252ac-bd42-4554-8bc2-5df22348cb75
        emailNotificationEnabled: true
        autoRevokeAllowed: false
        recommendationsEnabled: false
        sunsetCommentsRequired: true
        reviewer:
