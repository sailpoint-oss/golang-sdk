      security:
      - userAuth:
        - idn:campaign-filter:read
      summary: Get Campaign Filter by ID
      tags:
      - Next Generation Certification Campaigns
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - CERT_ADMIN
    put:
      description: "Updates an existing campaign filter using the filter's ID. Required\
        \ roles are ORG_ADMIN or CERT_ADMIN. The request body must not exceed 1 MiB\
        \ (1,048,576 bytes); larger requests are rejected with a 400 response."
      operationId: putCampaignFilterV1
      parameters:
      - description: Use this header to enable this experimental API.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      - description: The ID of the campaign filter being modified.
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: e9f9a139-7b84-2fd5-a658-42087040d3ac
          format: uuid
          type: string
        style: simple
        x-sailpoint-resource-operation-id: listGovCertificationCampaignFiltersV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignFilterUpdate'
        description: A campaign filter details with updated field values.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignFilterGet'
          description: Resource updated successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listGovCertificationCampaignFiltersV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
