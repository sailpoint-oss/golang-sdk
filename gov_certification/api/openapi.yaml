tags:
- description: "This API is flagged as Experimental while we are in the process of\
    \ migrating from the Legacy Certifications Engine to the Next Generation Certifications\
    \ Engine. This endpoint resolves only campaigns generated on the Next Generation\
    \ Certifications Engine. While we do not anticipate major changes, this API will\
    \ remain in this state until we have completed the full migration of the Legacy\
    \ Platform to the Next Generation Certifications Engine.\n\n### Certification\
    \ Campaign Filters\n\nUse this API to implement the certification campaign filter\
    \ functionality. These filters can be used to create a certification campaign\
    \ that includes a subset of your entitlements or users to certify.\n\nFor example,\
    \ if for a certification campaign an organization wants to certify only specific\
    \ users or entitlements, then those can be included/excluded on the basis of campaign\
    \ filters.\n\nFor more information about creating a campaign filter, refer to\
    \ [Creating a Campaign Filter](https://documentation.sailpoint.com/saas/help/certs/campaign_filters.html#creating-a-campaign-filter)\n\
    \nYou can create campaign filters using any of the following criteria types:\n\
    \n- Access Profile : This criteria type includes or excludes access profiles from\
    \ a campaign.\n\n- Account Attribute : This criteria type includes or excludes\
    \ certification items that match a specified value in an account attribute.\n\n\
    - Entitlement : This criteria type includes or excludes entitlements from a campaign.\n\
    \n- Identity : This criteria type includes or excludes specific identities from\
    \ your campaign.\n\n- Identity Attribute : This criteria type includes or excludes\
    \ identities based on whether they have an identity attribute that matches criteria\
    \ you've chosen.\n\n- Role : This criteria type includes or excludes roles, as\
    \ opposed to identities.\n\n- Source : This criteria type includes or excludes\
    \ entitlements from a source you select.\n\nFor more information about these criteria\
    \ types, refer to [Types of Campaign Filters](https://documentation.sailpoint.com/saas/help/certs/campaign_filters.html#types-of-campaign-filters)\n\
    \nOnce the campaign filter is created, it can be linked while creating the campaign.\
    \ The generated campaign will have the items to review as per the campaign filter.\n\
    \nFor example, an inclusion campaign filter is created with a source of Source\
    \ 1, an operation of Equals, and an entitlement of Entitlement 1. When this filter\
    \ is selected, only users who have Entitlement 1 are included in the campaign,\
    \ and only Entitlement 1 is shown in the certification.\n\n### Certification Campaigns\n\
    \nUse this API to implement certification campaign functionality.\nWith this functionality\
    \ in place, administrators can create, customize, and manage certification campaigns\
    \ for their organizations' use. \nCertification campaigns provide SailPoint Identity\
    \ Security users with an interactive review process they can use to identify and\
    \ verify access to systems. \nCampaigns help organizations reduce risk of inappropriate\
    \ access and satisfy audit requirements. \n\nA certification refers to SailPoint\
    \ Identity Security's mechanism for reviewing a user's access to entitlements\
    \ (sets of permissions) and approving or removing that access. \nThese certifications\
    \ serve as a way of showing that a user's access has been reviewed and approved.\
    \ \nMultiple certifications by different reviewers are often required to approve\
    \ a user's access. \nA set of multiple certifications is called a certification\
    \ campaign. \n\nFor example, an organization may use a Manager Certification campaign\
    \ as a way of showing that a user's access has been reviewed and approved by multiple\
    \ managers. \nOnce this campaign has been completed, SailPoint Identity Security\
    \ would provision all the access the user needs, nothing more. \n\nSailPoint Identity\
    \ Security provides two simple campaign types users can create without using search\
    \ queries, Manager and Source Owner campaigns:\n\nYou can create these types of\
    \ campaigns without using any search queries in SailPoint Identity Security: \n\
    \n- ManagerCampaign: SailPoint Identity Security provides this campaign type as\
    \ a way to ensure that an identity's access is certified by their managers. \n\
    You only need to provide a name and description to create one. \n\n- Source Owner\
    \ Campaign: SailPoint Identity Security provides this campaign type as a way to\
    \ ensure that an identity's access to a source is certified by its source owners.\
    \ \nYou only need to provide a name and description to create one. \nYou can specify\
    \ the sources whose owners you want involved or just run it across all sources.\
    \ \n\nFor more information about these campaign types, refer to [Starting a Manager\
    \ or Source Owner Campaign](https://documentation.sailpoint.com/saas/help/certs/starting_campaign.html).\n\
    \nOne useful way to create certification campaigns in SailPoint Identity Security\
    \ is to use a specific search and then run a campaign on the results returned\
    \ by that search. \nThis allows you to be much more specific about whom you are\
    \ certifying in your campaigns and what access you are certifying in your campaigns.\
    \ \nFor example, you can search for all identities who are managed by \"Amanda.Ross\"\
    \ and also have the access to the \"Accounting\" role and then run a certification\
    \ campaign based on that search to ensure that the returned identities are appropriately\
    \ certified. \n\nYou can use SailPoint Identity Security search queries to create\
    \ these types of campaigns: \n\n- Identities: Use this campaign type to review\
    \ and revoke access items for specific identities. \nYou can either build a search\
    \ query and create a campaign certifying all identities returned by that query,\
    \ or you can search for individual identities and add those identities to the\
    \ certification campaign. \n\n- Access Items: Use this campaign type to review\
    \ and revoke a set of roles, access profiles, or entitlements from the identities\
    \ that have them. \nYou can either build a search query and create a campaign\
    \ certifying all access items returned by that query, or you can search for individual\
    \ access items and add those items to the certification campaign. \n\n- Uncorrelated\
    \ Accounts: Use this campaign type to certify source accounts that aren't linked\
    \ to an authoritative identity in SailPoint Identity Security. \nYou can use this\
    \ campaign type to view all the uncorrelated accounts for a source and certify\
    \ them. \n\nFor more information about search-based campaigns, refer to [Starting\
    \ a Campaign from Search](https://documentation.sailpoint.com/saas/help/certs/starting_search_campaign.html).\n\
    \nOnce you have generated your campaign, it becomes available for preview. \n\
    An administrator can review the campaign and make changes, or if it's ready and\
    \ accurate, activate it. \n\nOnce the campaign is active, organization administrators\
    \ or certification administrators can designate other SailPoint Identity Security\
    \ users as certification reviewers. \nThose reviewers can view any of the certifications\
    \ they either need to review (active) or have already reviewed (completed).\n\n\
    When a certification campaign is in progress, certification reviewers see the\
    \ listed active certifications whose involved identities they can review. \nReviewers\
    \ can then make decisions to grant or revoke access, as well as reassign the certification\
    \ to another reviewer. If the reviewer chooses this option, they must provide\
    \ a reason for reassignment in the form of a comment.\n\nOnce a reviewer has made\
    \ decisions on all the certification's involved access items, he or she must \"\
    Sign Off\" to complete the review process.\nDoing so converts the certification\
    \ into read-only status, preventing any further changes to the review decisions\
    \ and deleting the work item (task) from the reviewer's list of work items. \n\
    \nOnce all the reviewers have signed off, the certification campaign either completes\
    \ or, if any reviewers decided to revoke access for any of the involved identities,\
    \ it moves into a remediation phase. \nIn the remediation phase, identities' entitlements\
    \ are altered to remove any entitlements marked for revocation.\nIn this situation,\
    \ the certification campaign completes once all the remediation requests are completed.\
    \ \n\nThe end of a certification campaign is determined by its deadline, its completion\
    \ status, or by an administrator's decision. \n\nFor more information about certifications\
    \ and certification campaigns, refer to [Certifications](https://documentation.sailpoint.com/saas/user-help/certs/reviewing/index.html).\n\
    \n### Certification Summaries\n\nUse this API to implement certification summary\
    \ functionality. \nWith this functionality in place, administrators and designated\
    \ certification reviewers can review summaries of identity certification campaigns\
    \ and draw conclusions about the campaigns' scope, security, and effectiveness.\
    \ \nImplementing certification summary functionality improves organizations' ability\
    \ to review their [certifications](https://documentation.sailpoint.com/saas/user-help/certs/reviewing/index.html)\
    \ and helps them satisfy audit and regulatory requirements by enabling them to\
    \ trace access changes and the decisions made in their review processes. \n\n\
    A certification refers to SailPoint Identity Security's mechanism for reviewing\
    \ a user's access to entitlements (sets of permissions) and approving or removing\
    \ that access. \nThese certifications serve as a way of showing that a user's\
    \ access has been reviewed and approved. \nMultiple certifications by different\
    \ reviewers are often required to approve a user's access. \nA set of multiple\
    \ certifications is called a certification campaign. \n\nFor example, an organization\
    \ may use a Manager Certification as a way of showing that a user's access has\
    \ been reviewed and approved by their manager, or if the certification is part\
    \ of a campaign, that the user's access has been reviewed and approved by multiple\
    \ managers. \nOnce this certification has been completed, SailPoint Identity Security\
    \  would provision all the access the user needs, nothing more. \n\nCertification\
    \ summaries provide information about identity certification campaigns such as\
    \ the identities involved, the number of decisions made, and the access changed.\
    \ \nFor example, an administrator or designated certification reviewer can examine\
    \ the Manager Certification campaign to get an overview of how many entitlement\
    \ decisions are made in that campaign as opposed to role decisions, which identities\
    \ would be affected by changes to the campaign, and how those identities' access\
    \ would be affected.\n\n### Certifications\n\nUse this API to implement certification\
    \ functionality. \nWith this functionality in place, administrators and designated\
    \ certification reviewers can review users' access certifications and decide whether\
    \ to approve access, revoke it, or reassign the review to another reviewer. \n\
    Implementing certifications improves organizations' data security by reducing\
    \ inappropriate access through a distributed review process and helping them satisfy\
    \ audit and regulatory requirements. \n\nA certification refers to SailPoint Identity\
    \ Security's mechanism for reviewing a user's access to entitlements (sets of\
    \ permissions) and approving or removing that access. \nThese serve as a way of\
    \ showing that a user's access has been reviewed and approved. \nMultiple certifications\
    \ by different reviewers are often required to approve a user's access. \nA set\
    \ of multiple certifications is called a certification campaign.\n\nFor example,\
    \ an organization may use a Manager Certification as a way of showing that a user's\
    \ access has been reviewed and approved by their manager, or if the certification\
    \ is part of a campaign, that the user's access has been reviewed and approved\
    \ by multiple managers. \nOnce this certification has been completed, SailPoint\
    \ Identity Security  would provision all the access the user needs, nothing more.\
    \ \n\nOrganization administrators or certification administrators can designate\
    \ other SailPoint Identity Security users as certification reviewers. \nThose\
    \ reviewers can select the 'Certifications' tab to view any of the certifications\
    \ they either need to review or have already reviewed under the 'Active' and 'Completed'\
    \ tabs, respectively. \n\nWhen a certification campaign is in progress, certification\
    \ reviewers will see certifications listed under 'Active,' where they can review\
    \ the involved identities. \nUnder the 'Decision' column on the right, next to\
    \ each access item, reviewers can select the checkmark to approve access, select\
    \ the 'X' to revoke access, or they can toggle the 'More Options' menu to reassign\
    \ the certification to another reviewer and provide a reason for reassignment\
    \ in the form of a comment. \n\nOnce a reviewer has made decisions on all the\
    \ certification's involved access items, he or she must select 'Sign Off' to complete\
    \ the review process.\nDoing so converts the certification into read-only status,\
    \ preventing any further changes to the review decisions and deleting the work\
    \ item (task) from the reviewer's list of work items. \n\nOnce all the reviewers\
    \ have signed off, the certification campaign either completes or, if any reviewers\
    \ decided to revoke access for any of the involved identities, it moves into a\
    \ remediation phase. In the remediation phase, identities' entitlements are altered\
    \ to remove any entitlements marked for revocation.\nIn this situation, the certification\
    \ campaign completes once all the remediation requests are completed.\n"
  name: Next Generation Certification Campaigns
paths:
  /certification-campaigns/v1/campaign-filters:
    get:
      description: |-
        Lists all Campaign Filters. Scope can be reduced via standard V3 query params.
        All Campaign Filters matching the query params. Required roles are ORG_ADMIN or CERT_ADMIN
      operationId: listGovCertificationCampaignFiltersV1
      parameters:
      - description: Use this header to enable this experimental API.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      - description: |-
          Max number of results to return.
          See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters) for more information.
        example: 250
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 250
          format: int32
          maximum: 250
          minimum: 0
          type: integer
        style: form
      - description: |-
          Offset into the full result set. Usually specified with *limit* to paginate through the results.
          See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters) for more information.
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: |-
          If *true* it will populate the *X-Total-Count* response header with the number of results that would be returned if *limit* and *offset* were ignored.

          Since requesting a total count can have a performance impact, it is recommended not to send **count=true** if that value will not be used.

          See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters) for more information.
        example: true
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 5b8a2ba8-6393-dd17-4495-c4436dd76b25
                name: Identity Attribute Inclusion Campaign Filter
                description: Includes identities whose display name contains "#".
                owner: SailPoint Support
                mode: INCLUSION
                criteriaList:
                - criteriaType: IDENTITY_ATTRIBUTE
                  operation: CONTAINS
                  criteriaProperty: displayName
                  criteriaValue: '#'
              schema:
                items:
                  $ref: '#/components/schemas/CampaignFilterGet'
                type: array
          description: List of campaign filter objects
          headers:
            X-Total-Count:
              description: "Total number of items, regardless of paging limits."
              explode: false
              schema:
                format: int64
                type: integer
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listGovCertificationCampaignFiltersV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listGovCertificationCampaignFiltersV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:campaign-filter-list:read
      summary: List Campaign Filters
      tags:
      - Next Generation Certification Campaigns
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - CERT_ADMIN
    post:
      description: "Create a campaign filter based on filter details and criteria.\
        \ Required roles are ORG_ADMIN or CERT_ADMIN. The request body must not exceed\
        \ 1 MiB (1,048,576 bytes); larger requests are rejected with a 400 response."
      operationId: createGovCertificationCampaignFilterV1
      parameters:
      - description: Use this header to enable this experimental API.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              Simple Campaign Filter:
                $ref: '#/components/examples/SimpleCampaignFilter'
              Composite Campaign Filter:
                $ref: '#/components/examples/CompositeCampaignFilter'
            schema:
              $ref: '#/components/schemas/CampaignFilterCreate'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignFilterGet'
          description: Created successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listGovCertificationCampaignFiltersV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listGovCertificationCampaignFiltersV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:campaign-filter:manage
      summary: Create a Campaign Filter
      tags:
      - Next Generation Certification Campaigns
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - CERT_ADMIN
  /certification-campaigns/v1/campaign-filters/{id}:
    get:
      description: Retrieves information for an existing campaign filter using the
        filter's ID. Required roles are ORG_ADMIN or CERT_ADMIN.
      operationId: getGovCertificationCampaignFilterByIdV1
      parameters:
      - description: Use this header to enable this experimental API.
        example: "true"
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      - description: The ID of the campaign filter to be retrieved.
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: e9f9a139-7b84-2fd5-a658-42087040d3ac
          format: uuid
          type: string
        style: simple
        x-sailpoint-resource-operation-id: listGovCertificationCampaignFiltersV1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignFilterGet'
          description: The data for the campaign filter matching the given ID.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listGovCertificationCampaignFiltersV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
