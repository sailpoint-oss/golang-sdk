      - expiryMins
      - frictionState
      - frictions
      title: JIT Activation Frictions Response
      type: object
    JITActivationFrictionPatchRequest:
      description: Submission for the current friction step.
      example:
        submittedData: ""
        bypass: false
        type: ""
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/JITActivationFrictionType'
          description: Kind of friction step being submitted.
        submittedData:
          allOf:
