openapi: 3.0.1
info:
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  description: "Use these APIs to interact with the SailPoint Identity Security platform\
    \ to achieve repeatable, automated processes with greater scalability. We encourage\
    \ you to join the SailPoint Developer Community forum at https://developer.sailpoint.com/discuss\
    \ to connect with other developers using our APIs."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://developer.sailpoint.com/discuss/tos
  title: SailPoint Identity Security API - JIT Activations
  version: v1
servers:
- description: This is the production API server.
  url: "https://{tenant}.api.identitynow.com"
  variables:
    tenant:
      default: sailpoint
      description: "This is the name of your tenant, typically your company's name."
- description: This is the versioned API server.
  url: "https://{apiUrl}"
  variables:
    apiUrl:
      default: sailpoint.api.identitynow.com
      description: This is the api url of your tenant
security:
- userAuth:
  - sp:scopes:all
tags:
- description: |
    Use this API to start and manage Just-In-Time (JIT) Privileged activation workflows for entitlement connections,
    to read and submit activation frictions, and to search activation history.

    OAuth scopes: **idn:jit-activation-workflow:*** (activate, extend, deactivate, manage) for workflow APIs.
    **idn:jit-activation-history:read** (admin history view) and **idn:jit-activation-history-self:read** (self history view).
  name: JIT Activations
paths:
  /jit-activations/v1/activate:
    post:
      description: |
        Starts a JIT Privileged (JIT P) activation workflow for the given entitlement connection and duration.
        The service performs quick validation; the workflow performs additional validation.

        The response is returned with HTTP 202 Accepted while the workflow initializes.
      operationId: startActivateWorkflowV1
      parameters:
      - description: Use this header to enable this experimental API.
        example: true
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JitActivationActivateRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitActivationActivateResponse'
          description: |
            Accepted. The activation workflow was accepted and is running.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startActivateWorkflowV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startActivateWorkflowV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:jit-activation-workflow:activate
        - idn:jit-activation-workflow:manage
      summary: Start JIT activation workflow
      tags:
      - JIT Activations
      x-sailpoint-userLevels:
      - USER
  /jit-activations/v1/deactivate:
    post:
      description: |
        Sends a signal to a running JIT Privileged (JIT P) activation workflow to deactivate.

        This request cannot be applied to a workflow that does not exist or whose execution has already completed.
        The client receives an error response in those cases.

        The response is returned with HTTP 202 Accepted after the signal is sent.
      operationId: startDeactivateWorkflowV1
      parameters:
      - description: Use this header to enable this experimental API.
        example: true
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JitActivationDeactivateRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitActivationDeactivateResponse'
          description: |
            Accepted. The deactivation signal was sent to the workflow.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startActivateWorkflowV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  summary: An example of a 404 response object
                  value:
                    detailCode: 404 Not found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server did not find a current representation for the
                        target resource.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - returned if the request URL refers to a resource
            or object that does not exist
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startActivateWorkflowV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:jit-activation-workflow:deactivate
        - idn:jit-activation-workflow:manage
      summary: Deactivate JIT activation workflow
      tags:
      - JIT Activations
      x-sailpoint-userLevels:
      - USER
  /jit-activations/v1/extend:
    post:
      description: |
        Sends a signal to a running JIT Privileged (JIT P) activation workflow to extend the activation period
        by the requested number of minutes.

        This request cannot be applied to a workflow that does not exist or whose execution has already completed.
        The client receives an error response in those cases.

        The response is returned with HTTP 202 Accepted after the signal is sent.
      operationId: startExtendWorkflowV1
      parameters:
      - description: Use this header to enable this experimental API.
        example: true
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JitActivationExtendRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitActivationExtendResponse'
          description: |
            Accepted. The extend signal was sent to the workflow.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startActivateWorkflowV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  summary: An example of a 404 response object
                  value:
                    detailCode: 404 Not found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server did not find a current representation for the
                        target resource.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - returned if the request URL refers to a resource
            or object that does not exist
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startActivateWorkflowV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:jit-activation-workflow:extend
        - idn:jit-activation-workflow:manage
      summary: Extend JIT activation workflow
      tags:
      - JIT Activations
      x-sailpoint-userLevels:
      - USER
  /jit-activations/v1/{activationId}/frictions:
    get:
      description: |
        Returns evaluated frictions for a JIT Privileged (JIT P) activation.

        Requires OAuth scope **idn:jit-activation-workflow:activate** or
        **idn:jit-activation-workflow:manage**. The JWT identity id must match the
        activation identity.

        Returns HTTP 403 when **PSPM_JIT_ACCESS_ACTIVATION** or
        **PSPM_JIT_ACCESS_ACTIVATION_15** is disabled.

        Returns HTTP 404 when the activation does not exist.
      operationId: getJitActivationFrictionsV1
      parameters:
      - description: Identifier of the activation.
        example: 857fb802-1034-786a-151e-d3a56e4c5bd9
        explode: false
        in: path
        name: activationId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
        x-sailpoint-resource-operation-id: startActivateWorkflowV1
      - description: Use this header to enable this experimental API.
        example: true
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              examples:
                pendingPopulation:
                  summary: Policy still evaluating
                  value:
                    activationId: 857fb802-1034-786a-151e-d3a56e4c5bd9
                    frictionState: PENDING
                    connectionId: 757fb803-9024-5861-e510-83a56e4c5bd3
                    activationInitTime: 2026-05-08T18:33:52.029Z
                    expiryMins: "5"
                    frictions: []
                inProgress:
                  summary: Ticket step active
                  value:
                    activationId: 857fb802-1034-786a-151e-d3a56e4c5bd9
                    frictionState: IN_PROGRESS
                    connectionId: 757fb803-9024-5861-e510-83a56e4c5bd3
                    activationInitTime: 2026-05-08T18:33:52.029Z
                    expiryMins: "5"
                    frictions:
                    - type: TICKET
                      status: ACTIVE
                      bypassAllowed: false
                      submittedData: null
                    - type: JUSTIFICATION
                      status: PENDING
                      bypassAllowed: false
                      minWords: 5
                      submittedData: null
                    - type: REAUTHENTICATION
                      status: PENDING
                      bypassAllowed: false
                      submittedData: null
                notApplicable:
                  summary: No frictions required
                  value:
                    activationId: 857fb802-1034-786a-151e-d3a56e4c5bd9
                    frictionState: NOT_APPLICABLE
                    connectionId: 757fb803-9024-5861-e510-83a56e4c5bd3
                    activationInitTime: 2026-05-08T18:33:52.029Z
                    expiryMins: "5"
                    frictions: []
                complete:
                  summary: Every friction step complete
                  value:
                    activationId: 857fb802-1034-786a-151e-d3a56e4c5bd9
                    frictionState: COMPLETE
                    connectionId: 757fb803-9024-5861-e510-83a56e4c5bd3
                    activationInitTime: 2026-05-08T18:33:52.029Z
                    expiryMins: "5"
                    frictions:
                    - type: TICKET
                      status: COMPLETE
                      bypassAllowed: false
                      submittedData:
                        ticketId: SN-123
                        isValidTicket: true
                        bypass: false
                    - type: JUSTIFICATION
                      status: COMPLETE
                      bypassAllowed: false
                      minWords: 5
                      submittedData:
                        justification: Current P1 requires activation to mitigate
                        bypass: false
                    - type: REAUTHENTICATION
                      status: COMPLETE
                      bypassAllowed: false
                      submittedData:
                        reauthSuccessful: true
                        reauthDate: 2026-05-08T18:40:00.000Z
                        bypass: false
              schema:
                $ref: '#/components/schemas/JITActivationFrictionsResponse'
          description: Friction state for the activation.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: |
            Frictions could not be loaded within 30 seconds after activation start, or the activation
            was denied or failed.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startActivateWorkflowV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  summary: An example of a 404 response object
                  value:
                    detailCode: 404 Not found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server did not find a current representation for the
                        target resource.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - returned if the request URL refers to a resource
            or object that does not exist
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startActivateWorkflowV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:jit-activation-workflow:activate
        - idn:jit-activation-workflow:manage
      summary: Get JIT activation frictions
      tags:
      - JIT Activations
      x-sailpoint-userLevels:
      - USER
    patch:
      description: |
        Submits the current friction step for a JIT Privileged (JIT P) activation.

        Requires OAuth scope **idn:jit-activation-workflow:activate** or
        **idn:jit-activation-workflow:manage**. The JWT identity id must match the
        activation identity.

        Returns HTTP 403 when **PSPM_JIT_ACCESS_ACTIVATION** or
        **PSPM_JIT_ACCESS_ACTIVATION_15** is disabled.

        Request bodies larger than 16 KB return HTTP 413.
      operationId: patchJitActivationFrictionsV1
      parameters:
      - description: Identifier of the activation.
        example: 857fb802-1034-786a-151e-d3a56e4c5bd9
        explode: false
        in: path
        name: activationId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
        x-sailpoint-resource-operation-id: startActivateWorkflowV1
      - description: Use this header to enable this experimental API.
        example: true
        explode: false
        in: header
        name: X-SailPoint-Experimental
        required: true
        schema:
          default: "true"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              submitJustification:
                summary: Submit the active justification step
                value:
                  type: JUSTIFICATION
                  submittedData:
                    justification: Current P1 requires activation to mitigate
                  bypass: false
              submitTicket:
                summary: Submit the active ticket step
                value:
                  type: TICKET
                  submittedData:
                    ticketId: SN-123
              submitReauthentication:
                summary: Submit the active reauthentication step
                value:
                  type: REAUTHENTICATION
                  submittedData:
                    reauthSuccessful: true
                    reauthDate: 2026-05-08T18:40:00.000Z
              bypassActiveStep:
                summary: Bypass the active step
                value:
                  type: TICKET
                  bypass: true
            schema:
              $ref: '#/components/schemas/JITActivationFrictionPatchRequest'
        description: Submission for the current friction step.
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                ticketSubmitted:
                  summary: Ticket submitted
                  value:
                    activationId: 857fb802-1034-786a-151e-d3a56e4c5bd9
                    frictionState: IN_PROGRESS
                    connectionId: 757fb803-9024-5861-e510-83a56e4c5bd3
                    activationInitTime: 2026-05-08T18:33:52.029Z
                    expiryMins: "5"
                    frictions:
                    - type: TICKET
                      status: COMPLETE
                      bypassAllowed: false
                      submittedData:
                        ticketId: SN-123
                        isValidTicket: true
                        bypass: false
                    - type: JUSTIFICATION
                      status: ACTIVE
                      bypassAllowed: false
                      minWords: 5
                      submittedData: null
                    - type: REAUTHENTICATION
                      status: PENDING
                      bypassAllowed: false
                      submittedData: null
              schema:
                $ref: '#/components/schemas/JITActivationFrictionsResponse'
          description: Updated friction state for the activation.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: |
            Invalid friction submission, or the activation is not awaiting frictions. This includes
            frictions that are not loaded yet, a type that is not the active step, and ticket or
            justification validation failures.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startActivateWorkflowV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "404":
          content:
            application/json:
              examples:
                "404":
                  summary: An example of a 404 response object
                  value:
                    detailCode: 404 Not found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server did not find a current representation for the
                        target resource.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Not Found - returned if the request URL refers to a resource
            or object that does not exist
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Request body exceeds the 16 KB limit.
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startActivateWorkflowV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:jit-activation-workflow:activate
        - idn:jit-activation-workflow:manage
      summary: Submit JIT activation friction
      tags:
      - JIT Activations
      x-sailpoint-userLevels:
      - USER
  /jit-activation-history/v1:
    get:
      description: |
        Returns JIT activation history records for the tenant.

        This is the admin/operator view - it returns activations across all identities in the tenant.
        Requires `idn:jit-activation-history:read`.

        Returns HTTP 403 when the `PSPM_858_JIT_ACCESS_ACTIVATION_HISTORY_SEARCH` feature flag is disabled.
      operationId: listJitActivationHistoryV1
      parameters:
      - description: |-
          Max number of results to return.
          See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters) for more information.
        example: 250
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 250
          format: int32
          maximum: 250
          minimum: 0
          type: integer
        style: form
      - description: |-
          Offset into the full result set. Usually specified with *limit* to paginate through the results.
          See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters) for more information.
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: |-
