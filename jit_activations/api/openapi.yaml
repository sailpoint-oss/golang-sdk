            error.
      security:
      - userAuth:
        - idn:jit-activation-workflow:extend
        - idn:jit-activation-workflow:manage
      summary: Extend JIT activation workflow
      tags:
      - JIT Activations
      x-sailpoint-userLevels:
      - USER
  /jit-activation-history/v1:
    get:
      description: |
        Returns JIT activation history records for the tenant.

        This is the admin/operator view - it returns activations across all identities in the tenant.
        Requires `idn:jit-activation-history:read`.

        Returns HTTP 403 when the `PSPM_858_JIT_ACCESS_ACTIVATION_HISTORY_SEARCH` feature flag is disabled.
      operationId: listJitActivationHistoryV1
      parameters:
      - description: |-
          Max number of results to return.
          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: 250
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 250
          format: int32
          maximum: 250
          minimum: 0
          type: integer
        style: form
      - description: |-
          Offset into the full result set. Usually specified with *limit* to paginate through the results.
          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: |-
          If *true* it will populate the *X-Total-Count* response header with the number of results that would be returned if *limit* and *offset* were ignored.

          Since requesting a total count can have a performance impact, it is recommended not to send **count=true** if that value will not be used.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters) for more information.
        example: true
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: |-
          Sort results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)

          Sorting is supported for the following fields: **activationInitiated, provisionCompleted, status**

          Default sort is **-activationInitiated** (newest first).
        example: -activationInitiated
        explode: true
        in: query
        name: sorters
        required: false
        schema:
          format: comma-separated
          type: string
        style: form
      - description: |-
          Used to begin the search window at the values specified. This parameter consists of the last values of the sorted fields in the current record set.

          searchAfter length must match the number of sorters. Used to paginate beyond the offset limit of 10,000.

          It is recommended to always include the ID of the object in addition to any other sort fields to ensure no duplicate results while paging.

          For example, if sorting by activationInitiated you will also want to include ID: searchAfter=2026-07-08T14:33:52.029Z,367fb802-1026-1835-a619-11a56e4c5be3&sorters=activationInitiated,id
        example: "2026-07-08T14:33:52.029Z,367fb802-1026-1835-a619-11a56e4c5be3"
        explode: true
        in: query
        name: searchAfter
        required: false
        schema:
          format: comma-separated
          type: string
        style: form
      - description: |-
          Filter results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)

          Filtering is supported for the following fields and operators:

          **identityId**: *eq, in*

          **entitlementId**: *eq, in*

          **sourceId**: *eq*

          **connectionId**: *eq*

          **status**: *eq, in*

          **activationInitiated**: *gt, lt, ge, le*

          **policyFrictionOutcome**: *eq, in*
        example: status eq "PROVISIONED"
        explode: true
        in: query
        name: filters
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Jitactivationhistorydocument'
                type: array
          description: List of JIT activation history records matching the request.
          headers:
            X-Total-Count:
              description: The total result count (returned when count=true is passed).
              explode: false
              schema:
                format: int32
                type: integer
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Client Error - Returned if the request body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startActivateWorkflowV1_401_response'
          description: "Unauthorized - Returned if there is no authorization header,\
            \ or if the JWT token is expired."
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: "Forbidden - Returned if the user you are running as, doesn't\
            \ have access to this end-point."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startActivateWorkflowV1_429_response'
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
        "500":
          content:
            application/json:
              examples:
                "500":
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
          description: Internal Server Error - Returned if there is an unexpected
            error.
      security:
      - userAuth:
        - idn:jit-activation-history:read
      summary: List JIT activation history (admin)
      tags:
      - JIT Activations
      x-sailpoint-userLevels:
      - ORG_ADMIN
  /jit-activation-history/v1/current-identity:
    get:
      description: |
