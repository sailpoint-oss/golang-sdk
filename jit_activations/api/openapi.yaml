        example: status eq "PROVISIONED"
        explode: true
        in: query
        name: filters
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Jitactivationhistorydocument'
                type: array
          description: List of JIT activation history records for the authenticated
